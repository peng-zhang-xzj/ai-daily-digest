3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"657\" y=\"186\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"542\" y=\"209\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"565\" y=\"209\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"588\" y=\"209\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"611\" y=\"209\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"634\" y=\"209\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"657\" y=\"209\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"542\" y=\"232\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"565\" y=\"232\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"588\" y=\"232\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"611\" y=\"232\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"634\" y=\"232\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"657\" y=\"232\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"542\" y=\"255\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"565\" y=\"255\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"588\" y=\"255\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"611\" y=\"255\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"634\" y=\"255\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"657\" y=\"255\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"542\" y=\"278\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"565\" y=\"278\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"588\" y=\"278\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"611\" y=\"278\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"634\" y=\"278\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"657\" y=\"278\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"771\" y=\"190\" font-size=\"27\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"771\" dy=\"0\">336×336</tspan>\n</text>\n<text x=\"771\" y=\"224\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"771\" dy=\"0\">24×24 patch</tspan>\n</text>\n<text x=\"771\" y=\"258\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"771\" dy=\"0\">576 个视觉位置</tspan>\n</text>\n<rect x=\"542\" y=\"324\" width=\"344\" height=\"99\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"714.0\" y=\"356\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"714.0\" dy=\"0\">2 层 MLP</tspan>\n</text>\n<text x=\"714.0\" y=\"387\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"714.0\" dy=\"0\">映射到 LLM 隐藏维度</tspan>\n</text>\n<text x=\"37\" y=\"520\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"37\" dy=\"0\">分辨率：改变位置数量        连接器：主要改变特征空间 / 映射能力</tspan>\n</text>\n</g></svg><figcaption>初版经典配置为224分辨率、256patch与线性投影；1.5常用336分辨率、576patch与两层MLP。增加分辨率改变位置数，改变连接器深度不必改变位置数。 网格仅为缩略示意；真实网格分别是 16×16 与 24×24。</figcaption></figure>\n  <table><tr><th>示例</th><th>图像输入</th><th>ViT patch</th><th>视觉patch数</th><th>连接器</th></tr><tr><td>初版LLaVA典型配置</td><td>224×224</td><td>14×14</td><td>16×16=256</td><td>线性投影</td></tr><tr><td>本讲LLaVA-1.5-7B</td><td>336×336</td><td>14×14</td><td>24×24=576</td><td>两层MLP</td></tr></table>\n  <p>这是代表配置，不能把“LLaVA”这个系列名当作所有版本固定576的保证。不同checkpoint和预处理可能有不同输入、token组织和隐藏维度。下面固定使用1.5的典型接口解释，因此所有shape都跟这个例子对应。</p>\n  <h3>3. 从像素到视觉特征，逐步看shape</h3>\n  <p>一张RGB图片原始是<code>[H,W,3]</code>。预处理先缩放/裁剪或按该checkpoint规则处理成336×336，并归一化像素值。原图本来是672×672，并不意味着这个固定分辨率模型就读取了672×672的细节；processor可能仍输出336×336。</p>\n  <p>进入视觉编码器时，常用张量格式是<code>[B,3,336,336]</code>，B表示一次处理多少张图。每个14×14×3的patch有588个原始数字，通过可学习patch投影映成视觉向量，然后在视觉Transformer里与其他patch交换信息。</p>\n  <p>CLIP ViT-L/14的patch特征典型宽度为1024。视觉模型内部还可能有汇总用的CLS token，产生577个位置；LLaVA通常选择指定层的patch特征、去掉CLS，得到<code>[B,576,1024]</code>。取哪一层、是否去CLS，是模型配置，不是随意可替换的细节。</p>\n  <p>因为ViT已经让patch彼此交流，一个patch输出向量可以包含其他位置的信息。因此“576个patch token”不等于“576个互不联系的小图片标签”。</p>\n  <h3>4. 连接器改变维度，保留位置数量</h3>\n  <p>1.5的MLP可示意为：</p>\n  <p><code>Z = W₂ GELU(W₁ A + b₁) + b₂</code>。</p>\n  <p>A的形状是<code>[B,576,1024]</code>，第一层把每行映到4096维，经过GELU非线性，第二层输出4096维。这里4096对应本例Vicuna-7B的语言隐藏宽度，不是所有LLM统一宽度。</p>\n  <p>因此Z形状为<code>[B,576,4096]</code>。MLP沿最后一维作用于每个位置，不把576压成32，也不生成576个离散词表id。对每个patch，模型得到的是可直接作为LLM输入的连续向量。</p>\n  <p>这个两层投影大约有<code>1024×4096 + 4096×4096 + 两个bias</code>，约2098万参数。相对7B语言模型，新接口较小；但前向、激活和训练数据成本依然存在。“只更新连接器”也不等于“完全不运行LLM”。</p>\n  <h3>5. 与文字怎么拼：token id与输入向量不能混为一谈</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 650\" role=\"img\" aria-labelledby=\"l4-llava-shapes-title l4-llava-shapes-desc\" class=\"d1-figure\">\n<title id=\"l4-llava-shapes-title\">LLaVA-1.5：像素如何变成 LLM 的输入向量？</title><desc id=\"l4-llava-shapes-desc\">典型7B配置中，336方图得到576个1024维patch特征，经两层MLP变成576个4096维输入向量；文字id查嵌入表后，与视觉向量沿序列长度维拼接。</desc>\n<defs><marker id=\"l4-llava-shapes-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"648\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">LLaVA-1.5：像素如何变成 LLM 的输入向量？</tspan>\n</text>\n<rect x=\"35\" y=\"109\" width=\"190\" height=\"128\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"37\" y=\"192.2\" width=\"186\" height=\"42.24\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"183.20000000000002\" cy=\"137.16\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"92.0\" y=\"169.16\" width=\"57.0\" height=\"25.6\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"149.0\" cy=\"166.6\" r=\"17.92\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M143.3,152.52 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"99.60000000000001\" y=\"189.64\" width=\"8\" height=\"20.48\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"135.7\" y=\"189.64\" width=\"8\" height=\"20.48\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M92.0,178.12 L78.7,158.92000000000002\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"156.60000000000002\" cy=\"162.76\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<text x=\"130\" y=\"269\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"130\" dy=\"0\">[B, 3, 336, 336]</tspan>\n</text>\n<rect x=\"275\" y=\"113\" width=\"244\" height=\"121\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"397.0\" y=\"145\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"397.0\" dy=\"0\">ViT-L/14</tspan>\n</text>\n<text x=\"397.0\" y=\"176\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"397.0\" dy=\"0\">24×24 = 576 patch</tspan>\n<tspan x=\"397.0\" dy=\"27.55\">[B, 576, 1024]</tspan>\n</text>\n<path d=\"M236,174 L259,174\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l4-llava-shapes-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"569\" y=\"113\" width=\"343\" height=\"121\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"740.5\" y=\"145\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"740.5\" dy=\"0\">2 层 MLP 连接器</tspan>\n</text>\n<text x=\"740.5\" y=\"176\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"740.5\" dy=\"0\">1024 → 4096</tspan>\n<tspan x=\"740.5\" dy=\"27.55\">[B, 576, 4096]</tspan>\n</text>\n<path d=\"M530,174 L554,174\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l4-llava-shapes-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"37\" y=\"333\" width=\"262\" height=\"110\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"168.0\" y=\"365\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"168.0\" dy=\"0\">文字 token id</tspan>\n</text>\n<text x=\"168.0\" y=\"396\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"168.0\" dy=\"0\">查 embedding 表</tspan>\n<tspan x=\"168.0\" dy=\"27.55\">[B, N文本, 4096]</tspan>\n</text>\n<rect x=\"403\" y=\"344\" width=\"510\" height=\"81\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<rect x=\"414\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<rect x=\"462\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<rect x=\"510\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<rect x=\"558\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<rect x=\"606\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<rect x=\"654\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<rect x=\"708\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<rect x=\"756\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<rect x=\"804\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<rect x=\"852\" y=\"356\" width=\"40\" height=\"56\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"550\" y=\"464\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-acc\">\n<tspan x=\"550\" dy=\"0\">视觉向量：576 个</tspan>\n</text>\n<text x=\"806\" y=\"464\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-grn\">\n<tspan x=\"806\" dy=\"0\">文字向量</tspan>\n</text>\n<path d=\"M741,245 L741,311 L549,311 L549,335\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l4-llava-shapes-arrow)\" class=\"d1-s-acc\" />\n<path d=\"M309,387 L387,387\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l4-llava-shapes-arrow)\" class=\"d1-s-grn\" />\n<rect x=\"404\" y=\"511\" width=\"509\" height=\"88\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"658.5\" y=\"543\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"658.5\" dy=\"0\">LLM 因果生成</tspan>\n</text>\n<text x=\"658.5\" y=\"574\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"658.5\" dy=\"0\">[B, 576 + N文本, 4096]</tspan>\n</text>\n<path d=\"M657,477 L657,501\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l4-llava-shapes-arrow)\" class=\"d1-s-acc\" />\n<text x=\"39\" y=\"529\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"39\" dy=\"0\">视觉向量无需先变成</tspan>\n<tspan x=\"39\" dy=\"30.45\">文字词表中的整数 id。</tspan>\n</text>\n</g></svg><figcaption>典型7B配置中，336方图得到576个1024维patch特征，经两层MLP变成576个4096维输入向量；文字id查嵌入表后，与视觉向量沿序列长度维拼接。 典型 LLaVA-1.5-7B 教学配置；图未画特殊标记和模板细节。</figcaption></figure>\n  <p>文本先由tokenizer切成离散id，再通过embedding表查出<code>[B,T,4096]</code>的向量。视觉分支不查这个表，直接提供Z。模型最终接收到同一宽度的一串向量，例如：</p>\n  <div class=\"flow\">[对话前缀文字向量]\n[视觉向量1]...[视觉向量576]\n[问题文字向量：图里有什么？]\n[助手回答前缀]</div>\n  <p>源码中的<code>&lt;image&gt;</code>常是放置图像的边界标记，不是整张图只占一个向量。不同实现可能在模型内部用视觉向量替换标记，也可能在processor里展开相应占位token；最后要以LLM实际接收的向量长度为准，不能只打印原始字符串就宣称“图像仅一个token”。</p>\n  <p>进入LLM后，因果掩码让每个输出位置只能读取之前的位置，避免在训练时偷看未来答案。位置编码、对话模板和attention mask也必须一致。视觉信息的位置安排可以变化，不保证总是最前面；本图展示一种常见组织。</p>\n  <p>LLM无需另一个专门的“看图语法解析器”，但这也不意味着视觉与词在语义上完全相同。它们只共享输入接口与后续计算维度，训练让模型学会利用不同来源的表示。</p>\n  <h3>6. 两阶段训练分别解决什么</h3>\n  <p>阶段一，特征对齐：用图像与描述，冻结视觉编码器和LLM，只更新投影。训练目标是让视觉前缀帮助冻结LLM预测描述文本。这与CLIP双塔的对比损失不同：这里已经经过语言解码器，以生成词为目标训练新接口。</p>\n  <p>阶段二，视觉指令微调：用“图像+用户问题+助手回答”的数据，继续更新连接器，并更新LLM，典型1.5仍冻结视觉编码器。模型学习的不只是图里有哪些东西，还包括按问题选择信息、组织回答、遵循格式和多轮上下文。</p>\n  <p>若只有“狗在草地上”的caption，模型可能会描述，却不会自动懂“只返回JSON”“给我三条依据”。反过来，若只有精美对话但视觉事实不忠实，模型容易把错误细节也学进生成习惯。</p>\n  <h3>7. GPT-4合成指令具体做了什么</h3>\n  <p>初期缺少大规模图像—对话数据。LLaVA让纯文本GPT-4读取图像已有的caption与物体框等文字信息，再生成描述、多轮问答或推理题。例如给“狗在草地上”和狗、球的位置框，可以要求生成“球在狗的哪一侧”这类问题。</p>\n  <p>纯文本GPT-4没有直接看到原图；它只能依赖输入的符号描述。若caption没有写天气，GPT-4补出“晴朗蓝天”就可能无依据；若边界框信息有误，生成空间推理也可能误导。所谓合成省人工，不等于零成本：有API调用、图像源准备、去重、过滤和验证成本。</p>\n  <p>初版论文描述158K规模的合成指令样本；1.5后续还引入学术VQA等混合数据。不能把“初版怎么造数据”说成所有版本训练集完全相同。读新模型时应把架构、数据、训练阶段作为一起变化的配方。</p>\n  <h3>8. 可运行接口算例：连续视觉向量不需要词表id</h3>\n  <p>下面用小维度模拟接口。它没有视觉编码器和已训练的LLM，只验证形状与因果序列组织。</p>\n  <div class=\"flow\">import torch\nfrom torch import nn\n\ntorch.manual_seed(4)\nvision = torch.randn(1, 4, 16)     # 4个视觉位置\nprojector = nn.Sequential(nn.Linear(16, 32), nn.GELU(), nn.Linear(32, 32))\nword_embedding = nn.Embedding(100, 32)\ntext_ids = torch.tensor([[10, 11, 12]])\nvisual_inputs = projector(vision) # [1,4,32]，没有视觉离散id\ntext_inputs = word_embedding(text_ids) # [1,3,32]\nsequence = torch.cat([visual_inputs, text_inputs], dim=1)\ncausal_mask = torch.triu(torch.ones(7, 7, dtype=torch.bool), diagonal=1)\nlayer = nn.TransformerEncoderLayer(32, 4, 64, dropout=0., batch_first=True)\nhidden = layer(sequence, src_mask=causal_mask)\nprint(sequence.shape, hidden.shape)  # [1,7,32]、[1,7,32]</div>\n  <p>这里的True表示阻止读取未来位置。生产模型还需要与checkpoint相符的位置编码、模板、缓存等；此代码不能代替完整LLaVA推理。真实processor接口实验在Lab中，可以验证336/672输入都得到576视觉占位token。</p>\n  <h3>9. 极简范式的收益与边界</h3>\n  <p>收益是结构容易复用：视觉编码器、投影、现成LLM形成清晰边界，数据与训练方式可以独立实验。局限也沿这条链路出现：低分辨率可能先丢小字；不压缩的patch输入让语言序列变长；指令合成会引入幻觉；语言先验可能盖过视觉证据。</p>\n  <p>例如问图片里小标签上的价格，原图数字本来清楚，但预处理到336后不可辨认，后续更强LLM也无法从被删除的信息里可靠恢复数字。“回答更流畅”不说明“看得更清”。下一讲的数据以及L6分辨率和连接器，是继续拆解这些瓶颈。</p>\n  <h3>练习</h3>\n  <details class=\"quiz\"><summary>🧠 336输入、patch14、去掉CLS后有多少视觉位置？——</summary><div class=\"qa\"><b>答:</b>24×24=576；若保留CLS则另加1，不能混算。</div></details>\n  <details class=\"quiz\"><summary>🧠 <code>[576,1024]</code>经逐位置MLP变为<code>[576,4096]</code>，是否增加了图像实际细节？——</summary><div class=\"qa\"><b>答:</b>改变表示接口，不凭空恢复输入已丢失的信息。</div></details>\n  <details class=\"quiz\"><summary>🧠 为什么图像不需要一个576项“视觉词表”？——</summary><div class=\"qa\"><b>答:</b>本路径用连续向量直接进入LLM，视觉位置数不等于离散词表大小。</div></details>\n  <details class=\"quiz\"><summary>🧠 阶段一LLM冻结，为什么仍需要运行它？——</summary><div class=\"qa\"><b>答:</b>描述概率和损失来自LLM前向，梯度需经其计算传回投影。</div></details>\n  <details class=\"quiz\"><summary>🧠 两种模型都叫“视觉指令微调”，数据配方是否一样？——</summary><div class=\"qa\"><b>答:</b>不一定，要逐个检查数据来源、格式、规模、质量和冻结策略。</div></details>\n  "},
{id:"l5", grp:"今生 · 视觉指令与通用VLM", kick:"Lecture 5", title:"数据的艺术", lead:"数据是 VLM 效果的天花板——比结构更决定上限。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议授课35–40分钟。前置:看过 L4 的两阶段训练(对齐预训练 + 指令微调)、知道「监督信号 = 告诉模型哪个 token 该出现」。本讲不需要新数学,重点是把「数据」从抽象口号落到一条条具体记录上。<br>学完应能:读懂一条真实的图文指令数据记录;把一批原始网络图文走一遍清洗流水线;用 token 预算算一次「一条样本到底监督了多少」;并说清为什么「长 caption」和「堆数量」都可能帮倒忙。</div>\n  <h3>1. 为什么数据常常比结构更决定上限</h3>\n  <p>同一套模型结构,喂不同数据,能力天差地别。一个粗略但好用的判断:结构决定模型「能不能学到某种能力」,数据决定它「实际学成什么样」。所以评估一个 VLM,除了问它用什么连接器,更要问:它的数据怎么来的、洗没洗、怎么配的。</p>\n  <h3>2. 两类数据,对应两个阶段(但不是非黑即白)</h3>\n  <table><tr><th>类型</th><th>主要用在</th><th>形态</th><th>更看重</th></tr><tr><td>对齐/预训练数据</td><td>阶段① 对齐</td><td>图 + 短 caption</td><td>规模与覆盖面(把视觉对齐到语言、灌常识)</td></tr><tr><td>指令/SFT 数据</td><td>阶段② 指令微调</td><td>图 + 多轮对话/问答</td><td>质量与任务针对性</td></tr></table>\n  <p>常见说法是「对齐吃数量、指令吃质量」。这是<b>粗略倾向,不是一刀切</b>:对齐数据也要做基本清洗(太脏会拖累对齐),指令数据也需要一定规模覆盖多种任务。更准确的说法是:<b>两个阶段都要兼顾数量与质量,只是侧重不同</b>。</p>\n  <h3>3. 一条真实的指令数据记录长什么样</h3>\n  <p>指令微调数据不是「图 + 一句话」,而是「图 + 一段多轮对话」。下面是一条<b>教学合成记录</b>(字段结构仿 LLaVA 风格,图片与答案均为教学构造,<b>不是</b>对某张真实图片的标注):</p>\n  <div class=\"flow\">{\n  \"id\": \"synthetic_demo_001\",\n  \"image\": \"demo/street_scene_0001.jpg\",\n  \"conversations\": [\n    {\"from\": \"human\", \"value\": \"&lt;image&gt;\\n图里的人在做什么?\"},\n    {\"from\": \"gpt\",   \"value\": \"一位穿黄色上衣的男子正骑着摩托车,行驶在湿滑的柏油路上。\"},\n    {\"from\": \"human\", \"value\": \"他戴头盔了吗?\"},\n    {\"from\": \"gpt\",   \"value\": \"戴了,是一顶红色头盔。\"}\n  ]\n}</div>\n  <p>(真实数据集如 COCO 的记录结构与此一致,但每条都对应一张可核验的真实图片与人工/模型标注;这里用合成例子只为讲清字段。)</p>\n  <p>字段含义:</p>\n  <ul><li><code>image</code>:图片的相对路径,训练时由视觉编码器读入,<b>在序列里被展开成视觉 token</b>。</li><li><code>&lt;image&gt;</code> 占位符:标记图像 token 在文本序列里的插入位置(前面 L4 的「视觉前缀」)。</li><li><code>conversations</code>:多轮对话,<code>human</code> 是提问(<b>不计入 loss</b>),<code>gpt</code> 是标准答案(<b>计入 loss</b>,是真正的监督信号)。</li><li>多轮的意义:训练模型「结合上文 + 图」继续答,而不只是单轮描述。</li></ul>\n  <h3>4. 三个核心数据技巧</h3>\n  <h4>① Re-caption:把脏 alt 文本重写成高质量描述</h4>\n  <p>网络图配的 alt 文本极脏(<code>IMG_1234.jpg</code>、一串话题标签),和图几乎无关。做法是用一个强 VLM 给图<b>重新生成</b>详细、准确的描述来替换它(代表工作 ShareGPT4V)。收益:细粒度能力显著提升;代价:要花算力,且会<b>继承 captioner 自己的幻觉</b>,越强的 captioner 幻觉越隐蔽,越要抽检。</p>\n  <p>注意区分:<b>清洗</b>是去噪/过滤/去重,不会无中生有补事实;<b>re-caption</b> 是一次全新的标注,可能引入新信息也可能引入新错误。</p>\n  <h4>② 用 LLM 合成指令数据(LLaVA 那招)</h4>\n  <p>LLaVA 把图的 caption + 物体坐标(都是文字)喂给<b>纯文本 GPT-4</b>,让它脑补出上面那种多轮对话。零门槛造出几十万条。局限很直接:合成模型<b>没真看图</b>,可能脑补出图里没有的细节——这是幻觉数据的源头之一(L8 再谈)。</p>\n  <h4>③ 全开放数据范式(Molmo / PixMo)</h4>\n  <p>多数「开源」VLM 只开权重不开数据。Molmo 连采集管线都公开:让标注员<b>口头描述图像 60–90 秒</b>再转写,得到超详细、不套路、且<b>不蒸馏别的 VLM</b> 的 caption。想理解「数据到底怎么造」,它是最透明的一手材料。</p>\n  <h3>5. 「长描述」的陷阱:忠实性优先于长度</h3>\n  <p>直觉上「越详细越好」,但越长越容易掺入图里没有的东西,而这些无视觉依据的细节会被当监督信号学进去。好 caption 的标准不是「长」,而是「详细且每条都能在图里逐条验证」。</p>\n  <h4>互动:对照同一张图,判断描述是否忠实</h4>\n  <div id=\"dataW\"></div>\n  <p>切到「长但幻觉」那条:描述很流畅,却把「蓝天白云、奔跑、树林」这些图里没有的东西写了进去——这正是污染训练数据的典型。请逐句标注:哪些可观察、哪些是脑补。</p>\n  <h3>6. 走一遍清洗流水线(以一批网络图文对为例)</h3>\n  <p>假设你抓了 1000 万对原始网络图文,目标是筛出能用于对齐的干净子集。典型流水线逐级过滤:</p>\n  <figure class=\"fig\"><svg viewBox=\"0 0 560 320\" role=\"img\" aria-label=\"数据清洗漏斗\">\n  <text x=\"540\" y=\"18\" class=\"figtx-mut\" text-anchor=\"end\">教学示意数据</text>\n  <rect class=\"figbox\" x=\"45\" y=\"30\" width=\"470\" height=\"40\" rx=\"6\"/><text x=\"280\" y=\"55\" class=\"figtx-b\" text-anchor=\"middle\">原始抓取 · 10,000,000</text><polygon class=\"figfill-mut\" points=\"273,74 287,74 280,83\"/><rect class=\"figbox\" x=\"75\" y=\"86\" width=\"410\" height=\"40\" rx=\"6\"/><text x=\"280\" y=\"111\" class=\"figtx-b\" text-anchor=\"middle\">去损坏 / 尺寸异常 · 9,215,000</text><polygon class=\"figfill-mut\" points=\"273,130 287,130 280,139\"/><rect class=\"figbox\" x=\"115\" y=\"142\" width=\"330\" height=\"40\" rx=\"6\"/><text x=\"280\" y=\"167\" class=\"figtx-b\" text-anchor=\"middle\">CLIP 图文相关(全局粗筛) · 6,911,000</text><polygon class=\"figfill-mut\" points=\"273,186 287,186 280,195\"/><rect class=\"figbox\" x=\"130\" y=\"198\" width=\"300\" height=\"40\" rx=\"6\"/><text x=\"280\" y=\"223\" class=\"figtx-b\" text-anchor=\"middle\">近重去重 · 6,358,000</text><polygon class=\"figfill-mut\" points=\"273,242 287,242 280,251\"/><rect class=\"figbox\" x=\"137.5\" y=\"254\" width=\"285\" height=\"40\" rx=\"6\"/><text x=\"280\" y=\"279\" class=\"figtx-b\" text-anchor=\"middle\">与评测集去重(防污染) · 6,300,000</text>\n  </svg><figcaption>本示例的数量变化(教学示意数据):逐级过滤。图文相关性(CLIP)只做全局匹配粗筛,不能核数量/否定/小字;与评测集去重是防污染的关键一步。</figcaption></figure>\n  <p>逐级说明(对应上图从宽到窄):① 去损坏/解码失败(约 3%);② 去尺寸异常(约 5%);③ <b>图文相关性</b>用 CLIP 相似度过滤(约 25%,丢得最多);④ 忠实性抽检,标注高风险批次回流重洗;⑤ 近重去重(图感知哈希 + 文本近重,约 8%);⑥ 与评测集去重(防污染,见下)。</p>\n  <p>关键说明:</p>\n  <ul><li><b>③ 图文相关性</b>用 CLIP 给每对打相似度分,低于阈值视为「图文不搭」丢弃,是常用且好用的一道粗筛。但要清楚它的边界:CLIP 偏<b>全局语义匹配</b>,<b>不能核对数量、否定、小字细节</b>(比如「三只猫」还是「两只」、「没有人」这类它判不准),相似度过阈值也<b>不等于描述忠实</b>。阈值该在一个人工<b>抽检集</b>上校准,而不是拍脑袋定。</li><li><b>⑤ 近重</b>不是精确重复,而是「几乎一样」(同图不同压缩、caption 换几个词),用感知哈希 + 文本相似度。</li><li><b>⑥ 评测集去重是重中之重</b>:如果某张测试图(或其近重)漏进训练,模型「见过答案」,榜分虚高却不真会——这叫<b>数据污染</b>(L9 再强调)。哪怕只漏几百张,也可能让某个榜虚高好几个点。</li></ul>\n  <h3>7. 算一次「监督 token 预算」:你到底在教模型多少</h3>\n  <p>模型只在<b>答案段</b>上算 loss(L8 详述)。所以「一条样本到底提供了多少监督」要看答案 token 数,而不是整条序列长度。</p>\n  <div class=\"flow\">一条指令样本的序列(以 LLaVA-1.5 为例):\n  视觉 token   576   →  不监督(图像是条件)\n  问题 token    ~30  →  不监督\n  答案 token    ~50  →  监督(只有这段算 loss)\n ────────────────────────────────\n  有效监督 ≈ 50 token / 样本\n\n100 万条样本 → 约 5000 万个\"被监督的答案 token\"</div>\n  <p>再看<b>配比(mixture)</b>怎么分这份预算——而且要小心:<b>「样本配比」不等于「监督 token 配比」</b>,因为不同任务的答案长度差很远。举个例子,各任务答案平均长度不同:</p>\n  <div class=\"flow\">任务        样本数   平均答案token   监督token小计    占监督token比\n通用对话    60万      40           2400万          33.8%\n文档/OCR    20万     100           2000万          28.2%\n数理推理    10万     250           2500万          35.2%   ← 样本只占10%\n定位grounding 10万     20            200万           2.8%\n                                  ───────────\n                       合计        7100万          100%</div>\n  <p>看数理推理:<b>样本数只占 10%,却吃掉约 35.2% 的监督 token</b>(因为它答案长、步骤多)。所以只按「样本比例」配数据会被误导——真正被反复监督的是 token,长答案任务的实际权重远比样本占比大。调配比时要同时看这两张表。</p>\n  <p>这直接决定模型「偏科」:文档样本配比低、答案又短,OCR 就弱。此外还要<b>掺入少量纯文本样本</b>,防止解冻 LLM 后语言能力退化(灾难性遗忘,L8)。配比没有万能解,取决于你的下游用途。</p>\n  <h3>8. 一个要讲清的边界:数据噪声 ≠ 可直接换算成输出错误率</h3>\n  <p>有个常见的错误推断:「训练数据里 20% 带幻觉,模型就会在 20%(或 1/5)情况下编造」。<b>这是不成立的</b>——噪声标签对输出的影响取决于噪声类型、是否系统性、模型容量、正则化、其它干净数据的占比等,<b>不能由噪声比例直接推出输出错误率</b>。</p>\n  <p>能稳妥说的是<b>方向性</b>结论:带幻觉的标签是在「把一种错误行为示范给模型」,其负作用会随这类数据占比上升而变大;所以指令阶段倾向「宁可少而精」。但别把它量化成确定的错误率。</p>\n  <h3>9. 常见误区</h3>\n  <ul><li>「权重开源」≠「数据透明」:你看到的 SOTA 往往无法复现其数据配方。</li><li>「清洗」不能补事实,只能去噪/过滤/去重;要补细节得靠 re-caption(新标注)并校验。</li><li>配比通用榜高,不代表你的文档/数理场景就好——按用途看对应维度。</li></ul>\n  <h3>练习</h3>\n  <details class=\"quiz\"><summary>🧠 一条指令数据记录里,哪些部分计入 loss、哪些不计? ——</summary><div class=\"qa\"><b>答:</b>只有助手(gpt)的答案段计入 loss;图像(视觉 token)与用户提问段不计入,只作条件/上下文。</div></details>\n  <details class=\"quiz\"><summary>🧠 清洗流水线里哪一步最依赖 CLIP,作用是什么? ——</summary><div class=\"qa\"><b>答:</b>图文相关性过滤。用 CLIP 给每对图文打相似度分,低于阈值判为「图文不搭」丢弃。</div></details>\n  <details class=\"quiz\"><summary>🧠 为什么「与评测集去重」如此关键? ——</summary><div class=\"qa\"><b>答:</b>测试图(或其近重)漏进训练会造成数据污染,模型见过答案,榜分虚高却不代表真实泛化。</div></details>\n  <details class=\"quiz\"><summary>🧠 一条样本视觉576 + 问题30 + 答案50 token,它提供多少「监督 token」? ——</summary><div class=\"qa\"><b>答:</b>约 50(只有答案段算 loss);视觉和问题段是条件/上下文,不监督。</div></details>\n  <details class=\"quiz\"><summary>🧠 「训练数据 20% 带幻觉 → 模型 1/5 情况编造」对吗? ——</summary><div class=\"qa\"><b>答:</b>不对。噪声比例不能直接换算成输出错误率,影响取决于噪声类型、系统性、模型容量、干净数据占比等;只能说方向上负作用随占比增大。</div></details>\n  "},
{id:"l6", grp:"今生 · 视觉指令与通用VLM", kick:"Lecture 6", title:"结构的进化", lead:"视觉编码器、连接器、分辨率、位置编码——从 LLaVA 到 Qwen2.5-VL 变了什么。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议时长60–70分钟，可分成两个课时。前置：L4的patch、投影与LLM输入；本讲重述必要的注意力和位置概念。学完应能比较三种分辨率路径，手算patch与合并后的token，推导RoPE相对位置性质，并给图像/视频token正确赋坐标。</div>\n  <h3>1. 一个具体失败：原图清楚，模型却读错金额</h3>\n  <p>输入一张1000×1400发票，上面的小字高约12像素。若先缩放到336级别，小字可能只剩约3–4像素，笔画混在一起。此时模型输出一个流畅金额，可能只是依据账单先验猜测，不是读到了数字。</p>\n  <p>必须先问：信息是在预处理、视觉编码、token压缩、语言推理还是答案提取阶段丢失？增大LLM不一定修好前几步。结构设计就在“保留细节”和“计算预算”之间做选择，不能只看某层参数量。</p>\n  <h3>2. 视觉编码器内部发生了什么</h3>\n  <p>对处理后尺寸H×W、patch边长p，若H/W恰好可整除p，patch数为：</p>\n  <p><code>Npatch = (H/p) × (W/p)</code>。</p>\n  <p>每个patch映成向量，再加位置相关信息并进入视觉Transformer。自注意力让每个位置根据自己的query对其他位置的key打分，再加权读取value。若N个位置彼此全局读取，每个头的相似度有N×N项。</p>\n  <p>视觉输出不只是原patch像素的独立投影，它已经混入上下文。层数、特征宽度、位置编码、训练数据都影响表示。CLIP、SigLIP和自训ViT只是不同初始化/训练路线，不能把“所有VLM视觉侧都是现成冻结CLIP”当普遍规则。</p>\n  <h3>3. 三种分辨率路径，需要同时讲全局、局部与预处理</h3>\n  <p>第一种，固定低分辨率：例如LLaVA-1.5按checkpoint规则得到336×336图，视觉长度固定576。接口简单、成本可预估，但小字可能先被缩小，非方图还可能受到裁剪/填充等处理影响。</p>\n  <p>第二种，AnyRes切图：把较大画布切成多个固定大小crop，每块走已有固定分辨率视觉编码器；常另外保留一张全局缩略图，帮助识别整体场景。它不要求把原ViT完全改成变长输入，但要组织crop的顺序、恢复局部空间关系、处理padding与重复。</p>\n  <p>第三种，原生动态分辨率：视觉编码器接收可变网格，不把所有图强制塞成同一正方形。processor通常仍会限制最小/最大像素并把尺寸对齐到某个倍数，“原生”不意味着任意大图片可以无限制原样输入。不同长宽比会产生不同网格及视觉长度。</p>\n  <p>它们是工程取舍，不是新方案天然全面胜出。切图可以复用强大的固定ViT，但crop边界可能切断表格关系；动态分辨率保留统一网格，却需要编码器、批处理和位置机制支持变长输入。</p>\n  <h3>4. 连接器与压缩到底压了什么</h3>\n  <p>逐位置MLP改变向量宽度，不改位置数。Q-Former/Resampler使用少量query，从许多视觉位置读取固定数量latent。另一类是空间合并：把邻近2×2位置的特征拼接或聚合，再用可学习投影输出一个语言侧向量。</p>\n  <p>2×2合并将位置数除以4，但不是必然把信息简单平均扔掉。若先拼接四个D维向量，暂时得到4D维，再投影到输出宽度，模型有机会编码局部结构；仍然存在表示瓶颈，不能据此保证零信息损失。</p>\n  <p>这些机制可以组合，但教学开关的组合不一定对应某个真实checkpoint。例如“AnyRes再2×2压缩”在本互动中用于理解算力变化，不应声称原始LLaVA-NeXT默认就采用这个组合。</p>\n  <h3>5. 把数字算完：patch、视觉token、总序列分开</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 680\" role=\"img\" aria-labelledby=\"l6-resolution-budget-title l6-resolution-budget-desc\" class=\"d1-figure\">\n<title id=\"l6-resolution-budget-title\">分辨率预算：patch、视觉 token 与总序列分开算</title><desc id=\"l6-resolution-budget-desc\">对比LLaVA固定分辨率、教学AnyRes切图加全局缩略图、Qwen动态分辨率加2×2合并。AnyRes的25倍只指视觉序列全局注意力项，加300文本后总序列项约13.18倍。</desc>\n<defs><marker id=\"l6-resolution-budget-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"678\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">分辨率预算：patch、视觉 token 与总序列分开算</tspan>\n</text>\n<rect x=\"35\" y=\"94\" width=\"264\" height=\"409\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"167\" y=\"128\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"167\" dy=\"0\">LLaVA-1.5</tspan>\n</text>\n<rect x=\"348\" y=\"94\" width=\"264\" height=\"409\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<text x=\"480\" y=\"128\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-amber\">\n<tspan x=\"480\" dy=\"0\">教学 AnyRes</tspan>\n</text>\n<rect x=\"661\" y=\"94\" width=\"264\" height=\"409\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"793\" y=\"128\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"793\" dy=\"0\">Qwen2.5-VL</tspan>\n</text>\n<rect x=\"65\" y=\"153\" width=\"205\" height=\"105\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"67\" y=\"221.25\" width=\"201\" height=\"34.65\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"224.9\" cy=\"176.1\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"126.5\" y=\"202.35\" width=\"61.5\" height=\"21.0\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"188.0\" cy=\"200.25\" r=\"14.700000000000001\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M181.85,188.7 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"134.7\" y=\"219.15\" width=\"8\" height=\"16.8\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"173.65\" y=\"219.15\" width=\"8\" height=\"16.8\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M126.5,209.7 L112.15,193.95\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"196.2\" cy=\"197.1\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<text x=\"167\" y=\"298\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"167\" dy=\"0\">输入图 → 固定 336²</tspan>\n</text>\n<text x=\"167\" y=\"337\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"167\" dy=\"0\">24² = 576 patch</tspan>\n</text>\n<text x=\"167\" y=\"386\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"167\" dy=\"0\">576 个 LLM 视觉 token</tspan>\n</text>\n<rect x=\"384\" y=\"153\" width=\"52\" height=\"52\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"439\" y=\"153\" width=\"52\" height=\"52\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"384\" y=\"208\" width=\"52\" height=\"52\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"439\" y=\"208\" width=\"52\" height=\"52\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"516\" y=\"159\" width=\"69\" height=\"50\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"518\" y=\"191.5\" width=\"65\" height=\"16.5\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"569.82\" cy=\"170.0\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"536.7\" y=\"182.5\" width=\"20.7\" height=\"10.0\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"557.4\" cy=\"181.5\" r=\"7.000000000000001\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M555.33,176.0 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"539.46\" y=\"190.5\" width=\"8\" height=\"8.0\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"552.57\" y=\"190.5\" width=\"8\" height=\"8.0\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M536.7,186.0 L531.87,178.5\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"560.16\" cy=\"180.0\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<text x=\"480\" y=\"296\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"480\" dy=\"0\">4 个切块 + 1 张全局图</tspan>\n</text>\n<text x=\"480\" y=\"337\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-amber\">\n<tspan x=\"480\" dy=\"0\">(4+1)×576 = 2880</tspan>\n</text>\n<text x=\"480\" y=\"388\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"480\" dy=\"0\">可选教学合并 ÷4</tspan>\n</text>\n<text x=\"480\" y=\"427\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-amber\">\n<tspan x=\"480\" dy=\"0\">→ 720 token</tspan>\n</text>\n<rect x=\"687\" y=\"153\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"711\" y=\"153\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"735\" y=\"153\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"759\" y=\"153\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"687\" y=\"177\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"711\" y=\"177\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"735\" y=\"177\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"759\" y=\"177\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"687\" y=\"201\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"711\" y=\"201\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"735\" y=\"201\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"759\" y=\"201\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"687\" y=\"225\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"711\" y=\"225\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"735\" y=\"225\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"759\" y=\"225\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<path d=\"M790,198 L815,198\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l6-resolution-budget-arrow)\" class=\"d1-s-grn\" />\n<rect x=\"836\" y=\"174\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"860\" y=\"174\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"836\" y=\"198\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"860\" y=\"198\" width=\"21\" height=\"21\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"793\" y=\"296\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"793\" dy=\"0\">672² → 48² patch</tspan>\n</text>\n<text x=\"793\" y=\"337\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"793\" dy=\"0\">2304 ÷ 4 = 576</tspan>\n</text>\n<text x=\"793\" y=\"388\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"793\" dy=\"0\">336² 则为 144 token</tspan>\n</text>\n<rect x=\"35\" y=\"535\" width=\"888\" height=\"89\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"479.0\" y=\"567\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"479.0\" dy=\"0\">全局注意力项对比（AnyRes 相对 LLaVA）</tspan>\n</text>\n<text x=\"479.0\" y=\"598\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"479.0\" dy=\"0\">只计视觉：2880² / 576² = 25；加 300 文本：(3180/876)² ≈ 13.18</tspan>\n</text>\n</g></svg><figcaption>对比LLaVA固定分辨率、教学AnyRes切图加全局缩略图、Qwen动态分辨率加2×2合并。AnyRes的25倍只指视觉序列全局注意力项，加300文本后总序列项约13.18倍。 AnyRes 是简化切图模型；实际有去填充等细节。注意力项比例 ≠ 整体耗时比例。</figcaption></figure>\n  <p>固定patch=14，以下使用尺寸对齐、忽略特殊边界token的教学简式：</p>\n  <table><tr><th>场景</th><th>合并前patch</th><th>进入LLM的视觉token</th></tr><tr><td>336×336，不合并</td><td>24×24=576</td><td>576</td></tr><tr><td>672×672，不合并</td><td>48×48=2304</td><td>2304</td></tr><tr><td>672×672，2×2合并</td><td>2304</td><td>576</td></tr><tr><td>672×672，切成4块336，再加全局图</td><td>(4+1)×576=2880</td><td>2880</td></tr><tr><td>上一教学切图再合并</td><td>2880</td><td>720</td></tr></table>\n  <p>真实LLaVA-NeXT会选择允许的画布、处理unpadding并加入newline等结构标记，实际长度不能都拿这个简式代替。Qwen2.5-VL则按真实processor的grid计算，图像网格为<code>[t,h,w]</code>，空间合并后长度为<code>t×h×w/4</code>。</p>\n  <p>本课CPU实测：LLaVA-1.5的336与672原输入，处理后都为336，均576视觉token；Qwen2.5-VL的336输入grid为[1,24,24]，合并后144；672输入grid为[1,48,48]，合并后576。两模型都出现576，不代表看到了相同分辨率，也不代表效果相同。</p>\n  <p>若H=448、W=672，14像素patch得到32×48=1536，合并后384。这说明分辨率不能只展示“边长平方”：长宽比也是模型实际输入的一部分。</p>\n  <h3>6. 为什么“token平方”不等于实际耗时平方</h3>\n  <p>全局注意力需要处理N×N个位置配对，固定宽度时核心注意力项近似随N²增长。若只看视觉长度，672不合并相对336有4倍token，对应16倍长度平方项。边长翻倍→面积4倍→注意力项16倍，三个层次不能说成同一个“平方”。</p>\n  <p>LLM真正处理的是视觉+文本等总序列。若文本300token，基线视觉576，则总长度876；切图视觉2880时总长度3180，长度平方比约为<code>3180²/876²=13.18</code>，而仅视觉比为25。二者回答的是不同问题，界面应说明比较时文本预算是否固定。</p>\n  <p>注意力之外还有线性投影、MLP、视觉编码器、连接器和输出层。FlashAttention可避免完整注意力矩阵物化带来的大量内存读写，却不消除全局配对计算的二次项。预填充prefill一次处理已有序列；有KV缓存的decode每步通常是新query读取已有K/V，单步对上下文长度的注意力项近似线性，并不是每步重算整张N×N矩阵。</p>\n  <p>Qwen2.5-VL视觉侧多数层采用window attention，在局部窗口内读取，另保留部分全局层；固定窗口大小时局部层的配对数随总patch数近似线性。这与LLM侧全局因果注意力是两个计算阶段。</p>\n  <div id=\"resW\"></div>\n  <p>先用互动改变边长、合并、切图和文本长度，再口头解释每个读数来自哪条公式。若解释不出，就还没有把“算力口径”学清。</p>\n  <h3>7. 不加位置机制，模型为什么不知道谁在谁右边</h3>\n  <p>注意力主要比较向量内容。两块相同的文字patch若内容很像，仅靠内容相似度难以表达“上方标题”和“下方金额”的位置。文本有先后顺序，图像有高/宽，视频再加时间；模型必须得到位置相关信息。</p>\n  <p>一种直观做法是在输入向量里加入位置向量。RoPE采用不同办法：在计算注意力前，按位置旋转query/key的成对维度，使点积包含相对位移。不要把它理解成旋转原图片或旋转屏幕上的patch。</p>\n  <h3>8. RoPE用二维旋转把相对位置写进点积</h3>\n  <p>取向量的两个维度组成q=(q₁,q₂)，位置m对应角mθ。旋转矩阵为：</p>\n  <div class=\"flow\">R(φ) = [ cosφ  −sinφ ]\n       [ sinφ   cosφ ]\nq' = R(mθ)q\nk' = R(nθ)k\nq'ᵀk' = qᵀR(mθ)ᵀR(nθ)k = qᵀR((n−m)θ)k</div>\n  <p>转置的旋转矩阵等于反向旋转，因此两个绝对位置的作用合并为差值n−m。若q/k内容和θ固定，把m、n同时加5，点积不变。这是相对位置性质，不是说真实注意力只由距离决定；真实q/k内容仍然决定分数。</p>\n  <p>高维query/key按维度对旋转，各对有不同频率。例如常见频率形式为<code>θⱼ=base^(−2j/d)</code>；j编号从0开始，d是参与旋转的维度数。快频率适合产生近距离变化，慢频率在更长位移上仍变化缓慢；它们是频率设计，不能严格说“某一维只编码近距离”。</p>\n  <p>手算令q=k=(1,0)，θ=0.4，m=6、n=10，差为4，点积<code>cos(1.6)≈−0.0292</code>；改为m=8、n=12，仍相同。单频结果是振荡曲线，多频也不保证普遍单调衰减。外推更长位置是否有效还取决于训练长度、频率缩放和模型学到的行为。</p>\n  <h3>9. M-RoPE：把哪些维度对分配给时间、高、宽</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 700\" role=\"img\" aria-labelledby=\"l6-position-coordinates-title l6-position-coordinates-desc\" class=\"d1-figure\">\n<title id=\"l6-position-coordinates-title\">RoPE / M-RoPE：旋转特征，保留相对位置</title><desc id=\"l6-position-coordinates-desc\">左侧在内容固定时，(m,n)=(6,10)与(8,12)的位移都为4，所以点积均为cos1.6≈−0.0292。右侧合并后网格的局部(t,h,w)区分向右与向下；时间需映射实际时间。</desc>\n<defs><marker id=\"l6-position-coordinates-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"698\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">RoPE / M-RoPE：旋转特征，保留相对位置</tspan>\n</text>\n<text x=\"34\" y=\"86\" font-size=\"22\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"34\" dy=\"0\">RoPE：同移两个位置，夹角不变</tspan>\n</text>\n<circle cx=\"165\" cy=\"247\" r=\"90\" stroke-width=\"2\" class=\"d1-f-panel d1-s-line\" />\n<path d=\"M165,247 L107.48329018778283,194.31387191701026\" fill=\"none\" stroke-width=\"3\" marker-end=\"url(#l6-position-coordinates-arrow)\" class=\"d1-s-acc\" />\n<text x=\"107.48329018778283\" y=\"182.31387191701026\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"107.48329018778283\" dy=\"0\">q′</tspan>\n</text>\n<path d=\"M165,247 L114.01579757263826,306.03059463401837\" fill=\"none\" stroke-width=\"3\" marker-end=\"url(#l6-position-coordinates-arrow)\" class=\"d1-s-grn\" />\n<text x=\"114.01579757263826\" y=\"294.03059463401837\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"114.01579757263826\" dy=\"0\">k′</tspan>\n</text>\n<text x=\"165\" y=\"376\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"165\" dy=\"0\">m=6, n=10</tspan>\n</text>\n<circle cx=\"392\" cy=\"247\" r=\"90\" stroke-width=\"2\" class=\"d1-f-panel d1-s-line\" />\n<path d=\"M392,247 L314.13300748800924,251.55318318735124\" fill=\"none\" stroke-width=\"3\" marker-end=\"url(#l6-position-coordinates-arrow)\" class=\"d1-s-acc\" />\n<text x=\"314.13300748800924\" y=\"239.55318318735124\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"314.13300748800924\" dy=\"0\">q′</tspan>\n</text>\n<path d=\"M392,247 L398.82492070827686,324.7008394891956\" fill=\"none\" stroke-width=\"3\" marker-end=\"url(#l6-position-coordinates-arrow)\" class=\"d1-s-grn\" />\n<text x=\"398.82492070827686\" y=\"312.7008394891956\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"398.82492070827686\" dy=\"0\">k′</tspan>\n</text>\n<text x=\"392\" y=\"376\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"392\" dy=\"0\">m=8, n=12</tspan>\n</text>\n<text x=\"279\" y=\"420\" font-size=\"25\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"279\" dy=\"0\">Δ = n−m = 4</tspan>\n</text>\n<text x=\"279\" y=\"461\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"279\" dy=\"0\">q′·k′ = cos(0.4×4) ≈ −0.0292</tspan>\n</text>\n<text x=\"550\" y=\"86\" font-size=\"22\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"550\" dy=\"0\">M-RoPE：位置组为 (t,h,w)</tspan>\n</text>\n<rect x=\"617\" y=\"152\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"675\" y=\"152\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"733\" y=\"152\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"791\" y=\"152\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"617\" y=\"210\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"675\" y=\"210\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<rect x=\"733\" y=\"210\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<rect x=\"791\" y=\"210\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"617\" y=\"268\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"675\" y=\"268\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<rect x=\"733\" y=\"268\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"791\" y=\"268\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"617\" y=\"326\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"675\" y=\"326\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"733\" y=\"326\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"791\" y=\"326\" width=\"55\" height=\"55\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"733\" y=\"130\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-grn\">\n<tspan x=\"733\" dy=\"0\">w → 列位置</tspan>\n</text>\n<text x=\"567\" y=\"236\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-grn\">\n<tspan x=\"567\" dy=\"0\">h ↓</tspan>\n</text>\n<text x=\"550\" y=\"420\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"550\" dy=\"0\">中心：(0, 1, 1)</tspan>\n<tspan x=\"550\" dy=\"30.45\">向右：(0, 1, 2)</tspan>\n<tspan x=\"550\" dy=\"30.45\">向下：(0, 2, 1)</tspan>\n</text>\n<text x=\"550\" y=\"530\" font-size=\"21\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"550\" dy=\"0\">图像：t 固定</tspan>\n<tspan x=\"550\" dy=\"30.45\">视频：t 对齐实际时间刻度</tspan>\n</text>\n<rect x=\"34\" y=\"569\" width=\"467\" height=\"74\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<text x=\"267.5\" y=\"601\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-amber\">\n<tspan x=\"267.5\" dy=\"0\">旋转的是 q/k 的成对特征维度</tspan>\n</text>\n<text x=\"267.5\" y=\"632\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"267.5\" dy=\"0\">不是旋转图片或复制 token</tspan>\n</text>\n</g></svg><figcaption>左侧在内容固定时，(m,n)=(6,10)与(8,12)的位移都为4，所以点积均为cos1.6≈−0.0292。右侧合并后网格的局部(t,h,w)区分向右与向下；时间需映射实际时间。 右图为合并后局部网格；真实混合序列需加起点偏移。多频点积不保证单调衰减。</figcaption></figure>\n  <p>一维文本位置只有p；图像需要(h,w)；视频需要(t,h,w)。M-RoPE把query/key的旋转维度分成组，分别使用时间、高和宽位置。不是把一个token复制三遍，也不是画三个独立圆盘就实现全部模型。</p>\n  <p>在不考虑前文偏移的教学局部坐标里：文本token可用(p,p,p)，让三组看到同一序号，退化到一维位置作用；单图中t固定，高/宽取网格行列；视频同一空间位置跨不同时间组，t改变。</p>\n  <table><tr><th>示例token</th><th>t</th><th>h</th><th>w</th></tr><tr><td>文本第3位置</td><td>3</td><td>3</td><td>3</td></tr><tr><td>图片第2行第1列</td><td>0</td><td>2</td><td>1</td></tr><tr><td>同图向右一格</td><td>0</td><td>2</td><td>2</td></tr><tr><td>同图向下一格</td><td>0</td><td>3</td><td>1</td></tr></table>\n  <p>真实混合序列还要叠加位置起点偏移，不能让每张图在整个对话里都无条件从绝对0开始；后续文本位置也需按模型规则推进。空间坐标通常对应进入语言侧的合并后网格，不能把原像素坐标、合并前patch索引和语言侧位置id互换。</p>\n  <h3>10. Qwen2.5-VL的时间改进不是“第几帧”换个名字</h3>\n  <p>如果按帧序号计位置，同一段视频按1fps和2fps采样，事件对应的序号不同；只知道“第10帧”无法稳定对应真实第几秒。Qwen2.5-VL将时间位置与实际时间间隔关联，帮助模型表达事件速度与时间定位。</p>\n  <p>教学上，假设三个视觉时间组对应0、2、4秒，位置尺度s=5，那么t位置可以示意为0、10、20，而不是0、1、2。尺度和取整规则是模型配置，实际实现还要考虑采样fps、时间patch分组与序列偏移；t的数值不是必然等于秒数本身。</p>\n  <p>这也说明更高采样率不保证所有视频问题都变好：帧数、视觉长度和LLM预算增加，很多帧还可能冗余；较低采样率则可能错过短事件。时序任务必须同时看采样策略与位置机制。</p>\n  <div id=\"ropeW\"></div>\n  <p>互动里先验证固定q/k的同时平移不变，再切文本/图像/视频坐标。当前网格示意是局部坐标例子，真实模型维度分组、时间尺度和序列偏移由配置决定。</p>\n  <h3>11. 可运行RoPE算例与空间合并shape</h3>\n  <div class=\"flow\">import math\nimport torch\n\ndef rotate(v, pos, theta=0.4):\n    a = pos * theta\n    R = torch.tensor([[math.cos(a), -math.sin(a)],\n                      [math.sin(a), math.cos(a)]])\n    return R @ v\n\nv = torch.tensor([1., 0.])\ndot1 = rotate(v, 6) @ rotate(v, 10)\ndot2 = rotate(v, 8) @ rotate(v, 12)\nprint(round(dot1.item(), 4), round(dot2.item(), 4))  # -.0292、-.0292\n\ngrid = torch.arange(4 * 4 * 2).reshape(4, 4, 2)\n# 先分成2×2局部组，把每组的四个2维向量拼起来\nmerged = grid.reshape(2, 2, 2, 2, 2).permute(0, 2, 1, 3, 4).reshape(4, 8)\nprint(grid.shape, merged.shape)  # [4,4,2] → [4,8]\n# 真模型再将这8维投影到LLM宽度；这里仅验证空间分组。</div>\n  <h3>练习</h3>\n  <details class=\"quiz\"><summary>🧠 448×672、patch14、空间2×2合并，视觉长度是多少？——</summary><div class=\"qa\"><b>答:</b>32×48/4=384，假设尺寸已对齐且无额外标记。</div></details>\n  <details class=\"quiz\"><summary>🧠 AnyRes4块+全局图，为什么不是2304？——</summary><div class=\"qa\"><b>答:</b>还需加576，简式合计2880。</div></details>\n  <details class=\"quiz\"><summary>🧠 原生672合并后也是576，是否等于固定336的输入信息？——</summary><div class=\"qa\"><b>答:</b>不等于，编码器所见像素和合并结构不同。</div></details>\n  <details class=\"quiz\"><summary>🧠 文本位置m/n同时加10，真实注意力一定完全不变吗？——</summary><div class=\"qa\"><b>答:</b>固定q/k的RoPE内积具有该性质；真实网络内容状态、掩码与其他上下文变化不能忽略。</div></details>\n  <details class=\"quiz\"><summary>🧠 单图水平移一格，局部(t,h,w)应如何变？——</summary><div class=\"qa\"><b>答:</b>只w加1；t、h保持。</div></details>\n  <details class=\"quiz\"><summary>🧠 视频t直接用帧号，为什么采样率变化会造成问题？——</summary><div class=\"qa\"><b>答:</b>同一实际时间对应不同帧序号，需要时间间隔/时间戳参与编码。</div></details>\n  "},
{id:"l7", grp:"今生 · 视觉指令与通用VLM", kick:"Lecture 7", title:"Tokenizer 的分叉", lead:"最易被忽略的核心:图像到底算不算 token?连续 vs 离散两条路。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议时长40–45分钟。前置：L4的连续视觉输入；本讲解释最近邻量化、重建和梯度。学完应能手算一个码本选择，区别token数量与词表大小，画出离散图像生成流程，并说明连续输入为什么不排斥图像生成。</div>\n  <h3>1. 先拆开“token”这个多义词</h3>\n  <p>文本tokenizer把文字分成词表里的离散id，例如某个子词对应整数218；embedding表把这个id查成向量。token是离散符号，embedding是它在神经网络中的向量表示，二者不是同一个对象。</p>\n  <p>LLaVA式视觉路径里，ViT输出很多位置的连续特征，连接器把每行映到LLM宽度。大家也称这些位置为“视觉token”，但它们没有必然对应离散词表id。因此先问“这个token是离散符号，还是序列中的一个连续向量位置”，很多混乱就消失了。</p>\n  <p>编码器把图片变成连续表示；视觉tokenizer在狭义离散意义下还需把表示映到有限码本。实际论文对“tokenizer”的叫法并不完全统一，讨论具体模型时应描述操作，而不是只争名称。</p>\n  <h3>2. 连续理解路径为什么常见</h3>\n  <p>连续表示不必将每个位置强制归到有限的离散原型，容易复用CLIP/SigLIP等视觉编码器，并直接适配语言输入。因此很多理解型VLM使用这条路线。</p>\n  <p>但它也有压缩：图片预处理、patch化、有限宽度、空间合并与query读取都可能丢信息。不能把“连续”说成数学上保留原图所有细节，或把其输出称为原图重建。</p>\n  <p>这类理解模型默认用词表读出头生成文字，是输出结构和训练目标的选择。<b>连续输入本身没有证明模型一定不能生成图片</b>：后面若连接图像生成模块、扩散/flow解码器，或采用分离的生成视觉表示，系统同样可以产生图像。</p>\n  <h3>3. 离散路径的完整链路，不是直接给像素换颜色</h3>\n  <p>一个典型离散视觉自编码器（autoencoder，用输入图像本身作为重建目标的模型）可分三步：编码器E把图片压成潜网格z；量化器把每个连续向量选成码本条目；解码器D把量化后的潜网格重建成图片。</p>\n  <div class=\"flow\">图像 I → 编码器 E → 连续潜网格 z [h,w,d]\n                         ↓ 每位置最近邻\n                    离散id网格 k [h,w]\n                         ↓ 查码本\n                    量化潜网格 e [h,w,d]\n                         ↓ 解码器 D\n                    重建图像 I_hat</div>\n  <p>码本C有K个向量，形状为<code>[K,d]</code>。每个潜位置zᵢ选择：</p>\n  <p><code>kᵢ = argminₖ ||zᵢ−Cₖ||²</code>，量化输出<code>eᵢ=C[kᵢ]</code>。</p>\n  <p>argmin返回“哪个条目距离最小”的索引。解码时先查码本恢复向量，再由神经解码器恢复像素，不能把离散id本身当成RGB颜色。</p>\n  <h3>4. 最近邻手算：看清量化丢失在哪一步</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 650\" role=\"img\" aria-labelledby=\"l7-vq-nearest-title l7-vq-nearest-desc\" class=\"d1-figure\">\n<title id=\"l7-vq-nearest-title\">VQ 图像 token：先编码到潜空间，再找码本</title><desc id=\"l7-vq-nearest-desc\">图像经编码器形成潜网格，每个潜向量选最近的学习码字。手算z=(0.8,0.6)，到(1,0)的平方距离0.4，小于到(0,1)的0.8，所以选择码字1；解码器从码字重建。</desc>\n<defs><marker id=\"l7-vq-nearest-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"648\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">VQ 图像 token：先编码到潜空间，再找码本</tspan>\n</text>\n<rect x=\"36\" y=\"100\" width=\"160\" height=\"101\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"38\" y=\"165.65\" width=\"156\" height=\"33.33\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"160.8\" cy=\"122.22\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"84.0\" y=\"147.47\" width=\"48.0\" height=\"20.200000000000003\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"132.0\" cy=\"145.45\" r=\"14.14\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M127.19999999999999,134.34 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"90.4\" y=\"163.63\" width=\"8\" height=\"16.16\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"120.80000000000001\" y=\"163.63\" width=\"8\" height=\"16.16\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M84.0,154.54000000000002 L72.80000000000001,139.39\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"138.4\" cy=\"142.42000000000002\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<path d=\"M207,151 L244,151\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l7-vq-nearest-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"256\" y=\"109\" width=\"248\" height=\"103\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"380.0\" y=\"141\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"380.0\" dy=\"0\">图像编码器</tspan>\n</text>\n<text x=\"380.0\" y=\"172\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"380.0\" dy=\"0\">像素 → 潜空间网格</tspan>\n</text>\n<path d=\"M515,151 L557,151\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l7-vq-nearest-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"575\" y=\"110\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"605\" y=\"110\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"635\" y=\"110\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"665\" y=\"110\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"575\" y=\"140\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"605\" y=\"140\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"635\" y=\"140\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<rect x=\"665\" y=\"140\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"575\" y=\"170\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"605\" y=\"170\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"635\" y=\"170\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"665\" y=\"170\" width=\"27\" height=\"27\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"735\" y=\"156\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"735\" dy=\"0\">取一个潜向量</tspan>\n<tspan x=\"735\" dy=\"30.45\">z = (0.8,0.6)</tspan>\n</text>\n<path d=\"M104,525 L374,525\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l7-vq-nearest-arrow)\" class=\"d1-s-mut\" />\n<path d=\"M104,525 L104,255\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l7-vq-nearest-arrow)\" class=\"d1-s-mut\" />\n<circle cx=\"299\" cy=\"525\" r=\"7\" stroke-width=\"2\" class=\"d1-f-acc d1-s-acc\" />\n<text x=\"311\" y=\"511\" font-size=\"20\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-acc\">\n<tspan x=\"311\" dy=\"0\">码字 1 = (1,0)</tspan>\n</text>\n<circle cx=\"104\" cy=\"330\" r=\"7\" stroke-width=\"2\" class=\"d1-f-mut d1-s-mut\" />\n<text x=\"116\" y=\"316\" font-size=\"20\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"116\" dy=\"0\">码字 2 = (0,1)</tspan>\n</text>\n<circle cx=\"260.0\" cy=\"408.0\" r=\"7\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<text x=\"272.0\" y=\"394.0\" font-size=\"20\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-amber\">\n<tspan x=\"272.0\" dy=\"0\">z = (0.8,0.6)</tspan>\n</text>\n<path d=\"M260.0,408.0 L299,525\" fill=\"none\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\" class=\"d1-s-acc\" />\n<path d=\"M260.0,408.0 L104,330\" fill=\"none\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\" class=\"d1-s-mut\" />\n<rect x=\"491\" y=\"284\" width=\"425\" height=\"113\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"703.5\" y=\"316\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"703.5\" dy=\"0\">最近邻 → id = 1</tspan>\n</text>\n<text x=\"703.5\" y=\"347\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"703.5\" dy=\"0\">d²(z,e₁)=0.4 &lt; d²(z,e₂)=0.8</tspan>\n</text>\n<rect x=\"491\" y=\"448\" width=\"425\" height=\"114\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"703.5\" y=\"480\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"703.5\" dy=\"0\">查码本 → 图像解码器</tspan>\n</text>\n<text x=\"703.5\" y=\"511\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"703.5\" dy=\"0\">离散 id → 码字向量 → 重建像素</tspan>\n</text>\n<path d=\"M703,408 L703,437\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l7-vq-nearest-arrow)\" class=\"d1-s-grn\" />\n</g></svg><figcaption>图像经编码器形成潜网格，每个潜向量选最近的学习码字。手算z=(0.8,0.6)，到(1,0)的平方距离0.4，小于到(0,1)的0.8，所以选择码字1；解码器从码字重建。 量化发生在学习得到的潜空间；本站 RGB 量化互动只是直观类比。</figcaption></figure>\n  <p>设一个潜向量z=(0.8,0.6)，码本只有两个条目C₀=(1,0)、C₁=(0,1)。到C₀的平方距离为<code>(−0.2)²+0.6²=0.40</code>，到C₁为<code>0.8²+(−0.4)²=0.80</code>，所以选择id0，查表得到(1,0)。</p>\n  <p>z原来的两个精确值不再保留，多个不同z可能映到同一个id。这是量化的信息瓶颈。若再增加条目(0.8,0.6)，这个位置量化误差可以变为0，但是否提升实际重建/理解还要看码本整体训练和解码器。</p>\n  <p>增加K且保留旧码本时，“最小平方距离”不会变大，因为旧选择仍在候选里。若每次独立重训不同码本，则没有逐位置单调保证；若最近邻按平方距离选、报告另一个误差指标，也不能无条件推出报告指标单调。</p>\n  <h3>5. K与网格尺寸分别决定什么</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 650\" role=\"img\" aria-labelledby=\"l7-codebook-count-title l7-codebook-count-desc\" class=\"d1-figure\">\n<title id=\"l7-codebook-count-title\">码本大小 K 与空间网格：两个独立的旋钮</title><desc id=\"l7-codebook-count-desc\">上行保持2×2空间网格，码本K从2增至8，id序列仍有4个位置；下行保持K=8，网格从2×2增至4×4，位置数从4变16。图形为教学示意，不表示真实重建图。</desc>\n<defs><marker id=\"l7-codebook-count-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"648\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">码本大小 K 与空间网格：两个独立的旋钮</tspan>\n</text>\n<text x=\"32\" y=\"86\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"32\" dy=\"0\">旋钮 1：固定 2×2 网格，增加可选码字</tspan>\n</text>\n<rect x=\"40\" y=\"112\" width=\"417\" height=\"189\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"62\" y=\"145\" font-size=\"24\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"62\" dy=\"0\">K = 2</tspan>\n</text>\n<rect x=\"62\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"79\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"79\" dy=\"0\">0</tspan>\n</text>\n<rect x=\"105\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"122\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"122\" dy=\"0\">1</tspan>\n</text>\n<text x=\"62\" y=\"244\" font-size=\"23\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"62\" dy=\"0\">图像序列：0 1 1 0</tspan>\n</text>\n<text x=\"62\" y=\"281\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"62\" dy=\"0\">仍然是 4 个位置</tspan>\n</text>\n<rect x=\"503\" y=\"112\" width=\"417\" height=\"189\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"525\" y=\"145\" font-size=\"24\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"525\" dy=\"0\">K = 8</tspan>\n</text>\n<rect x=\"525\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"542\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"542\" dy=\"0\">0</tspan>\n</text>\n<rect x=\"568\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"585\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"585\" dy=\"0\">1</tspan>\n</text>\n<rect x=\"611\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"628\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"628\" dy=\"0\">2</tspan>\n</text>\n<rect x=\"654\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"671\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"671\" dy=\"0\">3</tspan>\n</text>\n<rect x=\"697\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"714\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"714\" dy=\"0\">4</tspan>\n</text>\n<rect x=\"740\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"757\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"757\" dy=\"0\">5</tspan>\n</text>\n<rect x=\"783\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"800\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"800\" dy=\"0\">6</tspan>\n</text>\n<rect x=\"826\" y=\"164\" width=\"34\" height=\"35\" rx=\"4\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"843\" y=\"189\" font-size=\"17\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"843\" dy=\"0\">7</tspan>\n</text>\n<text x=\"525\" y=\"244\" font-size=\"23\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"525\" dy=\"0\">图像序列：0 3 5 7</tspan>\n</text>\n<text x=\"525\" y=\"281\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"525\" dy=\"0\">仍然是 4 个位置</tspan>\n</text>\n<text x=\"32\" y=\"355\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-amber\">\n<tspan x=\"32\" dy=\"0\">旋钮 2：固定 K=8，增加空间位置</tspan>\n</text>\n<rect x=\"73\" y=\"395\" width=\"52\" height=\"52\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"99.0\" y=\"430.75\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"99.0\" dy=\"0\">0</tspan>\n</text>\n<rect x=\"128\" y=\"395\" width=\"52\" height=\"52\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"154.0\" y=\"430.75\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"154.0\" dy=\"0\">1</tspan>\n</text>\n<rect x=\"73\" y=\"450\" width=\"52\" height=\"52\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"99.0\" y=\"485.75\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"99.0\" dy=\"0\">2</tspan>\n</text>\n<rect x=\"128\" y=\"450\" width=\"52\" height=\"52\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"154.0\" y=\"485.75\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"154.0\" dy=\"0\">3</tspan>\n</text>\n<text x=\"132\" y=\"544\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"132\" dy=\"0\">2×2 = 4 id</tspan>\n</text>\n<path d=\"M255,452 L433,452\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l7-codebook-count-arrow)\" class=\"d1-s-amber\" />\n<text x=\"346\" y=\"424\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-amber\">\n<tspan x=\"346\" dy=\"0\">更多空间细节</tspan>\n</text>\n<rect x=\"506\" y=\"380\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"524.5\" y=\"406.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"524.5\" dy=\"0\">0</tspan>\n</text>\n<rect x=\"546\" y=\"380\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"564.5\" y=\"406.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"564.5\" dy=\"0\">1</tspan>\n</text>\n<rect x=\"586\" y=\"380\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"604.5\" y=\"406.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"604.5\" dy=\"0\">2</tspan>\n</text>\n<rect x=\"626\" y=\"380\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"644.5\" y=\"406.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"644.5\" dy=\"0\">3</tspan>\n</text>\n<rect x=\"506\" y=\"420\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"524.5\" y=\"446.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"524.5\" dy=\"0\">4</tspan>\n</text>\n<rect x=\"546\" y=\"420\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"564.5\" y=\"446.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"564.5\" dy=\"0\">5</tspan>\n</text>\n<rect x=\"586\" y=\"420\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"604.5\" y=\"446.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"604.5\" dy=\"0\">6</tspan>\n</text>\n<rect x=\"626\" y=\"420\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"644.5\" y=\"446.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"644.5\" dy=\"0\">7</tspan>\n</text>\n<rect x=\"506\" y=\"460\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"524.5\" y=\"486.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"524.5\" dy=\"0\">0</tspan>\n</text>\n<rect x=\"546\" y=\"460\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"564.5\" y=\"486.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"564.5\" dy=\"0\">1</tspan>\n</text>\n<rect x=\"586\" y=\"460\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"604.5\" y=\"486.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"604.5\" dy=\"0\">2</tspan>\n</text>\n<rect x=\"626\" y=\"460\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"644.5\" y=\"486.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"644.5\" dy=\"0\">3</tspan>\n</text>\n<rect x=\"506\" y=\"500\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"524.5\" y=\"526.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"524.5\" dy=\"0\">4</tspan>\n</text>\n<rect x=\"546\" y=\"500\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"564.5\" y=\"526.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"564.5\" dy=\"0\">5</tspan>\n</text>\n<rect x=\"586\" y=\"500\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"604.5\" y=\"526.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"604.5\" dy=\"0\">6</tspan>\n</text>\n<rect x=\"626\" y=\"500\" width=\"37\" height=\"37\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"644.5\" y=\"526.0\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"644.5\" dy=\"0\">7</tspan>\n</text>\n<text x=\"586\" y=\"568\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"586\" dy=\"0\">4×4 = 16 id</tspan>\n</text>\n<text x=\"733\" y=\"423\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"733\" dy=\"0\">K：每个位置</tspan>\n<tspan x=\"733\" dy=\"30.45\">有多少种选择</tspan>\n<tspan x=\"733\" dy=\"30.45\" />\n<tspan x=\"733\" dy=\"30.45\">网格：有多少</tspan>\n<tspan x=\"733\" dy=\"30.45\">个序列位置</tspan>\n</text>\n</g></svg><figcaption>上行保持2×2空间网格，码本K从2增至8，id序列仍有4个位置；下行保持K=8，网格从2×2增至4×4，位置数从4变16。图形为教学示意，不表示真实重建图。 网格数字是示例码字 id，允许重复；K 增大不自动增加序列长度，也不保证端到端质量必然变好。</figcaption></figure>\n  <p>假设编码后网格16×16，共256个离散位置。K=1024与K=8192都还是256个id，不会因为词表扩大8倍，就多出8倍token。</p>\n  <p>理想固定长度二进制存储中，一个K=1024的id需10bit，K=8192需13bit。于是忽略边界、码本存储和熵编码，256个id分别需要2560与3328bit。<code>log₂K</code>描述一个id的符号容量；网格h×w描述序列有多少个位置。</p>\n  <p>若空间下采样从16倍改成8倍，同一原图的潜网格每边增大2倍，token数增大4倍。这更直接改变自回归生成步数。码本大小还会影响输出分类头的类别数与训练，但不等于空间分辨率本身。</p>\n  <h3>6. argmin不可微，训练如何继续</h3>\n  <p>“选最近条目”的索引对小扰动往往不变，跨边界又突然跳变，不能像普通线性层那样给编码器提供有用梯度。常见VQ训练采用straight-through估计及辅助损失。</p>\n  <p>三个主要目标可以示意为：</p>\n  <div class=\"flow\">L_recon = 图片重建损失(D(e), I)\nL_code  = ||stopgrad(z) − e||²       让码本靠近编码器输出\nL_commit= β ||z − stopgrad(e)||²     让编码器别远离所选码本\nL = L_recon + L_code + L_commit</div>\n  <p>stopgrad表示前向值保留，但这条边不传反向梯度。straight-through让前向使用量化值、反向对编码器近似当成恒等路径：<code>z_st = z + stopgrad(e−z)</code>。这样重建梯度可回到编码器，码本主要通过自己的损失或某些实现中的EMA更新。</p>\n  <p>β控制commitment力度；太小可能编码器漂移，太大可能妨碍重建。真实视觉tokenizer还可能使用感知损失、对抗损失或其他设计，不能把本例三项说成所有VQ模型唯一训练目标。</p>\n  <h3>7. 可运行量化与梯度算例</h3>\n  <p>下面解码器设为恒等线性映射，只为了透明地验证梯度路径，不是假装已训练图像autoencoder。</p>\n  <div class=\"flow\">import torch\nfrom torch import nn\nfrom torch.nn import functional as F\n\nz = torch.tensor([[0.8, 0.6]], requires_grad=True)\ncodebook = nn.Parameter(torch.tensor([[1., 0.], [0., 1.]]))\ndist = (z[:, None, :] - codebook[None, :, :]).square().sum(-1)\nids = dist.argmin(-1)\ne = codebook[ids]\nz_st = z + (e - z).detach()\ndecoder = nn.Linear(2, 2, bias=False)\nwith torch.no_grad():\n    decoder.weight.copy_(torch.eye(2))\nrecon = F.mse_loss(decoder(z_st), z.detach())\ncode_loss = F.mse_loss(e, z.detach())\ncommit_loss = 0.25 * F.mse_loss(z, e.detach())\nloss = recon + code_loss + commit_loss\nloss.backward()\nprint(ids.tolist(), e.detach().tolist())  # [0]、[[1.,0.]]\nprint(round(loss.item(), 4))              # 0.45，采用每维平均的MSE\nprint(z.grad, codebook.grad)             # 编码器与所选码本都有梯度</div>\n  <p>平方距离求和为0.4，代码里每维平均MSE为0.2，所以三个损失分别0.2、0.2、0.05，合计0.45。报告误差时必须写清“求和/平均、像素/潜空间、平方/绝对值”，否则数字不可比较。</p>\n  <h3>8. 有了离散图像id，怎么让模型生成图像</h3>\n  <p>先训练或获得视觉tokenizer，把训练图像编码成id序列。再训练一个自回归模型，在文字条件下预测这些视觉id。例如给“画一只红色小船”，序列可能是文本token、图像开始标记、256个视觉id、图像结束标记。</p>\n  <p>生成时模型逐个预测视觉id，再将id查码本并送入图像解码器，得到最终像素。于是“统一预测符号序列”成为理解与生成共享框架的一个选择，Chameleon、Emu3等是代表路线。</p>\n  <p>困难包括：图像序列可很长，逐token生成慢；局部id预测要形成全局一致对象；tokenizer重建上限限制最终图像质量；同一表示同时适合精细理解与生成不一定容易。这些问题涉及数据、模型和训练，不能用“量化损失”解释全部效果差异。</p>\n  <h3>9. 混合路线如何打破二选一</h3>\n  <p>理解任务希望保留语义、文字和关系；生成任务还要还原纹理、颜色和像素结构，两者对视觉表示的要求可以冲突。Janus的思路是分离理解与生成视觉编码路径，但共享统一的Transformer处理框架。其他路线让连续特征或语言hidden state去条件化扩散/flow生成器。</p>\n  <p>扩散/flow通常从噪声开始，通过多次预测或迭代恢复连续图像潜表示，再解码成像素；这与逐个生成离散码本id是不同生成机制。因而比较模型时应分别回答：输入图像表示是什么、生成目标是什么、输出通过哪个解码器变成图片。单看“连续/离散输入”不能决定全部能力。</p>\n  <h3>10. 互动能说明什么，不能说明什么</h3>\n  <div id=\"vqW\"></div>\n  <p>本互动在RGB颜色空间找最近调色板颜色，让“有限原型会产生色带”肉眼可见。真实视觉VQ通常在学习到的潜空间量化，解码器能用上下文生成像素，因此不能拿右侧色带直接当作某真实模型重建，更不能把显示的RGB平均绝对误差当理解benchmark或commitment loss。</p>\n  <p>课堂操作：先固定网格，增大码本看误差；再解释如果改空间网格会发生什么。区分“每个位置能选多少符号”与“总共有多少位置”，比只拖一个滑块更重要。</p>\n  <h3>练习</h3>\n  <details class=\"quiz\"><summary>🧠 z=(0.2,0.9)，沿用两条码本，应选哪条？——</summary><div class=\"qa\"><b>答:</b>到(1,0)平方距离1.45，到(0,1)为0.05，选id1。</div></details>\n  <details class=\"quiz\"><summary>🧠 K从1024改8192，16×16网格有多少token？——</summary><div class=\"qa\"><b>答:</b>仍256；理想每id容量10bit变13bit。</div></details>\n  <details class=\"quiz\"><summary>🧠 原图32×32的潜网格变64×64，自回归视觉步数怎样变？——</summary><div class=\"qa\"><b>答:</b>1024变4096，4倍。</div></details>\n  <details class=\"quiz\"><summary>🧠 为什么VQ需要straight-through或其他训练设计？——</summary><div class=\"qa\"><b>答:</b>离散最近邻选择不能直接提供通常所需的连续梯度。</div></details>\n  <details class=\"quiz\"><summary>🧠 连续理解编码器能与图像生成共存吗？——</summary><div class=\"qa\"><b>答:</b>能，生成结构可以另行使用离散路径或连续扩散/flow路径。</div></details>\n  "},
{id:"l8", grp:"今生 · 视觉指令与通用VLM", kick:"Lecture 8", title:"训练与对齐", lead:"三段式、冻结策略、DPO,以及 VLM 的头号顽疾——幻觉。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议时长50–60分钟。前置：L4的视觉前缀和逐词预测；本讲解释监督标签、梯度、冻结、LoRA与DPO。学完应能标出一个对话序列的loss位置，说明梯度流向，区分LLaVA教学配方与Qwen2.5-VL真实阶段，并提出可验证的幻觉治理实验。</div>\n  <h3>1. 先问“优化什么”，再问“用几张卡”</h3>\n  <p>模型结构规定信息怎么进入和传播；训练目标规定什么行为获得奖励。相同结构可以因数据、loss、冻结策略和解码方法不同而输出不同答案。</p>\n  <p>理解型VLM的一种核心任务是：给定图像I和提示x，让助手回答y获得高概率。对回答token的条件概率链求负对数：</p>\n  <p><code>L = −Σₜ log Pθ(yₜ | I, x, y₁…yₜ₋₁)</code>。</p>\n  <p>θ表示要学习的参数；负对数让正确token概率低时损失大；对每个回答位置求和或平均，具体归一化策略应说明。这个目标不是直接比较“整句听起来好不好”，而是把回答拆成逐token监督。</p>\n  <h3>2. teacher forcing与causal mask各解决一个问题</h3>\n  <p>训练时，我们有标准回答“一只狗”，可以在预测“狗”时喂标准前文“一只”，这叫teacher forcing。推理时没有标准答案，前文来自模型自己生成，因此早期错误会改变后面的条件。</p>\n  <p>因果掩码causal mask让位置t不能读取未来位置。虽然训练batch里包含完整答案，但预测“狗”的位置只允许读图像、问题和答案前文，不能直接读到“狗”之后的目标。teacher forcing不是偷看目标，正确移位和掩码是关键。</p>\n  <p>常见实现的logits在位置t预测位置t+1的token，所以计算loss时做shift：<code>logits[:-1]</code>与<code>labels[1:]</code>对齐。漏了移位，模型可能被训练成“读到当前词再复述当前词”；模板错位则可能让提示标记也被当成回答训练。</p>\n  <h3>3. 监督mask具体怎么标</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 650\" role=\"img\" aria-labelledby=\"l8-label-shift-title l8-label-shift-desc\" class=\"d1-figure\">\n<title id=\"l8-label-shift-title\">监督 mask 与 shift：只计答案，也能训练视觉路径</title><desc id=\"l8-label-shift-desc\">八个输入位置中，前五个label忽略，回答狗、坐着、EOS为三个目标。位置4、5、6的logits分别预测位置5、6、7；答案loss仍可沿注意力向视觉路径传梯度。</desc>\n<defs><marker id=\"l8-label-shift-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"648\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">监督 mask 与 shift：只计答案，也能训练视觉路径</tspan>\n</text>\n<text x=\"32\" y=\"89\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"32\" dy=\"0\">① 输入序列（每个格子是一个位置）</tspan>\n</text>\n<rect x=\"36\" y=\"116\" width=\"101\" height=\"74\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"86\" y=\"143\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"86\" dy=\"0\">0</tspan>\n</text>\n<text x=\"86\" y=\"174\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"86\" dy=\"0\">视觉 1</tspan>\n</text>\n<rect x=\"149\" y=\"116\" width=\"101\" height=\"74\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"199\" y=\"143\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"199\" dy=\"0\">1</tspan>\n</text>\n<text x=\"199\" y=\"174\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"199\" dy=\"0\">视觉 2</tspan>\n</text>\n<rect x=\"262\" y=\"116\" width=\"101\" height=\"74\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"312\" y=\"143\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"312\" dy=\"0\">2</tspan>\n</text>\n<text x=\"312\" y=\"174\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"312\" dy=\"0\">USER</tspan>\n</text>\n<rect x=\"375\" y=\"116\" width=\"101\" height=\"74\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"425\" y=\"143\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"425\" dy=\"0\">3</tspan>\n</text>\n<text x=\"425\" y=\"174\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"425\" dy=\"0\">问题</tspan>\n</text>\n<rect x=\"488\" y=\"116\" width=\"101\" height=\"74\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"538\" y=\"143\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"538\" dy=\"0\">4</tspan>\n</text>\n<text x=\"538\" y=\"174\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"538\" dy=\"0\">ASSIST</tspan>\n</text>\n<rect x=\"601\" y=\"116\" width=\"101\" height=\"74\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"651\" y=\"143\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"651\" dy=\"0\">5</tspan>\n</text>\n<text x=\"651\" y=\"174\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"651\" dy=\"0\">狗</tspan>\n</text>\n<rect x=\"714\" y=\"116\" width=\"101\" height=\"74\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"764\" y=\"143\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"764\" dy=\"0\">6</tspan>\n</text>\n<text x=\"764\" y=\"174\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"764\" dy=\"0\">坐着</tspan>\n</text>\n<rect x=\"827\" y=\"116\" width=\"101\" height=\"74\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"877\" y=\"143\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"877\" dy=\"0\">7</tspan>\n</text>\n<text x=\"877\" y=\"174\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"877\" dy=\"0\">EOS</tspan>\n</text>\n<text x=\"32\" y=\"249\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"32\" dy=\"0\">② label：忽略提示，只监督回答</tspan>\n</text>\n<rect x=\"36\" y=\"274\" width=\"101\" height=\"65\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"86\" y=\"313\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"86\" dy=\"0\">−100</tspan>\n</text>\n<rect x=\"149\" y=\"274\" width=\"101\" height=\"65\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"199\" y=\"313\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"199\" dy=\"0\">−100</tspan>\n</text>\n<rect x=\"262\" y=\"274\" width=\"101\" height=\"65\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"312\" y=\"313\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"312\" dy=\"0\">−100</tspan>\n</text>\n<rect x=\"375\" y=\"274\" width=\"101\" height=\"65\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"425\" y=\"313\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"425\" dy=\"0\">−100</tspan>\n</text>\n<rect x=\"488\" y=\"274\" width=\"101\" height=\"65\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"538\" y=\"313\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"538\" dy=\"0\">−100</tspan>\n</text>\n<rect x=\"601\" y=\"274\" width=\"101\" height=\"65\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"651\" y=\"313\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"651\" dy=\"0\">狗</tspan>\n</text>\n<rect x=\"714\" y=\"274\" width=\"101\" height=\"65\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"764\" y=\"313\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"764\" dy=\"0\">坐着</tspan>\n</text>\n<rect x=\"827\" y=\"274\" width=\"101\" height=\"65\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"877\" y=\"313\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"877\" dy=\"0\">EOS</tspan>\n</text>\n<path d=\"M563,196 L631,261\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l8-label-shift-arrow)\" class=\"d1-s-grn\" />\n<
