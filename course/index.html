<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多模态大模型的前世今生 · 互动课程</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --ink:#e7ecf3; --mut:#9aa4b2;
  --line:#2a333f; --acc:#6b8afd; --acc2:#f0a84a; --grn:#49c184; --red:#e06c6c;
  --vio:#b48bff; --shadow:0 2px 14px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f5f7fa; --panel:#ffffff; --panel2:#f0f3f7; --ink:#1b2230; --mut:#5b6472;
  --line:#e2e7ee; --acc:#3b5bdb; --acc2:#c9801f; --grn:#1f9d63; --red:#c9524f;
  --vio:#7c5cff; --shadow:0 2px 12px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--acc)}
code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:.9em;
  font-family:"SF Mono",Consolas,Monaco,monospace}
/* layout */
#top{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .lft{display:flex;align-items:center;gap:12px;min-width:0}
#top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top h1 span{color:var(--acc)}
.tbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:6px 12px;cursor:pointer;font-size:13px}
.tbtn:hover{border-color:var(--acc)}
#menuBtn{display:none;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:6px 11px;cursor:pointer;font-size:15px}
#wrap{display:flex;padding-top:56px}
#nav{position:fixed;top:56px;bottom:0;left:0;width:280px;overflow-y:auto;background:var(--panel);
  border-right:1px solid var(--line);padding:16px 0}
#nav .grp{color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px;padding:14px 22px 6px;text-transform:uppercase}
#nav a{display:block;color:var(--ink);text-decoration:none;padding:7px 22px;font-size:14.5px;border-left:3px solid transparent}
#nav a:hover{background:var(--panel2)}
#nav a.on{border-left-color:var(--acc);color:var(--acc);background:var(--panel2);font-weight:600}
#nav a small{color:var(--mut);font-weight:400}
#main{margin-left:280px;flex:1;min-width:0;max-width:880px;padding:36px 48px 120px}
/* lecture */
.lec{display:none;animation:fade .25s}
.lec.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.kick{color:var(--acc);font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.lec h2{font-size:30px;margin:6px 0 4px;line-height:1.25}
.lead{color:var(--mut);font-size:17px;margin:0 0 8px}
.lec h3{font-size:20px;margin:30px 0 8px;padding-top:6px}
.lec h4{font-size:16px;margin:20px 0 6px;color:var(--acc)}
.lec p{margin:10px 0}
.lec ul,.lec ol{margin:10px 0;padding-left:22px}
.lec li{margin:5px 0}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--mut);
  border-radius:20px;padding:2px 11px;font-size:12px;margin-right:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.note{border-left:3px solid var(--acc2);background:var(--panel2);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
.note b{color:var(--acc2)}
.key{border-left:3px solid var(--grn);background:var(--panel2);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
.key b{color:var(--grn)}
.warn{border-left:3px solid var(--red);background:var(--panel2);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
.warn b{color:var(--red)}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:600}
.flow{font-family:"SF Mono",Consolas,monospace;font-size:13px;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre;overflow-x:auto;color:var(--mut)}
.quiz{margin:22px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}
.quiz summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14.5px;color:var(--acc);list-style:none}
.quiz summary::-webkit-details-marker{display:none}
.quiz summary:before{content:"▸ ";color:var(--mut)}
.quiz[open] summary:before{content:"▾ "}
.quiz .qa{padding:0 16px 14px;color:var(--ink);font-size:14.5px;border-top:1px solid var(--line);padding-top:10px}
.navbtns{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
.navbtns button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:12px;cursor:pointer;font-size:14px}
.navbtns button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.navbtns button:disabled{opacity:.35;cursor:default}
/* widgets */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:20px 0;box-shadow:var(--shadow)}
.widget .wh{font-weight:700;font-size:15px;margin-bottom:4px}
.widget .wsub{color:var(--mut);font-size:13px;margin-bottom:12px}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.ctrl label{font-size:13px;color:var(--mut);min-width:84px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--panel2);border:none;color:var(--mut);padding:7px 14px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
canvas{max-width:100%;display:block;background:var(--panel2);border-radius:10px;border:1px solid var(--line)}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.stat div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-size:22px;color:var(--acc)}
.stat span{font-size:12px;color:var(--mut)}
/* timeline */
.tl{position:relative;margin:10px 0;overflow-x:auto;padding-bottom:8px}
.tl-row{display:flex;gap:0;min-width:900px}
.tl-item{flex:1;text-align:center;cursor:pointer;position:relative;padding-top:26px;background:none;border:none;color:inherit;font:inherit}
.tl-item:before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--line)}
.tl-item .dot{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--panel);transition:.15s}
.tl-item.on .dot{background:var(--acc);box-shadow:0 0 0 4px rgba(107,138,253,.25)}
.tl-item .yr{font-size:12px;color:var(--mut)}
.tl-item .nm{font-size:12.5px;font-weight:600;margin-top:2px}
.tl-item.on .nm{color:var(--acc)}
.tl-detail{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px}
.phase{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* present (大字/投屏) mode */
[data-present="1"] #main{max-width:1100px;font-size:19px;line-height:1.85}
[data-present="1"] .lec h2{font-size:38px}
[data-present="1"] .lec h3{font-size:25px}
[data-present="1"] .lead{font-size:20px}
[data-present="1"] .flow{font-size:15px}
@media(max-width:860px){
  #nav{display:none}
  #nav.open{display:block;position:fixed;top:56px;left:0;bottom:0;width:270px;z-index:40;box-shadow:var(--shadow)}
  #menuBtn{display:inline-block}
  #main{margin-left:0;padding:24px 16px 100px}
  #navScrim{display:none;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.35);z-index:35}
  #navScrim.on{display:block}
}
@media print{
  /* force a readable light palette regardless of dark/light theme, so note/panel backgrounds don't stay dark */
  html{--bg:#fff!important;--panel:#fff!important;--panel2:#f3f3f3!important;--ink:#000!important;
    --mut:#2a2a2a!important;--line:#b9b9b9!important;--acc:#15379c!important;--acc2:#8a5a10!important;
    --grn:#157a46!important;--red:#b23b36!important;--vio:#5a3fb0!important;--shadow:none!important}
  *{box-shadow:none!important}
  #top,#nav,#navScrim,.navbtns,.tbtn,#menuBtn{display:none!important}
  #wrap{padding-top:0}
  #main{margin:0;max-width:none;padding:0}
  body{background:#fff;color:#000}
  .lec{display:block!important;animation:none;page-break-after:always}
  .widget,.card,.flow,table,.quiz,.note,.key,.warn{break-inside:avoid}
  .quiz{border:1px solid #b9b9b9}
}
</style>

<script type="text/plain" id="file-lab_shapes.py">
"""CPU processor evidence; optional GPU inference. Never invent model answers."""
import argparse
import importlib.metadata
import json
import platform
from pathlib import Path

import torch
from PIL import Image, ImageDraw
from transformers import AutoProcessor

ROOT = Path(__file__).resolve().parent
MODELS = {
    "llava": "llava-hf/llava-1.5-7b-hf",
    "qwen": "Qwen/Qwen2.5-VL-3B-Instruct",
}


def make_image(path, side):
    im = Image.new("RGB", (side, side), "white")
    d = ImageDraw.Draw(im)
    # A deterministic, self-created OCR fixture; not a real-world benchmark.
    lines = ["SAMPLE INVOICE", "ID: INV-042", "ITEM      QTY      PRICE",
             "Notebook   3      12.50", "TOTAL: 37.50", "PAID: NO"]
    for i, line in enumerate(lines):
        d.text((side // 12, side // 10 + i * side // 11), line,
               fill="black", font_size=max(12, side // 30))
    im.save(path)
    return im


def main():
    a = argparse.ArgumentParser()
    a.add_argument("--model", choices=MODELS, default="qwen")
    a.add_argument("--sizes", nargs="+", type=int, default=[336, 672])
    a.add_argument("--infer", action="store_true")
    a.add_argument("--out", type=Path, default=ROOT / "evidence" / "lab-shapes.json")
    args = a.parse_args()
    args.out.parent.mkdir(parents=True, exist_ok=True)
    model_id = MODELS[args.model]
    # Explicit sizes below remain below this budget and avoid unexpected resize.
    kwargs = {"min_pixels": 28 * 28, "max_pixels": 1280 * 28 * 28} if args.model == "qwen" else {}
    processor = AutoProcessor.from_pretrained(model_id, **kwargs)
    versions = {n: importlib.metadata.version(n) for n in ["torch", "transformers", "pillow", "accelerate"]}
    result = {"model": model_id, "python": platform.python_version(), "versions": versions,
              "cuda": torch.cuda.is_available(), "processor_only": not args.infer,
              "fixture": "self-created synthetic invoice, not a benchmark", "cases": []}
    model = None
    if args.infer:
        if not torch.cuda.is_available():
            raise RuntimeError("GPU inference requested, but CUDA is unavailable. Use processor-only mode.")
        from transformers import LlavaForConditionalGeneration, Qwen2_5_VLForConditionalGeneration
        cls = Qwen2_5_VLForConditionalGeneration if args.model == "qwen" else LlavaForConditionalGeneration
        model = cls.from_pretrained(model_id, torch_dtype=torch.float16, device_map="auto")
        model.eval()
    for side in args.sizes:
        image_path = args.out.parent / f"invoice-{side}.png"
        im = make_image(image_path, side)
        prompt = "Read ID, total, and paid status. Answer only with a JSON object."
        if args.model == "qwen":
            text = processor.apply_chat_template(
                [{"role": "user", "content": [{"type": "image"}, {"type": "text", "text": prompt}]}],
                tokenize=False, add_generation_prompt=True)
            image_token = "<|image_pad|>"
        else:
            text = "USER: <image>\n" + prompt + " ASSISTANT:"
            image_token = "<image>"
        inputs = processor(text=[text], images=[im], return_tensors="pt")
        case = {"source_size": [side, side], "fixture_file": image_path.name,
                "prompt": prompt, "input_shapes": {k: list(v.shape) for k, v in inputs.items()},
                "expanded_image_placeholders": int((inputs["input_ids"] == processor.tokenizer.convert_tokens_to_ids(image_token)).sum())}
        if args.model == "qwen":
            grid = inputs["image_grid_thw"][0].tolist()
            case["image_grid_thw"] = grid
            case["expected_llm_visual_tokens"] = grid[0] * grid[1] * grid[2] // 4
        else:
            h, w = inputs["pixel_values"].shape[-2:]
            case["expected_llm_visual_tokens"] = h // 14 * (w // 14)
        assert case["expanded_image_placeholders"] == case["expected_llm_visual_tokens"], case
        if model is not None:
            inputs = inputs.to(model.device)
            with torch.inference_mode():
                generated = model.generate(**inputs, do_sample=False, max_new_tokens=128)
            case["actual_model_output"] = processor.batch_decode(
                generated[:, inputs["input_ids"].shape[1]:], skip_special_tokens=True)[0]
        result["cases"].append(case)
    args.out.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
    print(json.dumps(result, ensure_ascii=False, indent=2))


if __name__ == "__main__":
    main()

</script>

<script>
/* ============ COURSE CONTENT ============ */
const LECTURES = [
 {id:"l0", grp:"开篇", kick:"Lecture 0", title:"为什么要让模型「看见」",
  lead:"核心矛盾、一条贯穿全课的问题、以及这门课的地图。",
  quiz:{q:"把一张图接到 LLM，最需要解决哪三个接口问题？",
    a:"① 从像素里<b>提取信息</b>；② 让视觉特征在<b>维度与语义上对齐</b>语言空间;③ 把视觉与文本<b>组织成一条带位置的序列</b>。——不只是给像素起个「token」的名字。"},
  html:`
  <p>欢迎来到《多模态大模型的前世今生》。这门课只围绕<b>一个问题</b>展开:</p>
  <div class="key"><b>核心问题</b>:怎么让一台机器既<b>看得见</b>(理解图像),又<b>说得清</b>(用语言表达)?</div>
  <p>人类看一张图能脱口而出它的内容,因为我们的视觉和语言在大脑里是打通的。但对机器来说,图像是<b>像素网格</b>,语言是<b>离散符号</b>,两者天生不在一个空间。多模态大模型(Vision-Language Model, VLM)这十年的全部故事,本质就是:</p>
  <div class="note"><b>一句话</b>:想方设法把「像素」翻译成语言模型能接着处理的「类词向量」,让一个会读文字的大模型顺便"看得见"。</div>
  <div class="note"><b>读前须知</b>:本课以<b>视觉-语言模型(VLM)</b>为主线;默认你了解 Transformer、embedding 与基本的监督训练。音频 / Omni 作为拓展顺带提及,不是重点。L6 信息量最大,会拆成「编码器 / 连接器·分辨率 / 位置编码」三小段。</div>
  <h3>这门课怎么讲</h3>
  <p>我们不按工程模块平铺,而是沿着<b>时间线</b>讲一个演化故事,分三幕:</p>
  <ul>
    <li><span class="tag">前世</span> LLM 之前——看图说话、CLIP、BLIP/Flamingo 如何打下地基(L1–L3)。</li>
    <li><span class="tag">今生</span> LLM 时代——LLaVA 确立范式,再从数据、结构、tokenizer、训练、评估逐层深入(L4–L9)。</li>
    <li><span class="tag">未来</span> 统一生成、任意模态、Agent、效率与安全(L10)。</li>
  </ul>
  <p>每讲用同一节奏推进:<b>问题 → 旧方案瓶颈 → 新机制 → 证据 → 边界 → 检查题</b>。</p>
  <p>下面这条时间线是全课的骨架。<b>点一下任意里程碑</b>,看它在历史中的位置:</p>
  <div id="timeline"></div>
  <h3>先建立一张"心智地图"</h3>
  <p>记住这条数据流,它会贯穿整门课——六大技术维度,其实都是在回答这条链路上的某个问题:</p>
  <div class="flow">图像 ──▶ 视觉编码器(ViT) ──▶ 一堆视觉特征
                                 │
                                 ▼
                            连接器(投影)      文本 ──▶ 分词器 ──▶ 文本向量
                                 │                               │
                                 └───────────┬───────────────────┘
                                             ▼
                                 [视觉tokens][文本tokens]  一条序列
                                             ▼
                                      大语言模型(LLM)
                                             ▼
                                     自回归生成文字答案</div>
  <p>准备好了吗?我们从机器第一次"看图说话"讲起。</p>
  `},

 {id:"l1", grp:"前世 · LLM 之前", kick:"Lecture 1", title:"起源:看图说话",
  lead:"前 Transformer 时代——CNN+RNN、image captioning 与 VQA 的萌芽。",
  quiz:{q:"把整图压成单个向量,和「区域注意力」相比,差在哪?",
    a:"单向量把全图<b>压扁、丢细节</b>;区域注意力让模型生成每个词时<b>看向图像不同区域</b>,细粒度更好。但要注意:注意力图是一种对齐线索,<b>并不等于充分的因果解释</b>。"},
  html:`
  <p>多模态并不是大模型时代才有的。早在 2015 年前后,研究者就想让机器给图像配文字说明(image captioning)。</p>
  <h3>第一代范式:CNN 看图 + RNN 说话</h3>
  <p>代表作 <b>Show and Tell</b>(2015):</p>
  <ul>
    <li><b>CNN</b>(如 VGG/GoogLeNet)把图像压成一个固定向量——这是"看"。</li>
    <li>把这个图像向量作为 <b>RNN/LSTM 的初始时间步输入</b>,让它一个词一个词地生成句子——这是"说"。(「视觉向量当初始状态」是常见的架构类比,具体喂入方式各篇略有不同。)</li>
  </ul>
  <div class="note"><b>注意</b>:这个"CNN 编码 + 语言模型解码"的骨架,和今天 VLM 的"视觉编码器 + LLM"惊人地相似。变的是零件(CNN→ViT、LSTM→Transformer),不变的是思路。</div>
  <h3>注意力的登场</h3>
  <p><b>Show, Attend and Tell</b>(2015)引入了视觉注意力:生成每个词时,模型学会"看向"图像的不同区域(生成"狗"时看向狗)。这是"注意力对齐文字与图像区域"的最早雏形——日后 Transformer 把注意力推向极致。</p>
  <h3>VQA:从"描述"到"问答"</h3>
  <p>很快任务升级为 <b>视觉问答(VQA)</b>:给图 + 问题 → 答案。这迫使模型不只是描述,还要<b>推理</b>("图里有几个人?""她在做什么?")。VQA 数据集(2015)和评测范式一直沿用到今天(L9 会再见到)。</p>
  <h3>这一代的天花板</h3>
  <ul>
    <li>CNN 把整图压成一个向量,<b>细节丢失严重</b>;</li>
    <li>LSTM 生成能力弱、没有世界知识;</li>
    <li>每个任务要单独训练,没有"通用"可言。</li>
  </ul>
  <div class="key"><b>承上启下</b>:要突破,需要两样东西——(1) 一个<b>强大且语义对齐</b>的视觉编码器;(2) 一个<b>有世界知识、会推理</b>的语言模型。前者由 L2 的 CLIP 解决,后者由大语言模型(LLM)解决。</div>
  `},

 {id:"l2", grp:"前世 · LLM 之前", kick:"Lecture 2", title:"对齐的突破:CLIP 与对比学习",
  lead:"用网络规模的图文对比预训练,造出一个「语义对齐」的视觉底座。",
  quiz:{q:"CLIP 已经能做图文相似度匹配,为什么接 LLM 时还要一个连接器?",
    a:"CLIP 的图像向量是和<b>它自己的文本编码器</b>对齐的,不等于和<b>任意 LLM 的词向量空间</b>对齐——维度不同、训练分布不同。所以还要一个连接器把它「翻译」进目标 LLM 的空间(L4)。"},
  html:`
  <p>2021 年的 <b>CLIP</b>(OpenAI)是整个现代 VLM 的地基。几乎今天每一个 VLM 的视觉编码器,要么是 CLIP,要么是它的后代(如 SigLIP)。</p>
  <h3>CLIP 的核心想法:对比学习</h3>
  <p>不再给图像打"猫/狗"这种固定标签,而是从网上抓 <b>4 亿对「图-文」</b>,让模型学会:<b>匹配的图文离得近,不匹配的离得远</b>。</p>
  <div class="flow">一个 batch 里有 N 张图、N 句话(正确配对在对角线)
 图像编码器 → N 个图向量
 文本编码器 → N 个文本向量
 目标:让 (图i, 文i) 相似度最高，(图i, 文j≠i) 相似度低
       → 这就是"对比损失"</div>
  <h3>为什么这一步如此关键</h3>
  <ul>
    <li><b>语义对齐</b>:CLIP 的图像向量和<b>它自己的文本编码器</b>对齐,天生"懂语言"。但这只是和 CLIP 文本空间对齐,接 LLM 时仍需再"翻译"一下(这正是 L4 LLaVA 做的)。</li>
    <li><b>规模即能力</b>:4 亿网络图文对带来了强大的泛化(zero-shot 分类:给任意类别名就能分类)。</li>
    <li><b>可复用</b>:训练一次,被无数下游 VLM 当作视觉编码器反复使用(常冻结,也有继续训练的)。</li>
  </ul>
  <div class="note"><b>进化</b>:<b>SigLIP</b>(2023)把 CLIP 的 softmax 对比损失换成 sigmoid,训练更稳、更省,在很多设置下更好,是如今新 VLM 的常用视觉底座——但"更好"要看具体任务与规模,并非无条件。</div>
  <div class="key"><b>记住</b>:CLIP 解决了"看"的<b>质量</b>与"语义对齐"问题。它是 VLM 三件套里"视觉编码器"那一件的常见默认答案(但不是唯一;如 Qwen2.5-VL 自训 ViT,见 L6)。</div>
  `},

 {id:"l3", grp:"前世 · LLM 之前", kick:"Lecture 3", title:"桥接时代:BLIP-2 与 Flamingo",
  lead:"如何把「冻结的视觉」接到「冻结的语言」——连接器思想的诞生。",
  quiz:{q:"BLIP-2 用固定 32 个 query 把视觉压成 32 个 token,收益与代价各是什么?",
    a:"收益:把<b>任意数量</b>的视觉特征压成<b>固定、少量</b>的 token,控制喂进 LLM 的序列长度、省算力。代价:这个瓶颈可能<b>丢失细粒度信息</b>(小字、密集细节)。"},
  html:`
  <p>有了强视觉编码器(CLIP)和强语言模型(早期 LLM),下一个问题是:<b>怎么把两者接起来?</b> 2022–2023 年,两条重要思路出现。</p>
  <h3>Flamingo(2022):冻结双塔 + 交叉注意力 + few-shot</h3>
  <ul>
    <li>视觉编码器和语言模型都<b>冻结</b>,中间插入可训练的 <b>gated cross-attention</b> 层,让语言模型"回头看"图像特征;视觉侧还用 <b>Perceiver Resampler</b> 把特征重采样成固定数量。</li>
    <li>支持<b>少样本(few-shot)</b>:在上下文里给几个"图+答案"示例,就能适应新任务——第一次让多模态有了"上下文学习"的味道。</li>
  </ul>
  <h3>BLIP-2(2023):Q-Former —— 连接器的代表答案</h3>
  <p>BLIP-2 提出 <b>Q-Former</b>,优雅地解决"视觉特征太多、怎么喂给 LLM"的问题:</p>
  <div class="flow">视觉特征(很多个)
     │  ← 一组可学习的 "query 向量"(如 32 个)
     ▼  通过 cross-attention 从视觉特征里"抽取"关键信息
 32 个浓缩的视觉 token ──▶ 投影 ──▶ 喂给冻结的 LLM</div>
  <ul>
    <li><b>关键创新</b>:用少量 query 把任意数量的视觉特征<b>压成固定的少数几个 token</b>,大大降低 LLM 的负担。</li>
    <li>这是"连接器(connector)"思想的<b>代表性方案之一</b>;后来 LLaVA 的 MLP、Qwen 的 Resampler 都在同一问题上做不同取舍(L6 详述),不是谁照抄谁。</li>
  </ul>
  <div class="note"><b>承上启下</b>:到这里,"视觉编码器 + 连接器 + 语言模型"的三件套雏形已经齐了。但它们还很笨重(Q-Former 难训、few-shot 能力有限)。真正让 VLM "飞入寻常百姓家"的,是下一讲一个<b>极其简单</b>的配方——LLaVA。</div>
  `},

 {id:"l4", grp:"今生 · LLM 时代", kick:"Lecture 4", title:"范式确立:LLaVA 与视觉指令微调",
  lead:"一个简单到能逐行读完的配方,定义了现代 VLM。",
  quiz:{q:"「336/14=24,所以 576 个 patch」——576 是初版 LLaVA 的配置吗?",
    a:"不是。576 是本课主例 <b>LLaVA-1.5</b>(ViT-L/14 @336px,24×24=576,2 层 MLP)。<b>初版 LLaVA</b>(2023.4)用 @224px → 16×16=<b>256</b> patch、<b>线性投影</b>。看到 576 要默认它是 1.5。"},
  html:`
  <p>2023 年的 <b>LLaVA</b> 证明了一件事:不需要 Q-Former 那么复杂,一个<b>极简</b>配方就能造出强大的 VLM。它是现代 VLM 的"Hello World",也是你理解一切的骨架。</p>
  <div class="warn"><b>先分清版本(本课贯穿)</b>:
    <ul style="margin:6px 0 0">
      <li><b>初版 LLaVA</b>(2023.4):CLIP ViT-L/14 <b>@224px</b> → 16×16=<b>256</b> 视觉 token;连接器是<b>单层线性投影</b>;指令数据约 <b>158K</b>(纯文本 GPT-4 合成)。</li>
      <li><b>LLaVA-1.5</b>(2023.10,下面三件套的主例):升到 <b>@336px</b> → 24×24=<b>576</b> 视觉 token;连接器换成 <b>2 层 MLP</b>;数据配方扩充(含学术 VQA 等)。</li>
    </ul>
  </div>
  <h3>三件套(记住这三个框 · 以 LLaVA-1.5 为例)</h3>
  <div class="flow">图像 ─▶ [CLIP ViT-L/14 @336 视觉编码器] ─▶ 576 个视觉特征
                                               │
                                        [2层 MLP 投影]
                                               ▼
                                        576 个"视觉 token"
 文本 ─▶ [分词器] ─▶ 文本 token ───┐           │
                                   └───────────┴──▶ [LLM Vicuna] ─▶ 文字答案</div>
  <ul>
    <li><b>视觉编码器</b>:CLIP ViT-L/14 @336px,一张图切成 24×24=<b>576 个 patch</b>,每个输出一个向量(初版 @224 为 256)。</li>
    <li><b>连接器</b>:LLaVA-1.5 是一个 <b>2 层 MLP</b>,把视觉向量映射到 LLM 的词向量维度(初版为线性)。</li>
    <li><b>LLM</b>:Vicuna。它把 [576 视觉 token + 文本 token] 当成一条普通长序列处理。</li>
  </ul>
  <div class="key"><b>关键直觉</b>:在 LLM 眼里,那 576 个视觉 token 和普通词向量<b>没有区别</b>——它只是在读一段更长的"文本",前面 576 个"词"恰好编码了图像。</div>
  <h3>两阶段训练(后来几乎所有 VLM 都沿用)</h3>
  <table><tr><th>阶段</th><th>训什么</th><th>冻什么</th><th>目的</th></tr>
  <tr><td>① 对齐预训练</td><td>只训 MLP 投影</td><td>冻 CLIP + 冻 LLM</td><td>先让视觉向量"对上"语言空间</td></tr>
  <tr><td>② 视觉指令微调</td><td>训 MLP + LLM</td><td>冻 CLIP</td><td>教它听指令、按要求作答</td></tr></table>
  <h3>一个巧妙的数据招(埋点到 L5)</h3>
  <p>LLaVA 没有现成的"图文对话"数据,于是用<b>纯文本 GPT-4</b>:把图的 caption + 物体坐标(都是文字)喂给它,让它"脑补"出多轮对话、详细描述、推理问答,造出约 158K 条指令数据。<b>成本低但不是零</b>——有 API 费用、还要筛选与校验;而且因为 GPT-4 没真看图,也<b>埋下了幻觉的种子</b>(L8 再谈)。</p>
  <div class="note"><b>承上启下</b>:LLaVA 简单但有短板——分辨率低、token 固定、连接器朴素、会幻觉。接下来五讲(L5–L9),就是沿着这些短板,逐层看现代 VLM(以 Qwen2.5-VL 为主参考)如何进化。</div>
  `},

 {id:"l5", grp:"今生 · LLM 时代", kick:"Lecture 5", title:"数据的艺术",
  lead:"数据是 VLM 效果的天花板——比结构更决定上限。",
  quiz:{q:"caption 越长越详细,就一定对训练越好吗?",
    a:"不一定。<b>忠实性优先于长度</b>:越长越容易掺入图里没有的细节,这些<b>无视觉依据的描述会把幻觉写进训练数据</b>。好的 re-caption 是「详细且可在图中逐条验证」。"},
  html:`
  <p>如果说结构决定模型"能不能学",数据决定它"学成什么样"。这一讲看 VLM 的数据怎么来、怎么洗、怎么配。</p>
  <h3>两大类数据(对应两阶段)</h3>
  <table><tr><th>类型</th><th>用在</th><th>形态</th><th>作用</th></tr>
  <tr><td>对齐/预训练数据</td><td>阶段①</td><td>图 + 短 caption</td><td>求"广":海量图文对,对齐+灌知识</td></tr>
  <tr><td>指令/SFT 数据</td><td>阶段②</td><td>图 + 多轮对话/问答</td><td>求"对":高质量,练具体能力</td></tr></table>
  <h3>三个核心技巧</h3>
  <h4>① Re-caption(重写描述)</h4>
  <p>网络 alt 文本极脏("IMG_1234.jpg")。用强 VLM 给图<b>重新生成高质量详细描述</b>替换它(如 ShareGPT4V)。效果显著,但要花算力,且会继承 captioner 的幻觉。注意:清洗是<b>去噪/过滤/去重</b>,不会无中生有补事实;re-caption 则是一次<b>新的标注</b>。</p>
  <h4>② 用 LLM 合成指令数据</h4>
  <p>就是 LLaVA 那招。局限:合成模型没真看图,可能脑补出图里没有的细节——<b>幻觉数据的源头之一</b>。</p>
  <h4>③ 全开放数据范式(Molmo / PixMo)</h4>
  <p>多数"开源"VLM 只开权重不开数据。<b>Molmo</b> 连数据和采集管线都公开:让标注员<b>口头描述图像 60–90 秒</b>再转写,得到超详细、不套路的 caption,且<b>不从别的 VLM 蒸馏</b>,避免"近亲繁殖"式的天花板。想理解"数据怎么造",它是最透明的一手材料。</p>
  <h3>互动:同一张图,数据策略不同,喂进去的文本天差地别</h3>
  <p>下面是一张<b>自制教学示意图</b>。对照图像,判断每种描述里<b>哪些是可观察事实、哪些是无依据的脑补</b>:</p>
  <div id="dataW"></div>
  <h3>数据工程三件事</h3>
  <ul>
    <li><b>清洗</b>:去损坏图/NSFW/图文不相关(常用 CLIP 相似度打分过滤)。</li>
    <li><b>去重</b>:尤其要和<b>评测集去重</b>——否则数据污染,刷榜虚高(L9 详述)。</li>
    <li><b>配比(mixture)</b>:最玄也最关键。通用/文档/数理/grounding 各占多少,直接决定模型"偏科";还要混<b>少量纯文本</b>防止语言能力退化。</li>
  </ul>
  <div class="key"><b>记住</b>:指令阶段,<b>质量 &gt; 数量</b>。少而精常常打败海量低质。</div>
  `},

 {id:"l6", grp:"今生 · LLM 时代", kick:"Lecture 6", title:"结构的进化",
  lead:"视觉编码器、连接器、分辨率、位置编码——从 LLaVA 到 Qwen2.5-VL 变了什么。",
  quiz:{q:"一张 672×672 图,patch=14,2×2 合并后是多少视觉 token?",
    a:"48×48 = <b>2304</b> 个 patch,2×2 合并后 = <b>576</b> 个视觉 token(这与我们实测 Qwen2.5-VL 处理 672² 的结果一致)。注:真实 processor 还可能加少量特殊/边界 token,此处未计。"},
  html:`
  <p>LLaVA 的结构最简,也因此有短板。现代 VLM 的结构创新,几乎都围绕一个矛盾:<b>如何高效处理高分辨率与多图/视频</b>。这一讲分三小段:连接器 → 分辨率 → 位置编码。</p>
  <h3>一、连接器三流派</h3>
  <ul>
    <li><b>MLP</b>(LLaVA):最简单,不改 token 数(576 进 576 出)。保真但 token 不可控。</li>
    <li><b>Q-Former</b>(BLIP-2):用 query 把视觉特征压成固定少量 token。省算力但易丢细节。</li>
    <li><b>Resampler</b>(Qwen-VL 等):cross-attention 重采样。本质都在平衡 <b>token 数 ↔ 信息保真</b>。</li>
  </ul>
  <h3>二、头号难题:分辨率(决定文档/OCR 能力)</h3>
  <p>336px 看不清小字,但分辨率一高,patch 数<b>平方级</b>暴涨,LLM 吃不消。三种解法:</p>
  <ol>
    <li><b>固定低分辨率</b>(LLaVA-1.5):简单,文档能力弱。</li>
    <li><b>AnyRes 切图</b>(LLaVA-NeXT):把大图切成多个 336px 小块、<b>外加一张全局缩略图</b>分别编码。看得清,但 token 线性涨、块间缺全局关系。(真实 LLaVA-NeXT 还有候选分辨率网格、unpadding、换行 token 等细节,下面的滑块只是<b>教学估算</b>,不等于真实 processor。)</li>
    <li><b>原生动态分辨率</b>(Qwen2-VL,借鉴 NaViT):ViT 直接处理任意分辨率/长宽比,输出<b>可变数量</b> token,再适度压缩(2×2 合并)。目前较优方向。</li>
  </ol>
  <h3>互动:拖一拖,看"分辨率—token 数—自注意力长度"怎么联动</h3>
  <div id="resW"></div>
  <h3>三、位置编码:M-RoPE</h3>
  <p>文本是 1D、图像是 2D、视频多一维时间。<b>M-RoPE</b>(Qwen2-VL)把旋转位置编码拆成<b>时间/高/宽</b>三个分量:文本三分量相同(退化成普通 RoPE),图像按其 2D(h,w) 位置赋值、视频再加时间 t。统一表达三种模态的位置,对分辨率/帧数外推更友好。Qwen2.5-VL 还让<b>时间分量对齐绝对时间</b>(不是单纯帧序号),利于定位视频中的时刻。</p>
  <h3>互动:亲眼看 RoPE 的相对位置点积,以及 M-RoPE 的 (t,h,w) 坐标</h3>
  <div id="ropeW"></div>
  <h3>把编码器也算进来:Qwen2.5-VL 不是直接套现成 CLIP</h3>
  <p>它<b>自训 ViT</b>,<b>大多数层用 window attention</b>(只在局部窗口内做注意力,降低高分辨率下的算力),少数层做全局;再配 M-RoPE 与动态分辨率。所以"视觉编码器 = 冻结的 CLIP"只是 LLaVA 系的做法,不能推广到所有 VLM。</p>
  <table><tr><th></th><th>LLaVA-1.5</th><th>Qwen2.5-VL</th></tr>
  <tr><td>视觉编码器</td><td>冻结 CLIP ViT-L/14</td><td>自训 ViT,多层 window attention</td></tr>
  <tr><td>分辨率</td><td>固定 336</td><td>原生动态分辨率(28 倍数对齐)</td></tr>
  <tr><td>视觉 token</td><td>固定 576</td><td>可变 + 2×2 合并(336²→144,672²→576)</td></tr>
  <tr><td>位置编码</td><td>普通 RoPE</td><td>M-RoPE(时/高/宽,时间对齐绝对时间)</td></tr>
  <tr><td>视频</td><td>不支持</td><td>支持</td></tr></table>
  <div class="key"><b>一句话</b>:从 LLaVA-1.5 到 Qwen2.5-VL,主线是"把分辨率、token 数、位置编码、模态"四件事从<b>固定</b>做成<b>可变且统一</b>。</div>
  `},

 {id:"l7", grp:"今生 · LLM 时代", kick:"Lecture 7", title:"Tokenizer 的分叉",
  lead:"最易被忽略的核心:图像到底算不算 token?连续 vs 离散两条路。",
  quiz:{q:"把码本大小扩大一倍,视觉序列会变长一倍吗?",
    a:"不会。<b>token 数量主要由潜空间网格(空间下采样率)决定</b>,和码本大小几乎无关;码本 K 变大,只是每个 id 的<b>容量</b>从 log₂K 增加约 1 bit。「码本大小」和「token 数量」是两件事。"},
  html:`
  <p>这一讲回答一个大多数人没想清的问题:<b>图像被"token 化"了吗?</b> 答案取决于走哪条路。</p>
  <h3>先回顾:文本的 tokenizer</h3>
  <p>BPE 把文字切成<b>词表里的离散 id</b>,再查表变向量。关键:<b>离散 id → 查表 → 向量</b>,词表有限。那图像呢?两条完全不同的路线。</p>
  <h3>路线 A:连续 soft-token(理解类主流)</h3>
  <p>就是前面那套:图 → ViT → 投影 → 连续向量,<b>直接</b>当 LLM 输入。</p>
  <div class="key"><b>关键认知</b>:这些"视觉 token"<b>不经过"离散 id→查表"</b>,它们是<b>连续向量</b>,不对应词表里任何格子。所以严格说,LLaVA/Qwen-VL 这类模型<b>对图像没有离散 tokenizer,只有编码器+投影</b>。</div>
  <div class="note"><b>别过度推论</b>:连续视觉<b>输入</b>本身<b>并不决定</b>模型一定不能生成图——能不能生图还取决于<b>输出头/解码器与训练目标</b>。本课的 LLaVA/Qwen-VL 是<b>理解</b>模型,默认只输出文本;但<b>连续条件 + 扩散/flow 解码</b>同样能生图,<b>Janus</b> 更是把"理解用的视觉编码"和"生成用的视觉编码"分开。所以不存在"连续=只能看、离散=才能画"的绝对结论。</div>
  <h3>路线 B:离散视觉 token(统一/生成类)</h3>
  <p>用 <b>VQ(向量量化)</b>把图像(在一个<b>潜空间</b>里)每块映射到有限"码本"里最近的格子 → 图像变成一串<b>离散 id</b>,和文字 token 同进一个词表、同一个自回归目标。于是模型可以用同一套自回归既理解、又<b>生成图像</b>(预测视觉 token 再解码重建)。代表:<b>Chameleon、Emu3</b>。</p>
  <div class="note"><b>真实 VQ ≠ 调色板</b>:真实 VQ 工作在<b>潜空间</b>、用<b>可学习码本</b>,再经<b>解码器</b>重建图像,还有 commitment 等训练损失。下面的组件只是用 <b>RGB 最近邻量化</b>做的<b>直观类比</b>,帮你体会"离散化会丢信息"这件事本身。</div>
  <h3>互动:亲眼看"量化"丢了什么(RGB 类比)</h3>
  <div id="vqW"></div>
  <table><tr><th></th><th>A 连续 soft-token</th><th>B 离散视觉 token</th></tr>
  <tr><td>图像表示</td><td>连续向量(不进词表)</td><td>离散 id(进统一词表)</td></tr>
  <tr><td>代表</td><td>LLaVA、Qwen-VL</td><td>Chameleon、Emu3</td></tr>
  <tr><td>有离散图像 tokenizer?</td><td>没有</td><td>有(VQ)</td></tr>
  <tr><td>能否生图</td><td>理解模型默认只输出文本;接扩散/生成头亦可生图</td><td>可在同一自回归里生图</td></tr>
  <tr><td>理解类效果</td><td>目前主流更强</td><td>量化是潜在限制之一(非唯一原因)</td></tr></table>
  <div class="note"><b>一句话</b>:连续(A)与离散(B)是多模态最重要的分叉之一;但两条路<b>正在互相借鉴、融合</b>(L10)。量化会丢信息是事实,却<b>不能据此断言所有离散模型都弱</b>——效果由数据、规模、训练共同决定。</div>
  `},

 {id:"l8", grp:"今生 · LLM 时代", kick:"Lecture 8", title:"训练与对齐",
  lead:"三段式、冻结策略、DPO,以及 VLM 的头号顽疾——幻觉。",
  quiz:{q:"答案 loss 的 mask 不包含图像,那连接器还有梯度吗?",
    a:"有。只要连接器<b>未冻结</b>且在<b>计算图</b>里,梯度就能通过「答案 token 的 loss」沿反向传播回到连接器(乃至未冻结的视觉侧)。「图像不作监督标签」≠「视觉侧没有梯度」。"},
  html:`
  <p>这一讲把"怎么训出来"讲透。先给一个<b>教学用的概括模型</b>,再对照 Qwen2.5-VL 的<b>真实配方</b>——两者别混为一谈。</p>
  <h3>教学概括:三段式(简化心智模型)</h3>
  <table><tr><th>阶段</th><th>训/冻</th><th>数据</th><th>目的</th></tr>
  <tr><td>① 对齐预训练</td><td>只训连接器,冻 LLM</td><td>海量图文对</td><td>对齐视觉到语言空间</td></tr>
  <tr><td>② 多任务/指令微调</td><td>放开 LLM(常也放开编码器)</td><td>大规模多能力数据</td><td>灌能力、学听指令</td></tr>
  <tr><td>③ 对齐优化(可选)</td><td>偏好对齐</td><td>偏好对</td><td>降幻觉、合人类偏好</td></tr></table>
  <div class="warn"><b>别把 LLaVA 的冻结策略推广到所有 VLM。</b>不同模型何时冻/解冻 ViT、分几阶段,差异很大。上表是<b>概括</b>,下面才是具体模型的<b>实配</b>。</div>
  <h3>真实配方:Qwen2.5-VL(据<a href="https://arxiv.org/html/2502.13923v1" target="_blank" rel="noopener">技术报告 arXiv:2502.13923</a>)</h3>
  <table><tr><th>报告章节</th><th>做法</th></tr>
  <tr><td>§2.2.2 预训练(三阶段)</td><td>先<b>训练视觉侧</b> → 再<b>全参数</b>训练 → 再<b>长序列/长上下文</b>阶段</td></tr>
  <tr><td>§2.3.4 后训练</td><td><b>SFT + DPO</b>,且这两步<b>冻结 ViT</b></td></tr></table>
  <p>可见它的"三阶段"指的是<b>预训练内部</b>的三步,和上面教学概括的"对齐/指令/偏好"不是同一套划分。读任何模型都要回到它自己的报告。</p>
  <h3>训练目标其实很朴素(以指令 SFT 为例)</h3>
  <p>对理解类 VLM 的指令微调:目标就是 LLM 老本行——<b>对"答案文本"做 next-token 预测</b>。图像与问题段<b>不作为监督标签</b>(不计入 loss),只有答案段算损失。</p>
  <div class="flow">序列:  [视觉tokens]  USER: 图里有什么?  ASSISTANT: 一只狗。
标签 :   ✗ 不监督     ✗ 不监督           ✓ 只监督这段
梯度 :   仍可经答案loss回传到"未冻结的"视觉侧/连接器</div>
  <p class="wsub" style="color:var(--mut)">注意:这描述的是<b>指令 SFT</b>;其他预训练目标(如含图文对比、生成式目标)不能一概而论。</p>
  <h3>冻结策略(VLM 训练的艺术)</h3>
  <ul>
    <li>阶段①只开连接器:省算力、稳,别一上来就动大模型。</li>
    <li>阶段②解冻 LLM(常也解冻编码器):能力更强但更贵、更易过拟合 → 编码器用<b>更小学习率</b>保护。</li>
    <li><b>防遗忘</b>:LLM 解冻后会忘语言能力(灾难性遗忘)→ 混入<b>纯文本数据</b>。</li>
  </ul>
  <h3>对齐优化:给 VLM 降幻觉</h3>
  <p><b>DPO</b>(给"好答案 vs 坏答案"成对数据,直接优化偏好)是 VLM 里最常用的,简单有效。也可用 RLHF/RLAIF。</p>
  <h3>幻觉:从哪来,怎么治</h3>
  <p><b>幻觉</b>=描述了图里不存在的东西。三大来源:</p>
  <ol>
    <li><b>语言先验太强</b>:"草地上通常有蓝天"→ 不看图也脑补蓝天。</li>
    <li><b>训练数据带幻觉</b>:如合成数据本身在脑补。</li>
    <li><b>视觉信息丢失</b>:分辨率低/压太狠,细节没进去只能猜。</li>
  </ol>
  <p>治理是跨层的:数据端造更忠实的数据、训练端抗幻觉对齐、结构端提分辨率、评测端用 POPE 量化(L9)。</p>
  <div class="key"><b>这和你可能关心的"安全"相通</b>:图文内容风险识别本质就是 VLM 的落地,而幻觉/对齐直接决定它可不可靠。</div>
  `},

 {id:"l9", grp:"今生 · LLM 时代", kick:"Lecture 9", title:"如何评判",
  lead:"benchmark 地图、评测方法学,以及怎么读榜不被数字骗。",
  quiz:{q:"POPE 分数很高,能证明这个模型适合上线做内容审核吗?",
    a:"不能。POPE 只测<b>一类「对象是否存在」的是/否幻觉</b>,和审核标签不是一回事。要上线审核,还得看<b>该任务的数据</b>、<b>FP/FN 与误判成本</b>、漏判、拒答、以及分布变化下的稳健性。"},
  html:`
  <p>怎么判断一个 VLM 行不行?别背榜名,按<b>能力维度</b>记。</p>
  <table><tr><th>能力</th><th>代表 benchmark</th></tr>
  <tr><td>综合学科推理</td><td>MMMU</td></tr>
  <tr><td>通用多模态</td><td>MMBench、MME、SEED</td></tr>
  <tr><td>开放式(LLM 裁判)</td><td>MM-Vet</td></tr>
  <tr><td>文档/图表/图解</td><td>DocVQA、ChartQA、AI2D(图解理解)、OCRBench</td></tr>
  <tr><td>数理视觉推理</td><td>MathVista、MathVision</td></tr>
  <tr><td>幻觉(对象存在)</td><td>POPE、HallusionBench</td></tr>
  <tr><td>定位 grounding</td><td>RefCOCO</td></tr>
  <tr><td>真实世界</td><td>RealWorldQA</td></tr></table>
  <p class="wsub" style="color:var(--mut)">提醒:<b>AI2D 是图解(diagram)理解</b>,不等于 GUI/界面 benchmark;别把它当 UI 能力的证明。</p>
  <h3>评测方法学(决定数字可信度)</h3>
  <ul>
    <li><b>选择题/固定答案</b>(MMBench 等):好自动判分,但有位置偏置、答案提取问题。<b>POPE 是"是/否"二分题</b>,不是通用多选。</li>
    <li><b>开放式 + LLM 裁判</b>(MM-Vet):灵活,但裁判有偏见(偏好长答案)、不稳定、成本高——看分数要问"用哪个裁判、哪个版本"。</li>
    <li><b>标注匹配</b>(grounding 用 IoU):受表述多样性影响,需规范化。</li>
  </ul>
  <h3>读榜 5 条防骗原则</h3>
  <ol>
    <li><b>数据污染</b>:测试集漏进训练 → 虚高。看报告有没有做训练-评测去重。</li>
    <li><b>设置不一致</b>:换 prompt/分辨率分数就变,比较要同设置。</li>
    <li><b>选择题 ≠ 真实能力</b>:多看开放式和真实世界榜。</li>
    <li><b>单榜领先 ≠ 全面强</b>:看一组榜的画像。</li>
    <li><b>平均分掩盖偏科</b>:按你的实际用途看对应维度。</li>
  </ol>
  <div class="note"><b>特别提醒</b>:<b>幻觉榜(POPE)比综合榜更能暴露问题</b>,建议第一个亲手跑的就是 POPE。但要记住它只覆盖"对象存在"一类幻觉,<b>不是整体可靠性或内容安全的证明</b>。</div>
  <div class="key"><b>能力画像速查</b>:给一个新模型,看这 6 个数即可画像——MMMU、MMBench、DocVQA/OCRBench、ChartQA、MathVista、POPE。</div>
  `},

 {id:"l10", grp:"未来", kick:"Lecture 10", title:"前沿与开放问题",
  lead:"统一生成、任意模态、Agent、效率与安全——以及留给你的问题。",
  quiz:{q:"「连续视觉输入」和「图像生成」可以同时存在于一个模型里吗?",
    a:"可以。能不能生图由<b>输出结构与训练目标</b>决定,不由输入是否连续决定。<b>连续条件 + 扩散/flow</b>、或 <b>Janus</b> 式分离理解/生成编码,都是反例。L7 的「分叉」正在被重新缝合。"},
  html:`
  <p>我们走完了前世与今生。最后看看多模态大模型正奔向哪里。</p>
  <h3>五个前沿方向</h3>
  <ul>
    <li><b>统一理解 + 生成</b>:让一个模型既看懂又能画(离散 token 路线 Emu3;或 <b>Janus</b> 分离理解/生成编码;或<b>连续条件 + 扩散/flow</b> 融合)。L7 的"分叉"正在被重新缝合。</li>
    <li><b>任意模态(Omni)</b>:文/图/音/视频统一(如 Qwen2.5-Omni),朝"全能感官"走。</li>
    <li><b>视频与长上下文</b>:从单图到长视频的时序理解、流式处理。</li>
    <li><b>GUI / Agent</b>:看屏幕、点按钮、操作软件——多模态成为 Agent 的眼睛。</li>
    <li><b>效率</b>:视觉 token 压缩、端侧 VLM、推理加速。</li>
  </ul>
  <h3>可靠性与安全(和你本职强相关)</h3>
  <p>VLM 越强,风险越大:幻觉、越狱、图文内容风险(涉黄涉暴、保护属性攻击)、深伪。<b>图文内容风险识别本身就是 VLM 的核心落地场景</b>——理解类 VLM 的对齐与可靠性,直接决定它能否用于内容/账号安全。这是技术与治理的交汇点。</p>
  <h3>留给学生的开放问题</h3>
  <ul>
    <li>连续 soft-token 更强、离散 token 更统一——未来会收敛到哪条路,还是融合?</li>
    <li>幻觉是数据问题、结构问题,还是根本的"语言先验"问题?能根治吗?</li>
    <li>评测总是落后于能力——我们怎么评一个"什么都会"的模型?</li>
  </ul>
  <div class="key"><b>全课总结</b>:十年演化,不变的是那条"编码器→连接器→语言模型"的链路和"对齐像素与文字"的核心矛盾;变的是零件越来越强、分辨率越来越高、模态越来越全。你已经有了读懂任何一个新 VLM 的坐标系。</div>
  <p>下一步去 <b>实验课</b>,亲手跑通一个,把知识变成手感。</p>
  `},

 {id:"lab", grp:"实验", kick:"Lab", title:"实验课:跑通 + 评测",
  lead:"看十遍不如跑一遍。四级实验(CPU→GPU→评测→误差分析)+ 精确书单 + 自检清单。",
  quiz:{q:"两个模型都是 576 视觉 token,为什么效果可能差很多?",
    a:"因为「token 数」不等于「信息量/效果」。两者的<b>原图分辨率、视觉编码器、合并结构、训练数据与目标</b>都不同——例如 LLaVA-1.5 的 576 来自 336² 固定输入,Qwen2.5-VL 的 576 来自 672² 原生+合并。<b>序列长度相等,承载的信息未必相等</b>。"},
  html:`
  <h3>先建立正确预期</h3>
  <div class="note"><b>关于"纯前端跑真实推理"</b>:本站是无依赖静态页,<b>不内置推理运行时</b>,所以互动组件用的是<b>可复现的原理级可视化 + 预设/实测数值</b>,不是现场大模型输出。(原则上 WebGPU/WASM 可跑小模型;现场大模型 demo 建议另配 GPU 服务,并保留可复现的离线记录。)真要跑真实模型,就按下面四级实验在有环境的机器上做。</div>
  <h3>四级实验(从 CPU 到评测,逐级加码)</h3>
  <table><tr><th>层次</th><th>做什么</th><th>通过标准</th></tr>
  <tr><td><b>A · CPU 接口实验</b><br>(无需 GPU)</td><td>用真实 HuggingFace <b>processor</b> 处理同一张图,打印输入张量与视觉占位 token 数</td><td>记录版本、原尺寸、grid、pixel shape、视觉 token 数;断言与预期一致</td></tr>
  <tr><td><b>B · GPU 推理</b></td><td>同图同问题、greedy 解码,分别跑 LLaVA 与 Qwen</td><td>保存模型原始答案、checkpoint/revision、环境、采样设置、时延与显存;观察差异,<b>不预设谁必胜</b></td></tr>
  <tr><td><b>C · 评测</b></td><td>VLMEvalKit 选定 <b>POPE</b> 变体与 split,先固定小样本</td><td>固定工具 commit、模型 id、样本 id/种子、prompt;输出预测表 + TP/FP/TN/FN + P/R/F1/acc/yes-ratio。小样本<b>不声称全集成绩</b></td></tr>
  <tr><td><b>D · 人工误差分析</b></td><td>翻 30 条有 id 的输出</td><td>区分视觉漏识别 / 语言先验 / 答案提取错误 / 标签争议;给 3 条<b>有图有证据</b>的失败案例</td></tr></table>
  <h3>A 级:CPU 就能验证(本课实测基线)</h3>
  <p>DayOne 用真实 processor 在 CPU 上实测(torch 2.11.0 / transformers 5.12.1 / Pillow 11.3.0,<b>仅 processor,未跑 GPU 生成</b>),结果:</p>

/* --- Resolution <-> tokens (教学估算 + 真实记录) --- */
function buildRes(){
  const host=document.getElementById('resW');if(!host)return;
  host.innerHTML=`<div class="widget"><div class="wh">🔍 分辨率 ↔ 视觉 token ↔ LLM 自注意力长度</div>
   <div class="wsub">教学估算(patch=14);拖动分辨率,看 token 数与「LLM 全局自注意力的长度项」如何变化</div>
   <div class="ctrl"><label>分辨率</label><input type="range" id="rr" min="224" max="1568" step="112" value="336" aria-label="分辨率"><span class="pill" id="rrv">336²</span></div>
   <div class="ctrl"><label>2×2 合并压缩</label><span class="seg" id="rmg"><button data-v="0" class="on">关</button><button data-v="1">开</button></span>
     <label style="min-width:60px">模式</label><span class="seg" id="rmode"><button data-v="native" class="on">原生</button><button data-v="anyres">AnyRes切图</button></span></div>
   <div class="ctrl"><label>文本 token</label><input type="range" id="rtx" min="0" max="2000" step="50" value="300" aria-label="文本token数"><span class="pill" id="rtxv">300</span></div>
   <div class="stat">
     <div><b id="rp">—</b><span>patch 数</span></div>
     <div><b id="rt">—</b><span>视觉 token</span></div>
     <div><b id="rc">—</b><span>仅视觉自注意力(相对)</span></div>
     <div><b id="rcs">—</b><span>总序列自注意力(相对)</span></div>
   </div>
   <div class="wsub" id="rnote" style="margin-top:10px"></div>
   <div class="note" style="margin-top:12px"><b>真实 processor 记录</b>(CPU 实测,仅 processor;torch2.11/transformers5.12.1):
     <ul style="margin:6px 0 0">
       <li><b>LLaVA-1.5</b>:输入 336² 与 672² 都先缩放到 336² → 均 <b>576</b> 视觉 token。</li>
       <li><b>Qwen2.5-VL-3B</b>:336² → 24×24=576 patch → 2×2 合并 → <b>144</b>;672² → 48×48=2304 → 合并 → <b>576</b>。</li>
     </ul>
     教学估算只给直觉;真实 processor 受 <code>min/max_pixels</code> 与 28 倍数对齐约束,不强制正方形,不同模型处理流程不同。</div>
   </div>`;
  let merge=0, mode='native';
  function draw(){
    const res=+host.querySelector('#rr').value;
    host.querySelector('#rrv').textContent=res+'²';
    const txt=+host.querySelector('#rtx').value;
    host.querySelector('#rtxv').textContent=txt;
    const perSide=Math.round(res/14);
    let patch=perSide*perSide;
    let tiles=1, note='';
    if(mode==='anyres'){ tiles=Math.max(1,Math.ceil(res/336)**2); patch=(tiles+1)*(24*24); note=`AnyRes:切成 ${tiles} 块 × 576 + 1 张全局缩略图(576)= ${patch.toLocaleString()} patch,token 随块数线性涨、块间缺全局关系。`; }
    else { note=`原生动态分辨率:直接按 ${perSide}×${perSide} 个 patch 处理,保长宽比。`; }
    let tok=patch; if(merge){tok=Math.round(patch/4); note+=' 2×2 合并(发生在喂入 LLM 之前)后 token 降 4 倍(省算力,略丢细节)。';}
    const costV=(tok*tok/(576*576));           // 仅视觉长度² 相对 LLaVA-1.5(576)
    const total=tok+txt, base=576+txt;
    const costS=(total*total/(base*base));      // 总序列(视觉+文本)² 相对
    host.querySelector('#rp').textContent=patch.toLocaleString();
    host.querySelector('#rt').textContent=tok.toLocaleString();
    host.querySelector('#rc').textContent=(costV>=100?Math.round(costV):costV.toFixed(1))+'×';
    host.querySelector('#rcs').textContent=(costS>=100?Math.round(costS):costS.toFixed(1))+'×';
    host.querySelector('#rnote').innerHTML=note+' <b>口径</b>:这里的「相对」= LLM 端<b>全局自注意力的长度平方项</b>(∝ 序列长度²),相对 LLaVA-1.5 的 576。它<b>不是 ViT 的算力测量</b>,也<b>不等于实际耗时/显存倍数</b>(prefill 与逐 token 的 KV-cache decode 性质不同;FlashAttention 省显存但不消除二次计算;Qwen 的 window attention 又是局部算法)。';
  }
  host.querySelector('#rr').oninput=draw;
  host.querySelector('#rtx').oninput=draw;
  host.querySelectorAll('#rmg button').forEach(b=>b.onclick=()=>{host.querySelectorAll('#rmg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');merge=+b.dataset.v;draw();});
  host.querySelectorAll('#rmode button').forEach(b=>b.onclick=()=>{host.querySelectorAll('#rmode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.v;draw();});
  window._res=draw; draw();
}

/* --- RoPE / M-RoPE --- */
function buildRope(){
  const host=document.getElementById('ropeW');if(!host)return;
  host.innerHTML=`<div class="widget"><div class="wh">🧭 RoPE / M-RoPE 旋转位置编码</div>
   <div class="wsub">RoPE 把位置编成「旋转」。两个 token 的注意力点积只依赖它们的<b>相对位移</b>——下面可亲手验证。</div>
   <div class="ctrl"><label>模式</label><span class="seg" id="romode"><button data-v="rope" class="on">相对位置点积(文本 RoPE)</button><button data-v="mrope">M-RoPE 坐标(t,h,w)</button></span></div>
   <div id="ropeCtrls"></div>
   <canvas id="ropec" width="640" height="240"></canvas>
   <div class="wsub" id="ronote" style="margin-top:10px"></div></div>`;
  const cv=host.querySelector('#ropec'),ctx=cv.getContext('2d');
  const ctrls=host.querySelector('#ropeCtrls');
  let mode='rope', mk='image';
  const TH=0.4; // 单频(单位向量)便于看清 cos((n-m)θ)
  function dial(cx,cy,r,ang,col,lab){
    ctx.strokeStyle=cssv('--line');ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(ang),cy-r*Math.sin(ang));ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx+r*Math.cos(ang),cy-r*Math.sin(ang),4,0,7);ctx.fill();
    ctx.fillStyle=cssv('--mut');ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(lab,cx,cy+r+18);
  }
  function renderCtrls(){
    if(mode==='rope'){
      ctrls.innerHTML=`<div class="ctrl"><label>query 位置 m</label><input type="range" id="rom" min="0" max="24" step="1" value="6"><span class="pill" id="romv">6</span></div>
       <div class="ctrl"><label>key 位置 n</label><input type="range" id="ron" min="0" max="24" step="1" value="10"><span class="pill" id="ronv">10</span></div>`;
      ctrls.querySelector('#rom').oninput=draw;ctrls.querySelector('#ron').oninput=draw;
    } else {
      ctrls.innerHTML=`<div class="ctrl"><label>内容类型</label><span class="seg" id="mkind"><button data-v="text">文本</button><button data-v="image" class="on">单图</button><button data-v="video">视频</button></span></div>
       <div class="ctrl"><label>位置</label><input type="range" id="rom" min="0" max="8" step="1" value="2"><span class="pill" id="romv">2</span></div>`;
      ctrls.querySelector('#rom').oninput=draw;
      ctrls.querySelectorAll('#mkind button').forEach(b=>b.onclick=()=>{ctrls.querySelectorAll('#mkind button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mk=b.dataset.v;draw();});
    }
  }
  function drawRope(){
    const m=+ctrls.querySelector('#rom').value, n=+ctrls.querySelector('#ron').value;
    ctrls.querySelector('#romv').textContent=m;ctrls.querySelector('#ronv').textContent=n;
    ctx.clearRect(0,0,cv.width,cv.height);
    const d=n-m, dot=Math.cos(d*TH);
    // left: two dials
    dial(90,80,42,m*TH,cssv('--acc'),`R(mθ)q  m=${m}`);
    dial(90,80,42,m*TH,cssv('--acc'),'');
    dial(210,80,42,n*TH,cssv('--acc2'),`R(nθ)k  n=${n}`);
    // right: cos((Δ)θ) curve over Δ
    const x0=330,x1=620,y0=30,y1=150,cy=(y0+y1)/2;
    ctx.strokeStyle=cssv('--line');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x1,cy);ctx.stroke();
    ctx.strokeStyle=cssv('--grn');ctx.lineWidth=2;ctx.beginPath();
    for(let dd=-24;dd<=24;dd++){const px=x0+((dd+24)/48)*(x1-x0);const py=cy-Math.cos(dd*TH)*((y1-y0)/2-4);if(dd===-24)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.stroke();
    const px=x0+((d+24)/48)*(x1-x0),py=cy-dot*((y1-y0)/2-4);
    ctx.fillStyle=cssv('--red');ctx.beginPath();ctx.arc(px,py,5,0,7);ctx.fill();
    ctx.fillStyle=cssv('--mut');ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('点积 q·k = cos(Δθ)  随相对位移 Δ=n−m',(x0+x1)/2,y1+22);
    host.querySelector('#ronote').innerHTML=`当前 m=${m}, n=${n} → <b>相对位移 Δ=n−m=${d}</b>,单频点积 <b>cos(Δθ)=${dot.toFixed(3)}</b>。<br>
      把 m、n <b>同时 +k</b>,Δ 不变 → 点积不变,这就是 RoPE 的<b>相对位置</b>性质:注意力只看 token 间距离。<br>
      <b>别叫它「衰减曲线」</b>:单频时点积是<b>振荡</b>的(上图是 cos);多频叠加也不保证单调或必然近似衰减,结果取决于频率、q/k 内容与学习到的权重。圆盘是某一对维度的抽象可视化。`;
  }
  function grid(x0,y0,cell,rows,colsN,sel,colorFn,labFn){
    for(let r=0;r<rows;r++)for(let c=0;c<colsN;c++){
      ctx.fillStyle=colorFn(r,c);ctx.fillRect(x0+c*cell,y0+r*cell,cell-2,cell-2);
      if(sel&&sel.r===r&&sel.c===c){ctx.strokeStyle=cssv('--red');ctx.lineWidth=3;ctx.strokeRect(x0+c*cell,y0+r*cell,cell-2,cell-2);}
    }
  }
  function drawMrope(){
    const p=+ctrls.querySelector('#rom').value;ctrls.querySelector('#romv').textContent=p;
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.font='13px sans-serif';ctx.textAlign='left';
    let note='';
    if(mk==='text'){
      // 文本:一行 token,(t,h,w) 三者都=位置
      const n=9,cell=48,x0=40,y0=70;
      for(let i=0;i<n;i++){ctx.fillStyle=i===p?cssv('--acc'):cssv('--panel2');ctx.fillRect(x0+i*cell,y0,cell-4,cell-4);
        ctx.fillStyle=cssv('--mut');ctx.textAlign='center';ctx.fillText(i,x0+i*cell+(cell-4)/2,y0+cell+12);}
      ctx.fillStyle=cssv('--ink');ctx.textAlign='left';ctx.fillText(`文本 token #${p} → (t,h,w) = (${p}, ${p}, ${p})  三分量相同`,40,40);
      note=`<b>文本</b>:M-RoPE 退化成普通 RoPE——三个分量 (t,h,w) 取同一个序号。拖动位置,三者一起变。`;
    } else if(mk==='image'){
      const rows=4,cols=4,cell=40,x0=60,y0=60;const r=Math.floor(p/cols)%rows,c=p%cols;
      grid(x0,y0,cell,rows,cols,{r,c},(rr,cc)=>(rr===r&&cc===c)?cssv('--acc'):cssv('--panel2'));
      ctx.fillStyle=cssv('--ink');ctx.fillText(`单图 patch (h=${r}, w=${c}) → (t,h,w) = (0, ${r}, ${c})`,x0,40);
      ctx.fillStyle=cssv('--mut');ctx.fillText('横移只改 w,竖移只改 h,t 固定=0',x0,y0+rows*cell+24);
      note=`<b>单图</b>:时间分量 <b>t 固定=0</b>;每个 patch 用它的 2D 网格坐标 (h,w)。<b>水平移动只改变 w、垂直移动只改变 h</b>——这正是 M-RoPE 表达二维位置的方式。`;
    } else {
      const frames=3,cols=3,cell=38,gap=24,y0=70;const fr=Math.floor(p/cols)%frames;
      for(let f=0;f<frames;f++){const x0=40+f*(cols*cell+gap);
        grid(x0,y0,cell,1,cols,{r:0,c:(f===fr?p%cols:-1)},(rr,cc)=>(f===fr&&cc===p%cols)?cssv('--acc'):cssv('--panel2'));
        ctx.fillStyle=cssv('--mut');ctx.textAlign='center';ctx.fillText('t='+f,x0+cols*cell/2,y0-10);}
      ctx.fillStyle=cssv('--ink');ctx.textAlign='left';ctx.fillText(`视频:第 ${fr} 帧、同一行的 w=${p%cols} → (t,h,w) = (${fr}, 0, ${p%cols})`,40,40);
      note=`<b>视频</b>:同一空间位置 (h,w) <b>跨帧时 t 逐帧递增</b>。Qwen2.5-VL 还让 t 对齐<b>绝对时间</b>(秒),不是单纯帧号,利于定位"第几秒发生了什么"。`;
    }
    host.querySelector('#ronote').innerHTML=note+`<br>可检查性:三态下,只有对应维度随位置变化,其余维度保持约定值。`;
  }
  function draw(){ if(mode==='rope')drawRope(); else drawMrope(); }
  host.querySelectorAll('#romode button').forEach(b=>b.onclick=()=>{host.querySelectorAll('#romode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.v;renderCtrls();draw();});
  renderCtrls();window._rope=draw;draw();
}

/* --- VQ quantization (RGB nearest-neighbor ANALOGY; nested codebook for non-increasing error) --- */
function buildVQ(){
  const host=document.getElementById('vqW');if(!host)return;
  host.innerHTML=`<div class="widget"><div class="wh">🎨 量化丢了什么(RGB 最近邻类比)</div>
   <div class="wsub">用有限「调色板」把图像颜色量化成离散 id。这是<b>教学类比</b>,不是真实 VQ(真实 VQ 在潜空间 + 学习码本 + 解码器重建)。</div>
   <div class="ctrl"><label>码本大小 K</label><input type="range" id="vqk" min="2" max="64" step="1" value="8" aria-label="码本大小"><span class="pill" id="vqkv">8 色</span></div>
   <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
     <div><canvas id="vqa" width="220" height="220"></canvas><div class="wsub" style="text-align:center">原图 · 原始 RGB</div></div>
     <div><canvas id="vqb" width="220" height="220"></canvas><div class="wsub" style="text-align:center" id="vqinfo">调色板重建 · K 色</div></div>
   </div>
   <div class="wsub" id="vqnote" style="margin-top:8px"></div></div>`;
  const a=host.querySelector('#vqa'),b=host.querySelector('#vqb');
  const ca=a.getContext('2d'),cb=b.getContext('2d');
  function pix(x,y){
    if(Math.hypot(x-150,y-60)<32) return [255,205,60];       // sun
    if(y>150) return [60,110+(y-150)*0.4,60];                // ground
    return [100+y*0.5,160+y*0.4,235-y*0.4];                  // sky gradient
  }
  function drawA(){
    const img=ca.createImageData(220,220);
    for(let y=0;y<220;y++)for(let x=0;x<220;x++){
      const p=pix(x,y),o=(y*220+x)*4;
      img.data[o]=p[0];img.data[o+1]=p[1];img.data[o+2]=p[2];img.data[o+3]=255;
    }
    ca.putImageData(img,0,0);
  }
  // Fixed ordered 64-color palette; take first K -> NESTED codebook so error is non-increasing in K
  const FULL=(()=>{const c=[];for(let i=0;i<64;i++){const t=i/63;c.push([100+t*155,160-t*50,235-t*175]);}
    c[0]=[255,205,60];c[1]=[60,140,60];return c;})();
  function nearest(p,c){let bi=0,bd=1e9;for(let i=0;i<c.length;i++){const d=(p[0]-c[i][0])**2+(p[1]-c[i][1])**2+(p[2]-c[i][2])**2;if(d<bd){bd=d;bi=i;}}return c[bi];}
  function drawB(){
    const k=+host.querySelector('#vqk').value;
    host.querySelector('#vqkv').textContent=k+' 色';
    const c=FULL.slice(0,k);
    const img=cb.createImageData(220,220);
    let err=0;
    for(let y=0;y<220;y++)for(let x=0;x<220;x++){
      const p=pix(x,y),q=nearest(p,c),o=(y*220+x)*4;
      img.data[o]=q[0];img.data[o+1]=q[1];img.data[o+2]=q[2];img.data[o+3]=255;
      err+=Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])+Math.abs(p[2]-q[2]);
    }
    cb.putImageData(img,0,0);
    const avg=(err/(220*220*3)).toFixed(1);
    host.querySelector('#vqinfo').textContent=`调色板重建 · ${k} 色 · RGB 平均绝对误差 ${avg}`;
    host.querySelector('#vqnote').innerHTML=`码本只有 <b>${k}</b> 个颜色,每个像素被映射到最近的码本色 → 平滑渐变变成色块(可见"带状"失真)。这里用<b>嵌套码本</b>(取前 K 个),所以误差随 K <b>不增</b>;但一般独立码本<b>不保证单调下降</b>,误差也会因码本覆盖差而出现平台。<br>
      <b>读数边界</b>:显示的是 <b>RGB 平均绝对误差</b>,不是训练时的 VQ/commitment loss;码本大小 K 主要决定每个 id 的<b>容量 log₂K</b>,而视觉 <b>token 数量</b>主要由空间下采样率决定——两者是两件事。量化会丢信息是离散路线的<b>潜在限制之一</b>,但不能据此断言所有离散模型都弱。`;
  }
  host.querySelector('#vqk').oninput=drawB;
  window._vq=()=>{drawA();drawB();};
  window._vq();
}

/* --- Lab checklist (clickable, persisted) --- */
function buildChecklist(){
  const host=document.getElementById('checklist');if(!host)return;
  let saved={};try{saved=JSON.parse(LS.get('mmc_check')||'{}')||{};}catch(e){saved={};}
  const wrap=document.createElement('div');wrap.className='widget';
  CHECKLIST.forEach((t,i)=>{
    const row=document.createElement('label');row.style.cssText='display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:7px 0;font-size:14.5px';
    const cb=document.createElement('input');cb.type='checkbox';cb.style.marginTop='5px';cb.checked=!!saved['c'+i];
    cb.onchange=()=>{saved['c'+i]=cb.checked;LS.set('mmc_check',JSON.stringify(saved));};
    const span=document.createElement('span');span.textContent=t;
    row.appendChild(cb);row.appendChild(span);wrap.appendChild(row);
  });
  host.innerHTML='';host.appendChild(wrap);
}

/* --- Lab file downloads (embedded blobs → work online & offline) --- */
function fileText(id){const el=document.getElementById(id);return el?el.textContent:'';}
function dlFile(name,mime){const t=fileText('file-'+name);if(!t){alert('该文件未内嵌,请从仓库 course/ 目录获取');return;}
  const blob=new Blob([t],{type:mime});const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);}
function buildLabDownloads(){
  const host=document.getElementById('labdl');if(!host)return;
  const files=[['lab_shapes.py','text/x-python','📜 lab_shapes.py'],
    ['requirements-observed.txt','text/plain','📦 依赖版本'],
    ['qwen-processor-shapes.json','application/json','🔢 Qwen 实测 JSON'],
    ['llava-processor-shapes.json','application/json','🔢 LLaVA 实测 JSON']];
  host.innerHTML='<div class="wsub" style="margin-bottom:6px">下载实验文件(在线/离线都可用):</div>';
  const row=document.createElement('div');row.className='ctrl';row.style.gap='8px';
  files.forEach(f=>{const b=document.createElement('button');b.className='tbtn';b.textContent=f[2];
    b.onclick=()=>dlFile(f[0],f[1]);row.appendChild(b);});
  host.appendChild(row);
}
