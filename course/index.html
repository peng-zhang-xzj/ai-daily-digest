/* ============ COURSE CONTENT ============ */
const LECTURES = [
{id:"l0", grp:"开篇", kick:"Lecture 0", title:"为什么要让模型「看见」", lead:"核心矛盾、一条贯穿全课的问题、以及这门课的地图。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议授课20–25分钟(精讲路线15分钟)。前置知识:知道「模型是一个把输入数字映射成输出数字的函数」「向量是一组数字」即可,不要求读过任何论文。<br>学完应能:用一句话说清本课要解决的核心矛盾;指出「把一张图接进 LLM」必须解决的三个接口问题;画出贯穿全课的「编码器→连接器→语言模型」数据流;并按两条授课路线(约 8–9 小时完整版 / 90 分钟精讲版)安排学习。</div>\n  <h3>1. 核心矛盾:像素和文字根本不在一个世界</h3>\n  <p>人看一张图,几乎瞬间能说出「一只狗在草地上追红色飞盘」。因为在我们脑子里,视觉和语言是打通的。但对机器来说,两种信息的「物理形态」天差地别:</p>\n  <ul><li><b>图像是稠密数值网格</b>:一张 336×336 的图,是 336×336×3 个 0–255 的整数(RGB 三通道)。注意:像素值本身是对连续光场的<b>离散采样</b>(每个分量是 0–255 的整数),所以别说「像素是数学上连续的」;它的特点是<b>稠密、高维、带二维空间位置</b>——一张图就是十几万个数,相邻像素高度冗余。</li><li><b>文字是稀疏离散符号</b>:一句话被切成有限词表里的若干 token,每个 token 是词表中的一个整数 id,本质是<b>离散、一维顺序、每个 token 信息量高</b>的。</li></ul>\n  <p>两者的落差不在「连续 vs 离散」(两边最终都是数字),而在<b>稠密高维二维冗余信号</b>与<b>稀疏一维高信息离散符号</b>之间。一个只会读文字的大语言模型(LLM),输入端只认识「一串词向量」;你不能直接把像素网格塞给它——维度不对、语义空间不对、它也不知道这堆数字是「图」。</p>\n  <figure class=\"fig\"><svg viewBox=\"0 0 720 230\" role=\"img\" aria-label=\"像素网格与token序列的对比\">\n  <text x=\"130\" y=\"24\" class=\"figtx-b\" text-anchor=\"middle\">图像 · 稠密二维像素网格</text>\n  <rect class=\"figfill-sky\" x=\"50\" y=\"40\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"70\" y=\"40\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"90\" y=\"40\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"110\" y=\"40\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"130\" y=\"40\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"150\" y=\"40\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"170\" y=\"40\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"190\" y=\"40\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"50\" y=\"60\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"70\" y=\"60\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"90\" y=\"60\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"110\" y=\"60\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"130\" y=\"60\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"150\" y=\"60\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"170\" y=\"60\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"190\" y=\"60\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"50\" y=\"80\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"70\" y=\"80\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"90\" y=\"80\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"110\" y=\"80\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"130\" y=\"80\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"150\" y=\"80\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"170\" y=\"80\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"190\" y=\"80\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"50\" y=\"100\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"70\" y=\"100\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"90\" y=\"100\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"110\" y=\"100\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"130\" y=\"100\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"150\" y=\"100\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"170\" y=\"100\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"190\" y=\"100\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"50\" y=\"120\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"70\" y=\"120\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"90\" y=\"120\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"110\" y=\"120\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"130\" y=\"120\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"150\" y=\"120\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"170\" y=\"120\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"190\" y=\"120\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"50\" y=\"140\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"70\" y=\"140\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"90\" y=\"140\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"110\" y=\"140\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"130\" y=\"140\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"150\" y=\"140\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"170\" y=\"140\" width=\"19\" height=\"19\"/><rect class=\"figfill-grn\" x=\"190\" y=\"140\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"50\" y=\"160\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"70\" y=\"160\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"90\" y=\"160\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"110\" y=\"160\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"130\" y=\"160\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"150\" y=\"160\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"170\" y=\"160\" width=\"19\" height=\"19\"/><rect class=\"figfill-sky\" x=\"190\" y=\"160\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"50\" y=\"180\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"70\" y=\"180\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"90\" y=\"180\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"110\" y=\"180\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"130\" y=\"180\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"150\" y=\"180\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"170\" y=\"180\" width=\"19\" height=\"19\"/><rect class=\"figfill-acc2\" x=\"190\" y=\"180\" width=\"19\" height=\"19\"/>\n  <text x=\"130\" y=\"206\" class=\"figtx-mut\" text-anchor=\"middle\">336×336×3 个 0–255 整数 · 相邻冗余</text>\n  <text x=\"360\" y=\"120\" class=\"figtx-mut\" text-anchor=\"middle\">≠</text>\n  <path class=\"figln\" d=\"M250 115 H470\"/><polygon class=\"figfill-mut\" points=\"470,110 482,115 470,120\"/>\n  <text x=\"596\" y=\"24\" class=\"figtx-b\" text-anchor=\"middle\">文字 · 稀疏一维离散符号</text>\n  <rect class=\"figbox-acc\" x=\"500\" y=\"70\" width=\"40\" height=\"34\" rx=\"7\"/><text x=\"520\" y=\"92\" class=\"figtx-acc\" text-anchor=\"middle\">一只</text><rect class=\"figbox-acc\" x=\"544\" y=\"70\" width=\"40\" height=\"34\" rx=\"7\"/><text x=\"564\" y=\"92\" class=\"figtx-acc\" text-anchor=\"middle\">狗</text><rect class=\"figbox-acc\" x=\"588\" y=\"70\" width=\"40\" height=\"34\" rx=\"7\"/><text x=\"608\" y=\"92\" class=\"figtx-acc\" text-anchor=\"middle\">在</text><rect class=\"figbox-acc\" x=\"632\" y=\"70\" width=\"40\" height=\"34\" rx=\"7\"/><text x=\"652\" y=\"92\" class=\"figtx-acc\" text-anchor=\"middle\">草地</text><rect class=\"figbox-acc\" x=\"676\" y=\"70\" width=\"40\" height=\"34\" rx=\"7\"/><text x=\"696\" y=\"92\" class=\"figtx-acc\" text-anchor=\"middle\">上</text>\n  <text x=\"596\" y=\"140\" class=\"figtx-mut\" text-anchor=\"middle\">词表里的离散 id · 每个信息量高</text>\n  </svg><figcaption>核心矛盾:图像是稠密二维像素网格,文字是稀疏一维离散符号,天生不在一个空间</figcaption></figure>\n  <div class=\"key\"><b>本课的一句话</b>:多模态大模型(Vision-Language Model, VLM)这十年的全部故事,本质就是——想方设法把「像素」翻译成 LLM 能接着处理的「类词向量」,让一个会读文字的大模型顺便「看得见」。</div>\n  <h3>2. 把问题拆开:接一张图进 LLM,必须解决三个接口问题</h3>\n  <p>很多人以为「让模型看见」就是「给图像也起个 token 名字」,这是最大的误解。真正要解决的是三件独立的事,缺一不可:</p>\n  <h4>问题一:信息提取——从像素里拿到「有用的东西」</h4>\n  <p>原始像素绝大部分是冗余的(相邻像素几乎一样)。直接喂原始像素,模型既算不动,也抓不住重点。需要一个<b>视觉编码器</b>先把图压成一组「有语义的特征」:哪里是边缘、哪里是物体、是什么物体。这是 L1 的 CNN、L2 的 CLIP、L6 的 ViT 在做的事。</p>\n  <h4>问题二:维度与语义对齐——让视觉特征「说 LLM 的语言」</h4>\n  <p>就算拿到了视觉特征,它的<b>维度</b>通常和 LLM 的词向量不一样,它所在的<b>语义空间</b>也和 LLM 的词向量空间不是同一个(哪怕是 CLIP,它也只是和「它自己的文本编码器」对齐,不等于和某个 LLM 对齐)。所以中间要一个<b>连接器</b>做两件事:把维度对上,把语义「翻译」进 LLM 认识的空间。这是 L3 的 Q-Former、L4 的 MLP、L6 的 Resampler。</p>\n  <h4>问题三:序列组织与位置——把图和字排成「一条带位置的序列」</h4>\n  <p>LLM 处理的是「一条序列」,且它靠<b>位置编码</b>知道谁先谁后。图是二维的、视频还多一维时间,怎么把它们和文字 token 拼成一条序列、又让模型知道每个视觉 token 在图里的二维位置?这是 L6 的 M-RoPE、L7「图像到底算不算 token」要回答的。</p>\n  <p>记住这三问,你会发现后面每一讲都在更深地回答其中某一个。</p>\n  <h3>3. 一张「心智地图」:编码器 → 连接器 → 语言模型</h3>\n  <p>把三个接口问题串起来,就是贯穿全课的数据流。<b>请把这张图记在脑子里</b>,后面六大技术维度都挂在它上面:</p>\n  <figure class=\"fig\"><svg viewBox=\"0 0 760 300\" role=\"img\" aria-label=\"编码器到连接器到语言模型的数据流\">\n  <g>\n    <rect class=\"figbox\" x=\"20\" y=\"40\" width=\"80\" height=\"40\" rx=\"8\"/><text x=\"60\" y=\"65\" class=\"figtx\" text-anchor=\"middle\">图像</text>\n    <rect class=\"figbox-acc\" x=\"130\" y=\"34\" width=\"120\" height=\"52\" rx=\"8\"/><text x=\"190\" y=\"56\" class=\"figtx-acc\" text-anchor=\"middle\">视觉编码器</text><text x=\"190\" y=\"72\" class=\"figtx-mut\" text-anchor=\"middle\">ViT</text>\n    <rect class=\"figbox-acc\" x=\"290\" y=\"34\" width=\"110\" height=\"52\" rx=\"8\"/><text x=\"345\" y=\"56\" class=\"figtx-acc\" text-anchor=\"middle\">连接器</text><text x=\"345\" y=\"72\" class=\"figtx-mut\" text-anchor=\"middle\">投影/Resampler</text>\n    <path class=\"figln\" d=\"M100 60 H128\"/><polygon class=\"figfill-mut\" points=\"128,55 140,60 128,65\"/>\n    <path class=\"figln\" d=\"M250 60 H288\"/><polygon class=\"figfill-mut\" points=\"288,55 300,60 288,65\"/>\n    <text x=\"190\" y=\"24\" class=\"figtx-mut\" text-anchor=\"middle\">①信息提取</text>\n    <text x=\"345\" y=\"24\" class=\"figtx-mut\" text-anchor=\"middle\">②对齐</text>\n  </g>\n  <g>\n    <rect class=\"figbox\" x=\"20\" y=\"150\" width=\"80\" height=\"40\" rx=\"8\"/><text x=\"60\" y=\"175\" class=\"figtx\" text-anchor=\"middle\">文本</text>\n    <rect class=\"figbox\" x=\"130\" y=\"150\" width=\"120\" height=\"40\" rx=\"8\"/><text x=\"190\" y=\"175\" class=\"figtx\" text-anchor=\"middle\">分词器</text>\n    <path class=\"figln\" d=\"M100 170 H128\"/><polygon class=\"figfill-mut\" points=\"128,165 140,170 128,175\"/>\n  </g>\n  <rect class=\"figfill-acc\" x=\"430\" y=\"40\" width=\"26\" height=\"46\" rx=\"4\" opacity=\"0.85\"/>\n  <rect class=\"figfill-acc\" x=\"430\" y=\"150\" width=\"26\" height=\"40\" rx=\"4\" opacity=\"0.4\"/>\n  <text x=\"500\" y=\"70\" class=\"figtx-mut\" text-anchor=\"middle\">视觉 tokens</text>\n  <text x=\"500\" y=\"175\" class=\"figtx-mut\" text-anchor=\"middle\">文本 tokens</text>\n  <path class=\"figln\" d=\"M400 60 H430\"/><path class=\"figln\" d=\"M250 170 H430\"/>\n  <rect class=\"figbox-acc\" x=\"560\" y=\"90\" width=\"120\" height=\"52\" rx=\"8\"/><text x=\"620\" y=\"116\" class=\"figtx-acc\" text-anchor=\"middle\">大语言模型</text><text x=\"620\" y=\"132\" class=\"figtx-mut\" text-anchor=\"middle\">LLM</text>\n  <path class=\"figln\" d=\"M456 63 C520 63 520 110 558 112\"/>\n  <path class=\"figln\" d=\"M456 170 C520 170 520 125 558 120\"/>\n  <polygon class=\"figfill-mut\" points=\"558,107 570,114 557,119\"/>\n  <text x=\"508\" y=\"236\" class=\"figtx-mut\" text-anchor=\"middle\">③组织成一条带位置的序列</text>\n  <rect class=\"figbox\" x=\"560\" y=\"200\" width=\"120\" height=\"40\" rx=\"8\"/><text x=\"620\" y=\"225\" class=\"figtx\" text-anchor=\"middle\">文字答案</text>\n  <path class=\"figln\" d=\"M620 142 V198\"/><polygon class=\"figfill-mut\" points=\"615,198 620,210 625,198\"/>\n  </svg><figcaption>贯穿全课的数据流:视觉编码器(问题①信息提取)→连接器(问题②对齐)→组织成序列(问题③位置)→LLM</figcaption></figure>\n  <p><b>三句话读懂它</b>:① 图先被编码器变成一组视觉特征;② 连接器把这些特征翻译、对齐成 LLM 认识的「类词向量」;③ 它们和文本 token 拼成一条序列喂给 LLM,LLM 像往常一样逐词生成答案。你会在 L4(LLaVA)第一次看到这三步被最简单地实现出来。</p>\n  <div class=\"key\"><b>一个重要提醒</b>:这条「编码器→连接器→LLM」是<b>本课主线</b>,也是当前多数<b>理解类</b> VLM 的骨架,但它<b>不是唯一架构</b>。有的模型把图像也离散成 token、和文字塞进同一个词表、用同一套自回归(L7 的 Chameleon/Emu3);有的从头做原生多模态联合训练。主线是帮你拆解新模型的脚手架,不是一条铁律——遇到不走这条路的模型,正好用它当对照。</div>\n  <h3>4. 这门课怎么走:三幕 + 六个技术维度</h3>\n  <p>我们不按工程模块平铺,而是沿时间线讲一个演化故事,分三幕;每一幕其实都在把上面那张图的某个零件做强。</p>\n  <table><tr><th>幕</th><th>讲次</th><th>在解决什么</th></tr><tr><td>前世(视觉语言地基与桥接)</td><td>L1 看图说话 / L2 CLIP / L3 BLIP-2·Flamingo</td><td>打地基:视觉编码器 + 连接器的雏形(L3 的 Flamingo/BLIP-2 已用冻结 LLM,但尚未进入视觉指令范式)</td></tr><tr><td>今生(视觉指令与通用 VLM)</td><td>L4 LLaVA / L5 数据 / L6 结构 / L7 Tokenizer / L8 训练 / L9 评估</td><td>视觉指令微调确立范式后,逐个维度做深</td></tr><tr><td>未来</td><td>L10 前沿与开放问题</td><td>统一生成、任意模态、Agent、安全</td></tr></table>\n  <p>六个技术维度(数据、结构、分辨率/位置、tokenizer、训练、评估)不是并列的知识点,而是「如何把这条数据流做得更强、更省、更可靠」的六个切面。</p>\n  <h3>5. 两条授课路线(按需取用)</h3>\n  <p>本课内容按<b>约 8–9 小时模块课</b>写透(建议分两次上);若时间有限,用下面的<b>90 分钟精讲</b>路线抓主干。</p>\n  <h4>完整模块(建议节奏,讲授合计 450 分钟 + 实验 45–90 分钟 ≈ 8.25–9 小时)</h4>\n  <div class=\"flow\">模块A 地基    L0–L3   120分钟   (核心矛盾、注意力、CLIP、连接器)\n模块B 范式    L4–L5    90分钟   (LLaVA 三件套、数据工程)\n模块C 结构    L6       90分钟   (连接器/分辨率/位置编码,最重,可拆3小段)\n模块D 表示与训练 L7–L8  90分钟   (连续vs离散、三段式训练与幻觉)\n模块E 评估与前沿 L9–L10  60分钟\n                      ────────\n          讲授小计    450分钟(7.5 小时)\n实验课        Lab     45–90分钟 (CPU接口实验必做,GPU推理选做)\n                      ────────\n          合计    约 495–540分钟 ≈ 8.25–9 小时(建议分两次,首次权重下载不计入)</div>\n  <h4>90 分钟精讲路线(抓主干)</h4>\n  <div class=\"flow\">L0 矛盾与地图      10分钟\nL1 注意力(重点)   15分钟\nL2 CLIP            10分钟\nL4 LLaVA 三件套    15分钟\nL6 分辨率+位置     20分钟\nL7 连续vs离散       8分钟\nL8 训练与幻觉       7分钟\n总结+Lab 导引       5分钟\n                  ──────\n合计               90分钟</div>\n  <p>精讲版省略 L3/L5/L9/L10 的细节,但务必保留 L1 的注意力机制和 L6 的分辨率—token 联动,这两处是理解一切的支点。</p>\n  <h3>6. 互动:先建立时间坐标</h3>\n  <p>下面这条时间线是全课的骨架。<b>点一下任意里程碑</b>,看它在历史中的位置——你会在后面每一讲回到它。</p>\n  <div id=\"timeline\"></div>\n  <h3>练习</h3>\n  <details class=\"quiz\"><summary>🧠 用一句话说出本课的核心矛盾。 ——</summary><div class=\"qa\"><b>答:</b>图像是稠密、高维、带二维位置的数值网格(像素是对光场的离散采样),文字是稀疏的一维离散符号序列;要想办法把图像翻译成 LLM 能处理的「类词向量」,让语言模型「看得见」。</div></details>\n  <details class=\"quiz\"><summary>🧠 「让模型看见」就是「给图像也起个 token 名字」——这句话错在哪? ——</summary><div class=\"qa\"><b>答:</b>起名字只是表面。真正要解决三件事:从像素提取有语义的特征、把特征维度与语义对齐到 LLM 空间、再把视觉和文本组织成一条带位置的序列。只命名解决不了对齐和序列组织。</div></details>\n  <details class=\"quiz\"><summary>🧠 连接器(问题二)到底在对齐什么,仅靠 CLIP 够不够? ——</summary><div class=\"qa\"><b>答:</b>对齐「维度」和「语义空间」。CLIP 只把图像和它自己的文本编码器对齐,维度和训练分布都未必匹配目标 LLM,所以仍需连接器再翻译一次(详见 L2、L4)。</div></details>\n  <details class=\"quiz\"><summary>🧠 为什么视频比图像在「问题三」上更难? ——</summary><div class=\"qa\"><b>答:</b>图像是二维(高、宽),视频多一维时间,位置编码要同时表达时/高/宽三种位置并能外推(详见 L6 的 M-RoPE)。</div></details>\n  <details class=\"quiz\"><summary>🧠 90 分钟精讲里,哪两讲绝不能省,为什么? ——</summary><div class=\"qa\"><b>答:</b>L1 注意力(它是后面所有 cross-attention 的雏形)和 L6 分辨率—token—位置(决定文档能力与算力瓶颈)。这两处是理解全课的支点。</div></details>\n  "},
{id:"l1", grp:"前世 · 视觉语言地基与桥接", kick:"Lecture 1", title:"起源:看图说话", lead:"前 Transformer 时代——CNN+RNN、image captioning 与 VQA 的萌芽。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议授课45–55分钟。前置知识只有“图片可以写成数字、向量是一组数字”。本讲会定义所有必要符号，不要求先懂LSTM或Transformer。<br>学完应能：画出图像到句子的完整路径；手算注意力权重与上下文；说明注意力如何参与训练；区别早期视觉注意力、Transformer交叉注意力与自注意力。</div>\n  <h3>1. 先明确任务，而不是先背模型名</h3>\n  <p>输入是一张图，输出是一句话，例如“一只狗坐在草地上”。机器并不是先得到这句话再翻译：它要连续做多次决策，先预测“一”，再预测“只”，再预测“狗”，直到结束符。若词表大小为V，每步输出V个候选词的概率。</p>\n  <p>写成概率链是：</p>\n  <p><code>P(整句 | 图像) = ∏ₜ P(第t个词 | 图像, 前面已经出现的词)</code>。</p>\n  <p>竖线表示“在这些条件已知的情况下”；乘积表示每一步的条件概率连起来。这里的词只是教学单位，实际实现可能用词、子词或字符。训练时，我们用图像及人工描述告诉模型哪些词应当获得高概率；推理时，没有标准答案，模型要把自己生成的词继续喂回去。</p>\n  <h3>2. 2015年前后的起点：CNN看图，LSTM组织句子</h3>\n  <p>CNN即卷积神经网络。它用许多可学习的小滤波器扫过图片：浅层常响应边缘和纹理，深层把局部响应组合成更复杂的视觉特征。一个数字响应不是一个人工定义的“狗”标签；它是模型在训练中学出的表示。</p>\n  <p>最简的看图说话方案把CNN最终特征压成一个向量v，交给语言解码器。Show and Tell的具体做法是把图像嵌入作为LSTM初始时间步的输入，然后依次输入词的嵌入。其他编码器—解码器也可以用v初始化隐藏状态，不能把这些实现细节混为一谈。</p>\n  <p>LSTM是带记忆的循环神经网络。每步读取上一词的向量xₜ，结合上一状态，得到新状态，再预测下一词。它维护两份量：隐藏状态hₜ，供当前预测使用；记忆状态mₜ，帮助信息跨很多步保留。</p>\n  <p>可把一轮更新写成：</p>\n  <div class=\"flow\">i = sigmoid(Wi[xₜ,hₜ₋₁] + bi)    输入门：写入多少新信息\nf = sigmoid(Wf[xₜ,hₜ₋₁] + bf)    遗忘门：保留多少旧记忆\no = sigmoid(Wo[xₜ,hₜ₋₁] + bo)    输出门：暴露多少记忆\ng = tanh(Wg[xₜ,hₜ₋₁] + bg)       候选新信息\nmₜ = f ⊙ mₜ₋₁ + i ⊙ g\nhₜ = o ⊙ tanh(mₜ)</div>\n  <p><code>[x,h]</code>表示拼接；<code>⊙</code>表示对应位置相乘；W和b都是训练出的参数。sigmoid把数压到0–1，像连续开关；tanh把数压到−1–1。无需背这些门的名字：关键是hₜ含有“前面已经说了什么”的信息，却不天然知道下一词应该访问图片的哪个区域。</p>\n  <h3>3. 注意力为什么会登场：不是所有输出词都需要同一份图像信息</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 620\" role=\"img\" aria-labelledby=\"l1-attention-story-title l1-attention-story-desc\" class=\"d1-figure\">\n<title id=\"l1-attention-story-title\">注意力登场：每个词，重新读取图像</title><desc id=\"l1-attention-story-desc\">先看上行的单向量瓶颈，再看下行：图像网格保留位置，语言状态决定本步的读取权重。“狗”和“草地”的框仅为教学示意，不是实测注意力。</desc>\n<defs><marker id=\"l1-attention-story-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"618\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">注意力登场：每个词，重新读取图像</tspan>\n</text>\n<text x=\"32\" y=\"83\" font-size=\"22\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">旧方案：所有词共用同一个图像摘要</tspan>\n</text>\n<rect x=\"40\" y=\"105\" width=\"200\" height=\"110\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"42\" y=\"176.5\" width=\"196\" height=\"36.300000000000004\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"196.0\" cy=\"129.2\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"100.0\" y=\"156.7\" width=\"60.0\" height=\"22.0\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"160.0\" cy=\"154.5\" r=\"15.400000000000002\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M154.0,142.4 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"108.0\" y=\"174.3\" width=\"8\" height=\"17.6\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"146.0\" y=\"174.3\" width=\"8\" height=\"17.6\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M100.0,164.4 L86.0,147.9\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"168.0\" cy=\"151.2\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<path d=\"M250,159 L295,159\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-story-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"308\" y=\"113\" width=\"220\" height=\"90\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"418.0\" y=\"145\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"418.0\" dy=\"0\">单一向量 v</tspan>\n</text>\n<text x=\"418.0\" y=\"176\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"418.0\" dy=\"0\">空间细节被压缩</tspan>\n</text>\n<path d=\"M537,158 L580,158\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-story-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"594\" y=\"113\" width=\"320\" height=\"90\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"754.0\" y=\"145\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"754.0\" dy=\"0\">LSTM 逐词生成</tspan>\n</text>\n<text x=\"754.0\" y=\"176\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"754.0\" dy=\"0\">“狗” / “坐着” / “草地”</tspan>\n</text>\n<text x=\"32\" y=\"264\" font-size=\"22\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"32\" dy=\"0\">注意力方案：保留区域，按当前需求加权读取</tspan>\n</text>\n<rect x=\"40\" y=\"294\" width=\"200\" height=\"120\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"42\" y=\"372.0\" width=\"196\" height=\"39.6\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"196.0\" cy=\"320.4\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"100.0\" y=\"350.4\" width=\"60.0\" height=\"24.0\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"160.0\" cy=\"348.0\" r=\"16.8\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M154.0,334.8 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"108.0\" y=\"369.6\" width=\"8\" height=\"19.2\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"146.0\" y=\"369.6\" width=\"8\" height=\"19.2\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M100.0,358.8 L86.0,340.8\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"168.0\" cy=\"344.4\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<rect x=\"273\" y=\"294\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"301\" y=\"294\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"329\" y=\"294\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"357\" y=\"294\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"273\" y=\"322\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"301\" y=\"322\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<rect x=\"329\" y=\"322\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<rect x=\"357\" y=\"322\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"273\" y=\"350\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"301\" y=\"350\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"329\" y=\"350\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"357\" y=\"350\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"273\" y=\"378\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"301\" y=\"378\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"329\" y=\"378\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"357\" y=\"378\" width=\"25\" height=\"25\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<text x=\"327\" y=\"443\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"327\" dy=\"0\">区域特征 A</tspan>\n</text>\n<path d=\"M390,351 L433,351\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-story-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"445\" y=\"302\" width=\"200\" height=\"98\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"545.0\" y=\"334\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"545.0\" dy=\"0\">打分 → 权重 α</tspan>\n</text>\n<text x=\"545.0\" y=\"365\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"545.0\" dy=\"0\">结合 A 与 hₜ₋₁</tspan>\n</text>\n<path d=\"M655,351 L702,351\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-story-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"719\" y=\"283\" width=\"190\" height=\"102\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"721\" y=\"349.3\" width=\"186\" height=\"33.660000000000004\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"867.2\" cy=\"305.44\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"776.0\" y=\"330.94\" width=\"57.0\" height=\"20.400000000000002\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"833.0\" cy=\"328.9\" r=\"14.280000000000001\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M827.3,317.68 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"783.6\" y=\"347.26\" width=\"8\" height=\"16.32\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"819.7\" y=\"347.26\" width=\"8\" height=\"16.32\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M776.0,338.08 L762.7,322.78\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"840.6\" cy=\"325.84\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<rect x=\"764.6\" y=\"308.5\" width=\"89.3\" height=\"57.120000000000005\" rx=\"5\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"7 5\" class=\"d1-s-amber\" />\n<text x=\"814\" y=\"413\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-amber\">\n<tspan x=\"814\" dy=\"0\">生成“狗”时</tspan>\n</text>\n<rect x=\"719\" y=\"438\" width=\"190\" height=\"102\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"721\" y=\"504.3\" width=\"186\" height=\"33.660000000000004\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"867.2\" cy=\"460.44\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"776.0\" y=\"485.94\" width=\"57.0\" height=\"20.400000000000002\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"833.0\" cy=\"483.9\" r=\"14.280000000000001\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M827.3,472.68 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"783.6\" y=\"502.26\" width=\"8\" height=\"16.32\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"819.7\" y=\"502.26\" width=\"8\" height=\"16.32\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M776.0,493.08 L762.7,477.78\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"840.6\" cy=\"480.84\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<rect x=\"725\" y=\"508.38\" width=\"178\" height=\"24.48\" rx=\"5\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"7 5\" class=\"d1-s-amber\" />\n<text x=\"814\" y=\"568\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-amber\">\n<tspan x=\"814\" dy=\"0\">生成“草地”时</tspan>\n</text>\n<path d=\"M645,351 L681,351 L681,485 L705,485\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-story-arrow)\" class=\"d1-s-grn\" />\n<text x=\"545\" y=\"456\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-grn\">\n<tspan x=\"545\" dy=\"0\">hₜ₋₁：语言读取需求</tspan>\n</text>\n<path d=\"M545,432 L545,411\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-story-arrow)\" class=\"d1-s-grn\" />\n<text x=\"40\" y=\"492\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"40\" dy=\"0\">同一张图，α 随语言状态改变。</tspan>\n<tspan x=\"40\" dy=\"30.45\">权重 → 加权上下文 zₜ → 下一词概率</tspan>\n</text>\n</g></svg><figcaption>先看上行的单向量瓶颈，再看下行：图像网格保留位置，语言状态决定本步的读取权重。“狗”和“草地”的框仅为教学示意，不是实测注意力。 示意框 ≠ 理解证明；是否依赖图像，还要做遮挡、换图等对照。</figcaption></figure>\n  <p>单向量v必须同时保留狗、草地、红球、相互位置和背景；但生成“狗”与生成“红色”所需证据不同。长句还要依赖很早输入的图像信息，固定瓶颈可能让小物体和局部属性被淹没。</p>\n  <p>Show, Attend and Tell（2015）的变化不是凭空增加一个神秘“注意力模块”，而是两个具体设计：第一，不把整图立即压成一个向量，保留CNN的空间特征网格；第二，让语言解码器在每个输出步骤，根据已有状态对这些区域重新分配权重。</p>\n  <p>假设CNN输出14×14×512。前两维表示196个空间位置，最后一维是每个位置的512维特征。把它重排成矩阵A，形状为<code>[196,512]</code>；第i行aᵢ对应图片某个位置的特征。因卷积感受野可能覆盖较大区域，它不是精确的像素框，也不保证一行刚好对应一个物体。</p>\n  <p>于是模型不必每次“重新看CNN”：CNN可先计算一次A；生成每个词时，对同一份A做不同读取。这就是注意力解决的接口问题——<b>按当前语言需要，从保留的视觉位置中读取信息</b>。</p>\n  <h3>4. 一步视觉注意力，严格拆成四个运算</h3>\n  <p>步骤一，用解码器上一步的hₜ₋₁表达当前需求。例如已经说“一只”，状态可能倾向寻找可接上的动物名；这是训练学出的趋势，不是手写语法规则。</p>\n  <p>步骤二，对每个视觉位置打分。经典加性注意力的一种写法是：</p>\n  <p><code>eₜᵢ = uᵀ tanh(Wa aᵢ + Wh hₜ₋₁ + b)</code>。</p>\n  <p>Wa把视觉特征映到共同的中间维度，Wh把语言状态映到同一维度；两者相加后过tanh，再由向量u读成一个数eₜᵢ。上标T表示转置，向量的点积把一组数合成一个标量。e不是概率，可以为负，也不要求总和为1。</p>\n  <p>步骤三，把分数归一化：</p>\n  <p><code>αₜᵢ = exp(eₜᵢ) / Σⱼ exp(eₜⱼ)</code>。</p>\n  <p>这叫softmax。每个α非负，所有区域的α加起来为1，因此可理解成这一步读取各区域的比例。实际实现常先减去分数最大值再取指数，概率不变，但能避免大数溢出。</p>\n  <p>步骤四，得到上下文向量：</p>\n  <p><code>zₜ = Σᵢ αₜᵢ aᵢ</code>。</p>\n  <p>zₜ仍是512维，不是196维；196个权重把196个512维向量加权合成一个512维向量。然后把<code>[上一词嵌入, zₜ]</code>交给LSTM更新hₜ，再通过线性层和softmax得到下一词概率。也可以在输出层再次使用zₜ；不同模型的连接方式会不同。</p>\n  <div class=\"flow\">图像 → CNN → A=[所有位置的视觉特征] ───────────────┐\n                                                  │\n上一状态h + A → 区域打分e → softmax权重α → 加权读取z│\n                                                  ▼\n上一词嵌入x + z → LSTM → 当前状态h → 词表概率 → 下一词\n                             │                    │\n                             └─────下一步─────────┘</div>\n  <h3>5. 完整手算：注意力不是一句“看向狗”就解释完了</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 580\" role=\"img\" aria-labelledby=\"l1-attention-math-title l1-attention-math-desc\" class=\"d1-figure\">\n<title id=\"l1-attention-math-title\">把注意力算完：3 个区域 → 1 个上下文</title><desc id=\"l1-attention-math-desc\">区域向量分别为(1,0)、(0,1)、(1,1)，人为给定分数ln4、0、ln5，softmax得到0.4、0.1、0.5；加权结果为(0.9,0.6)。</desc>\n<defs><marker id=\"l1-attention-math-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"578\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">把注意力算完：3 个区域 → 1 个上下文</tspan>\n</text>\n<text x=\"32\" y=\"84\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"32\" dy=\"0\">① 区域向量 aᵢ</tspan>\n</text>\n<text x=\"288\" y=\"84\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"288\" dy=\"0\">② 分数 eᵢ</tspan>\n</text>\n<text x=\"520\" y=\"84\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"520\" dy=\"0\">③ softmax 权重 αᵢ</tspan>\n</text>\n<rect x=\"36\" y=\"113\" width=\"192\" height=\"72\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"132.0\" y=\"145\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"132.0\" dy=\"0\">a1 = (1, 0)</tspan>\n</text>\n<path d=\"M238,149 L281,149\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-math-arrow)\" class=\"d1-s-acc\" />\n<text x=\"364\" y=\"156\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"364\" dy=\"0\">ln 4</tspan>\n</text>\n<path d=\"M447,149 L490,149\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-math-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"512\" y=\"131\" width=\"300\" height=\"40\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-line\" />\n<rect x=\"512\" y=\"131\" width=\"120.0\" height=\"40\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"841\" y=\"157\" font-size=\"25\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"841\" dy=\"0\">0.4</tspan>\n</text>\n<rect x=\"36\" y=\"205\" width=\"192\" height=\"72\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"132.0\" y=\"237\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"132.0\" dy=\"0\">a2 = (0, 1)</tspan>\n</text>\n<path d=\"M238,241 L281,241\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-math-arrow)\" class=\"d1-s-acc\" />\n<text x=\"364\" y=\"248\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"364\" dy=\"0\">ln 1 = 0</tspan>\n</text>\n<path d=\"M447,241 L490,241\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-math-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"512\" y=\"223\" width=\"300\" height=\"40\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-line\" />\n<rect x=\"512\" y=\"223\" width=\"30.0\" height=\"40\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"841\" y=\"249\" font-size=\"25\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"841\" dy=\"0\">0.1</tspan>\n</text>\n<rect x=\"36\" y=\"297\" width=\"192\" height=\"72\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"132.0\" y=\"329\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"132.0\" dy=\"0\">a3 = (1, 1)</tspan>\n</text>\n<path d=\"M238,333 L281,333\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-math-arrow)\" class=\"d1-s-acc\" />\n<text x=\"364\" y=\"340\" font-size=\"24\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"364\" dy=\"0\">ln 5</tspan>\n</text>\n<path d=\"M447,333 L490,333\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l1-attention-math-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"512\" y=\"315\" width=\"300\" height=\"40\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-line\" />\n<rect x=\"512\" y=\"315\" width=\"150.0\" height=\"40\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"841\" y=\"341\" font-size=\"25\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"841\" dy=\"0\">0.5</tspan>\n</text>\n<rect x=\"38\" y=\"411\" width=\"878\" height=\"111\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"477.0\" y=\"443\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"477.0\" dy=\"0\">④ 加权求和 z = Σ αᵢaᵢ</tspan>\n</text>\n<text x=\"477.0\" y=\"474\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"477.0\" dy=\"0\">0.4×(1,0) + 0.1×(0,1) + 0.5×(1,1) = (0.9, 0.6)</tspan>\n</text>\n</g></svg><figcaption>区域向量分别为(1,0)、(0,1)、(1,1)，人为给定分数ln4、0、ln5，softmax得到0.4、0.1、0.5；加权结果为(0.9,0.6)。 exp(e)=(4,1,5)，总和=10；归一化沿“图像区域”维度，权重和为 1。</figcaption></figure>\n  <p>用3个位置、每处2维特征代替196×512，方便手算。设：</p>\n  <table><tr><th>位置</th><th>特征向量</th><th>仅用于理解的区域备注</th></tr><tr><td>1</td><td>a₁=(1,0)</td><td>一个区域</td></tr><tr><td>2</td><td>a₂=(0,1)</td><td>另一个区域</td></tr><tr><td>3</td><td>a₃=(1,1)</td><td>第三个区域</td></tr></table>\n  <p>这些数字是教学构造，不是真实CNN输出。假设经过打分网络得到<code>e=(ln4, ln1, ln5)</code>。取指数得(4,1,5)，和是10，因此<code>α=(0.4,0.1,0.5)</code>。</p>\n  <p>上下文是：</p>\n  <p><code>z = 0.4(1,0) + 0.1(0,1) + 0.5(1,1) = (0.9,0.6)</code>。</p>\n  <p>下一步语言状态变了，分数可能变成<code>(ln1,ln8,ln1)</code>，权重变成(0.1,0.8,0.1)，上下文变成(0.2,0.9)。同一张图提供了两种不同的读取结果，这才是“生成不同词时看不同区域”的数值含义。</p>\n  <p>若某个极简输出层给“狗/球/草地”的分数分别为<code>2z₁、2z₂、z₁+z₂</code>，第一步得(1.8,1.2,1.5)，softmax约为(0.437,0.240,0.324)。这只是人为构造的示范，不表明特征第一维天然代表狗；真实模型必须从大量图像—句子对学出这样的读出关系。</p>\n  <h3>6. 训练时怎么知道“该看哪里”？大多没有逐词框标注</h3>\n  <p>通常训练集给整张图和整句话，并没有“狗”这个词对应哪个位置的监督。模型先按当前参数算出α、z及词表概率；若正确词是“狗”，损失是<code>−log P(狗)</code>。概率越低，损失越大。</p>\n  <p>softmax、加权和、LSTM和词表输出都是可微运算。反向传播把“正确词概率不够高”的信号传到打分网络，从而调整Wa、Wh、u，必要时也调整CNN。<b>注意力权重是为了更好预测训练词而学出来的，不是额外的人眼标注自动落入模型。</b></p>\n  <p>训练通常使用teacher forcing：第t步喂标准答案的上一词，便于对训练样本做批处理并稳定学习，但LSTM各时间步仍依次更新；推理只能喂模型自己刚生成的词。前面猜错可能影响后面，这种训练—推理条件差异是误差累积的重要来源。</p>\n  <p>soft attention使用所有位置的加权和，容易直接求梯度。原论文还讨论hard attention：采样某个位置再读取，采样选择不可直接按普通方式求导，需要其他梯度估计方法。两者不要仅凭“权重很尖”来区分：soft权重接近one-hot仍然是soft attention。</p>\n  <h3>7. 可运行的最小实现：接口与梯度，而不是假装训练完一个模型</h3>\n  <p>下面CPU代码只演示一个生成步骤。随机特征代替CNN输出；随机初始化的模型没有看图说话能力。</p>\n  <div class=\"flow\">import torch\nfrom torch import nn\n\ntorch.manual_seed(7)\nB, L, D, H, E, V = 2, 3, 4, 5, 3, 6\nA = torch.randn(B, L, D)          # 两张图，各3个区域，各4维\nh = torch.zeros(B, H)            # 上一步语言隐藏状态\nmemory = torch.zeros(B, H)\nx = torch.randn(B, E)            # 上一词嵌入\nvisual_proj = nn.Linear(D, H)\nstate_proj = nn.Linear(H, H, bias=False)\nscore = nn.Linear(H, 1, bias=False)\ncell = nn.LSTMCell(E + D, H)\nreadout = nn.Linear(H, V)\n\ne = score(torch.tanh(visual_proj(A) + state_proj(h)[:, None, :]))\ne = e.squeeze(-1)                # [B,L]，每处一个分数\nalpha = e.softmax(dim=-1)        # 对“区域维”归一化\nz = torch.bmm(alpha[:, None, :], A).squeeze(1)  # [B,D]\nh_new, memory_new = cell(torch.cat([x, z], dim=-1), (h, memory))\nlogits = readout(h_new)           # [B,V]\nloss = nn.functional.cross_entropy(logits, torch.tensor([1, 2]))\nloss.backward()\nprint(alpha.sum(-1))             # 两个值均约为1\nprint(z.shape, logits.shape)     # [2,4]、[2,6]\nprint(score.weight.grad.norm())  # 非零：词损失可以训练注意力</div>\n  <p>最常见的实现错误是沿特征维做softmax，得到“每个特征通道的权重”，却声称在选区域。第二个错误是把α与A相乘后忘了对区域求和，形状就不能正确进入LSTM。第三个是训练时把未来答案喂进当前需求状态，造成信息泄漏。</p>\n  <h3>8. 如何理解注意力图，及其局限</h3>\n  <p>把α的196个值重新排成14×14，插值到图片大小，就能画热图。它告诉你这一层在这一时刻如何分配读取权重，却不能充分证明输出的原因：特征可能已经包含邻域信息，不同权重组合可能得到近似上下文，语言先验也能主导答案。</p>\n  <p>例如图片里有狗和球，模型给狗区域高权重，却仍输出“猫”；这可能是视觉特征分类错了，也可能是词表读出错了。反过来，权重较分散也不一定失败。因此应同时检查输出、注意力、遮挡或替换区域后的变化，避免只凭热图解释可靠性。</p>\n  <h3>9. 与Transformer是什么关系？思想相通，运算结构不同</h3>\n  <p>早期这一步是交叉模态读取：语言状态提供“想找什么”，视觉位置提供“可读的信息”。后来的Transformer交叉注意力把需求映成Q（query）、视觉特征映成K（key）和V（value），用点积相似度生成权重：<code>softmax(QKᵀ/√d)V</code>。它通常有多头和多层，但本质仍然是按需求加权读取。</p>\n  <p>自注意力则让Q、K、V来自同一序列，例如一串文本词彼此读取，或视觉patch彼此读取。“自/交叉”描述信息来自哪里；“加性/点积”描述如何打分；“soft/hard”描述如何选择与求梯度，三个分类不能混在一起。</p>\n  <h3>10. 从描述到VQA：把“用户想知道什么”也加入条件</h3>\n  <p>image captioning只要求给图写一句描述；视觉问答VQA则给图像I与问题q，要求答案a。目标从<code>P(句子|I)</code>变成<code>P(a|I,q)</code>。问“球是什么颜色”和问“有几只狗”，同一图需要读取不同证据，不能每次都只生成默认caption。</p>\n  <p>早期实现可以先用一个文本编码器把问题变成向量，再与图像特征结合，或让问题状态直接参与视觉注意力打分。输出既可以是一个固定答案类别的分类头，例如颜色/数字候选；也可以是逐词生成器。分类方法容易判分但词表有限，生成方法更灵活却需要处理同义表达与答案格式。</p>\n  <p>举例：图片上有两只狗和一个红球。问题“球是什么颜色？”需要定位球区域并读取颜色；“有几只狗？”需要覆盖多个狗区域并区分不同实例。只把注意力集中到一只狗，不足以保证正确计数，因为注意力是加权信息读取，不是显式对象计数器。</p>\n  <p>还要防语言捷径：若训练集里“香蕉是什么颜色”多数答案都是黄色，模型可能不看图也答对。验证视觉依赖时，可对照不同颜色的香蕉图、遮挡图像、固定问题换图，看答案是否随证据变化。原始VQA数据集在2015年推动了这类任务，但VQA这个名字本身不保证模型在做可靠推理。</p>\n  <h3>练习</h3>\n  <details class=\"quiz\"><summary>🧠 α=(0.2,0.3,0.5)，沿用上表A，z是多少？</summary><div class=\"qa\"><b>答:</b>(0.7,0.8)。</div></details>\n  <details class=\"quiz\"><summary>🧠 所有分数都加100，权重会变吗？</summary><div class=\"qa\"><b>答:</b>数学上不变，分子分母有共同倍数；实现应减max避免溢出。</div></details>\n  <details class=\"quiz\"><summary>🧠 为什么只有一张图，也要每个词重新算α？</summary><div class=\"qa\"><b>答:</b>图像没变，但语言状态和当前读取需求变了。</div></details>\n  <details class=\"quiz\"><summary>🧠 把L由196改为784，z的维度会变吗？</summary><div class=\"qa\"><b>答:</b>D固定时仍为D；权重长度与计算量会变。</div></details>\n  <details class=\"quiz\"><summary>🧠 注意力热图落在狗身上，能证明模型真的理解狗吗？</summary><div class=\"qa\"><b>答:</b>不能，需要输出和干预等额外证据。</div></details>\n  <p>带着本讲继续：注意力改善“怎么读取”，但视觉特征本身若缺少语言语义，对齐仍然困难。下一讲CLIP讨论如何用图文配对训练出更可复用的视觉底座。</p>\n  "},
{id:"l2", grp:"前世 · 视觉语言地基与桥接", kick:"Lecture 2", title:"对齐的突破:CLIP 与对比学习", lead:"用网络规模的图文对比预训练,造出一个「语义对齐」的视觉底座。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议时长40–45分钟。前置：知道向量和本课L1的编码器含义；本讲解释点积、归一化和对比损失。学完应能手算一个图文匹配batch，解释zero-shot分类，并指出CLIP为什么不能直接回答开放式问题。</div>\n  <h3>1. 从“怎么读图”到“读出的特征为什么懂语义”</h3>\n  <p>L1的注意力能改变读取位置，但读取到的视觉特征是否理解“金毛”“滑雪”或“手持红球”，仍取决于训练。传统分类训练把图片映到固定标签，假设只有1000类，模型的训练目标就只区分这1000类；如果想增加“在水中奔跑的狗”这种复杂类别，固定标签体系很难扩展。</p>\n  <p>网络图片常有描述、标题或alt文本。它们虽然嘈杂，却给出了比类别名丰富的监督。CLIP的想法是：同时训练图像编码器和文本编码器，让正确配对的图文在一个共同空间里相似，错误配对的图文不相似。它不是把所有图片转成文字，而是让两种输入各自产生可比较的向量。</p>\n  <h3>2. 两个编码器与一个共同空间</h3>\n  <p>图像编码器f把图像I变成向量v；文本编码器g把描述T变成向量t。两边原始输出维度可能不同，因此各自有投影层映到相同维度d。</p>\n  <p><code>v = normalize(project_image(f(I)))</code></p>\n  <p><code>t = normalize(project_text(g(T)))</code></p>\n  <p>normalize把向量除以自身长度。二维向量(3,4)长度是5，归一化后为(0.6,0.8)。对已归一化向量，点积<code>v·t</code>等于它们夹角的余弦，相似方向得高分，正交得0，相反方向得−1。这个相似度是学到的表示关系，不是天然的“事实相同”判定器。</p>\n  <p>视觉侧可以是CNN，也可以是ViT。ViT先把图像分成patch，把每个patch投影成向量，用Transformer在patch之间交换信息。CLIP图文对比通常比较的是汇总后的全图向量；后续VLM经常取视觉Transformer内部的patch特征，保留细节。<b>全局对齐目标和局部特征用途是相关但不同的两件事。</b></p>\n  <h3>3. 一个batch如何制造监督信号</h3>\n  <p>设一次训练取N个图文对<code>(I₁,T₁)…(Iₙ,Tₙ)</code>。把图像向量排成矩阵X，文本向量排成Y，两者形状都是<code>[N,d]</code>。计算：</p>\n  <p><code>S = X Yᵀ / τ</code>。</p>\n  <p>S形状为<code>[N,N]</code>；Sᵢⱼ表示第i张图与第j段文本的匹配分数。τ是正的温度，控制softmax的尖锐程度；温度越小，同样的相似度差会被放大。实际CLIP学习一个相应的缩放参数，并需要稳定性处理。</p>\n  <p>如果batch按配对顺序组织，正确匹配就在矩阵对角线上。图到文任务：固定第i张图，要求它在N段文本中选第i段；文到图任务：固定第j段文本，要求它在N张图中选第j张。每个配对既提供正例，其他batch样本又提供候选负例。</p>\n  <p>图到文概率与损失是：</p>\n  <div class=\"flow\">P(Tⱼ | Iᵢ, 这个batch) = exp(Sᵢⱼ) / Σₖ exp(Sᵢₖ)\nL_image = (1/N) Σᵢ −log P(Tᵢ | Iᵢ, 这个batch)\nL_text  = 对S的列做同样的正确配对损失\nL = (L_image + L_text)/2</div>\n  <p>“这个batch”不能省略理解：这里的概率只是在候选集合中匹配的概率，不是句子真实与否的普遍概率，也不是生成这段文本的概率。</p>\n  <h3>4. 手算2×2：损失怎么把正确配对拉近</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 620\" role=\"img\" aria-labelledby=\"l2-clip-pairs-title l2-clip-pairs-desc\" class=\"d1-figure\">\n<title id=\"l2-clip-pairs-title\">CLIP：配对数据 → 双塔 → 匹配矩阵</title><desc id=\"l2-clip-pairs-desc\">两对图文分别编码并归一化；教学手算令向量为单位基、温度0.5，相似度矩阵为[[2,0],[0,2]]。正确配对位于对角线，双向交叉熵为0.1269。</desc>\n<defs><marker id=\"l2-clip-pairs-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"618\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">CLIP：配对数据 → 双塔 → 匹配矩阵</tspan>\n</text>\n<rect x=\"40\" y=\"112\" width=\"165\" height=\"100\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"42\" y=\"177.0\" width=\"161\" height=\"33.0\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"168.70000000000002\" cy=\"134.0\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"89.5\" y=\"159.0\" width=\"49.5\" height=\"20.0\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"139.0\" cy=\"157.0\" r=\"14.000000000000002\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M134.05,146.0 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"96.1\" y=\"175.0\" width=\"8\" height=\"16.0\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"127.45\" y=\"175.0\" width=\"8\" height=\"16.0\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M89.5,166.0 L77.95,151.0\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"145.60000000000002\" cy=\"154.0\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<text x=\"123\" y=\"239\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"123\" dy=\"0\">图像 1：狗</tspan>\n</text>\n<rect x=\"40\" y=\"275\" width=\"165\" height=\"90\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<rect x=\"70\" y=\"303\" width=\"100\" height=\"28\" rx=\"7\" stroke-width=\"1.5\" class=\"d1-f-acc d1-s-acc\" />\n<rect x=\"90\" y=\"287\" width=\"49\" height=\"31\" rx=\"5\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<circle cx=\"91\" cy=\"336\" r=\"12\" stroke-width=\"2\" class=\"d1-f-gray d1-s-mut\" />\n<circle cx=\"149\" cy=\"336\" r=\"12\" stroke-width=\"2\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"123\" y=\"395\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"123\" dy=\"0\">图像 2：汽车</tspan>\n</text>\n<rect x=\"270\" y=\"114\" width=\"228\" height=\"104\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"384.0\" y=\"146\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"384.0\" dy=\"0\">图像编码器</tspan>\n</text>\n<text x=\"384.0\" y=\"177\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"384.0\" dy=\"0\">归一化 → x₁, x₂</tspan>\n</text>\n<rect x=\"270\" y=\"276\" width=\"228\" height=\"104\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"384.0\" y=\"308\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"384.0\" dy=\"0\">文本编码器</tspan>\n</text>\n<text x=\"384.0\" y=\"339\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"384.0\" dy=\"0\">归一化 → y₁, y₂</tspan>\n</text>\n<path d=\"M215,163 L257,163\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-pairs-arrow)\" class=\"d1-s-acc\" />\n<path d=\"M215,319 L238,319 L238,198 L257,198\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-pairs-arrow)\" class=\"d1-s-acc\" />\n<text x=\"40\" y=\"443\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"40\" dy=\"0\">文本 1：“一只狗”</tspan>\n<tspan x=\"40\" dy=\"30.45\">文本 2：“一辆汽车”</tspan>\n</text>\n<path d=\"M235,435 L253,435 L253,336 L260,336\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-pairs-arrow)\" class=\"d1-s-grn\" />\n<path d=\"M508,166 L552,211\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-pairs-arrow)\" class=\"d1-s-acc\" />\n<path d=\"M508,332 L552,279\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-pairs-arrow)\" class=\"d1-s-grn\" />\n<text x=\"725\" y=\"116\" font-size=\"25\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"725\" dy=\"0\">Sᵢⱼ = xᵢ·yⱼ / τ</tspan>\n</text>\n<text x=\"640\" y=\"158\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"640\" dy=\"0\">文本 1</tspan>\n</text>\n<text x=\"795\" y=\"158\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"795\" dy=\"0\">文本 2</tspan>\n</text>\n<text x=\"578\" y=\"223\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"578\" dy=\"0\">图 1</tspan>\n</text>\n<rect x=\"603\" y=\"181\" width=\"133\" height=\"72\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"669\" y=\"226\" font-size=\"29\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"669\" dy=\"0\">2 ✓</tspan>\n</text>\n<rect x=\"758\" y=\"181\" width=\"133\" height=\"72\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-line\" />\n<text x=\"824\" y=\"226\" font-size=\"29\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"824\" dy=\"0\">0</tspan>\n</text>\n<text x=\"578\" y=\"307\" font-size=\"18\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"578\" dy=\"0\">图 2</tspan>\n</text>\n<rect x=\"603\" y=\"265\" width=\"133\" height=\"72\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-line\" />\n<text x=\"669\" y=\"310\" font-size=\"29\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"669\" dy=\"0\">0</tspan>\n</text>\n<rect x=\"758\" y=\"265\" width=\"133\" height=\"72\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"824\" y=\"310\" font-size=\"29\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"824\" dy=\"0\">2 ✓</tspan>\n</text>\n<rect x=\"552\" y=\"389\" width=\"364\" height=\"112\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"734.0\" y=\"421\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"734.0\" dy=\"0\">每行 / 每列分别做 CE</tspan>\n</text>\n<text x=\"734.0\" y=\"452\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"734.0\" dy=\"0\">正确项概率 0.8808</tspan>\n<tspan x=\"734.0\" dy=\"27.55\">双向平均 loss ≈ 0.1269</tspan>\n</text>\n</g></svg><figcaption>两对图文分别编码并归一化；教学手算令向量为单位基、温度0.5，相似度矩阵为[[2,0],[0,2]]。正确配对位于对角线，双向交叉熵为0.1269。 数值为单位基向量手算；不代表图中插画的真实 CLIP 输出。</figcaption></figure>\n  <p>设两张图与两段文本都得到单位向量：<code>v₁=t₁=(1,0)</code>，<code>v₂=t₂=(0,1)</code>。温度τ=0.5，那么S是：</p>\n  <table><tr><th></th><th>文本1</th><th>文本2</th></tr><tr><td>图1</td><td>2</td><td>0</td></tr><tr><td>图2</td><td>0</td><td>2</td></tr></table>\n  <p>图1选文本1的概率为<code>e²/(e²+e⁰)=0.8808</code>。正确项损失为<code>−log(0.8808)=0.1269</code>。图2和文到图同理，平均损失也为0.1269。</p>\n  <p>若编码器把两张图都输出成同一向量，分数无法区分候选，正确匹配概率可退化到0.5，损失约0.6931。模型因此受到压力去编码能区分配对的内容。</p>\n  <p>对某一行，交叉熵对分数的梯度是<code>预测概率−目标指示值</code>。正确项的目标是1，若预测0.8808，梯度约−0.1192，更新倾向提高该分数；错误项目标0，梯度为正，更新倾向降低分数。这就是“拉近/推远”的计算含义，不是把两个物理点真的搬动。</p>\n  <p>若τ从0.5降为0.25，分数变成4与0，概率约0.9820。它更确信，却不意味着编码器真的变得更懂图片；错误配对同样会被更确信地判断错误。温度是训练与校准参数，不能单独充当能力指标。</p>\n  <h3>5. 最小实现与数据对应</h3>\n  <p>下面是双向对比损失的CPU算例。实际训练把X/Y换成真实编码器输出；这里只验证矩阵与损失。</p>\n  <div class=\"flow\">import torch\nfrom torch.nn import functional as F\n\nX = torch.tensor([[1., 0.], [0., 1.]], requires_grad=True)\nY = torch.tensor([[1., 0.], [0., 1.]], requires_grad=True)\nXn, Yn = F.normalize(X, dim=-1), F.normalize(Y, dim=-1)\nscores = Xn @ Yn.T / 0.5\nlabels = torch.arange(2)       # 对角线为正确图文配对\nloss = (F.cross_entropy(scores, labels)\n        + F.cross_entropy(scores.T, labels)) / 2\nloss.backward()\nprint(scores.detach())        # [[2,0],[0,2]]\nprint(round(loss.item(), 4))  # 0.1269\nprint(X.grad)                # 图像侧也收到对比目标的梯度</div>\n  <p>实现时要保证图文配对索引没有打乱。若多GPU聚合负例，标签需要对应全局候选位置；若只局部聚合，却用全局标签，会出现静默的监督错误。也要检查输入归一化、温度与数值精度，不能把“模型不收敛”一概归咎于数据量。</p>\n  <h3>6. 不训练新分类头，怎么做zero-shot分类</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 590\" role=\"img\" aria-labelledby=\"l2-clip-zeroshot-title l2-clip-zeroshot-desc\" class=\"d1-figure\">\n<title id=\"l2-clip-zeroshot-title\">Zero-shot 分类：在共同空间里找最像的文字</title><desc id=\"l2-clip-zeroshot-desc\">将类别名称写成提示句，经文本编码器得到单位向量；图像向量和候选文本比较余弦相似度，选择最高者。图中的角度和分数是教学构造，不是实测。</desc>\n<defs><marker id=\"l2-clip-zeroshot-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"588\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">Zero-shot 分类：在共同空间里找最像的文字</tspan>\n</text>\n<rect x=\"40\" y=\"112\" width=\"225\" height=\"140\" rx=\"10\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-line\" />\n<rect x=\"42\" y=\"203.0\" width=\"221\" height=\"46.2\" rx=\"6\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-green\" />\n<circle cx=\"215.5\" cy=\"142.8\" r=\"11\" stroke-width=\"2\" class=\"d1-f-amber d1-s-amber\" />\n<rect x=\"107.5\" y=\"177.8\" width=\"67.5\" height=\"28.0\" rx=\"8\" stroke-width=\"1.5\" class=\"d1-f-amber d1-s-brown\" />\n<circle cx=\"175.0\" cy=\"175.0\" r=\"19.6\" stroke-width=\"2\" class=\"d1-f-amber d1-s-brown\" />\n<path d=\"M168.25,159.6 l-7,-15 l17,10 Z\" class=\"d1-f-brown\" />\n<rect x=\"116.5\" y=\"200.2\" width=\"8\" height=\"22.400000000000002\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<rect x=\"159.25\" y=\"200.2\" width=\"8\" height=\"22.400000000000002\" rx=\"2\" stroke-width=\"1.5\" class=\"d1-f-brown d1-s-brown\" />\n<path d=\"M107.5,187.60000000000002 L91.75,166.6\" fill=\"none\" stroke-width=\"6\" class=\"d1-s-brown\" />\n<circle cx=\"184.0\" cy=\"170.8\" r=\"2\" stroke-width=\"2\" class=\"d1-f-ink d1-s-ink\" />\n<rect x=\"40\" y=\"298\" width=\"225\" height=\"103\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"152.5\" y=\"330\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"152.5\" dy=\"0\">图像编码器</tspan>\n</text>\n<text x=\"152.5\" y=\"361\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"152.5\" dy=\"0\">单位向量 x</tspan>\n</text>\n<path d=\"M152,263 L152,285\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-zeroshot-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"336\" y=\"112\" width=\"260\" height=\"149\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"466.0\" y=\"144\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"466.0\" dy=\"0\">类别 → 提示句</tspan>\n</text>\n<text x=\"466.0\" y=\"175\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"466.0\" dy=\"0\">“a photo of a dog”</tspan>\n<tspan x=\"466.0\" dy=\"27.55\">“a photo of a car”</tspan>\n<tspan x=\"466.0\" dy=\"27.55\">“a photo of a bird”</tspan>\n</text>\n<rect x=\"336\" y=\"299\" width=\"260\" height=\"103\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"466.0\" y=\"331\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"466.0\" dy=\"0\">文本编码器</tspan>\n</text>\n<text x=\"466.0\" y=\"362\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"466.0\" dy=\"0\">单位向量 y₁,y₂,y₃</tspan>\n</text>\n<path d=\"M466,272 L466,285\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-zeroshot-arrow)\" class=\"d1-s-grn\" />\n<circle cx=\"765\" cy=\"289\" r=\"125\" stroke-width=\"2\" class=\"d1-f-panel d1-s-line\" />\n<path d=\"M630,289 L900,289\" fill=\"none\" stroke-width=\"2.5\" class=\"d1-s-mut\" />\n<path d=\"M765,424 L765,154\" fill=\"none\" stroke-width=\"2.5\" class=\"d1-s-mut\" />\n<path d=\"M765,289 L885.7407282861335,256.6476193621849\" fill=\"none\" stroke-width=\"3\" marker-end=\"url(#l2-clip-zeroshot-arrow)\" class=\"d1-s-acc\" />\n<text x=\"888.7407282861335\" y=\"247.6476193621849\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-acc\">\n<tspan x=\"888.7407282861335\" dy=\"0\">图像 x</tspan>\n</text>\n<path d=\"M765,289 L867.3940055361239,217.30294545611923\" fill=\"none\" stroke-width=\"3\" marker-end=\"url(#l2-clip-zeroshot-arrow)\" class=\"d1-s-grn\" />\n<text x=\"870.3940055361239\" y=\"208.30294545611923\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-grn\">\n<tspan x=\"870.3940055361239\" dy=\"0\">狗 y₁</tspan>\n</text>\n<path d=\"M765,289 L712.1727172824126,175.71152662041874\" fill=\"none\" stroke-width=\"3\" marker-end=\"url(#l2-clip-zeroshot-arrow)\" class=\"d1-s-amber\" />\n<text x=\"708.1727172824126\" y=\"202.71152662041874\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-amber\">\n<tspan x=\"708.1727172824126\" dy=\"0\">车 y₂</tspan>\n</text>\n<path d=\"M765,289 L651.7115266204187,341.8272827175874\" fill=\"none\" stroke-width=\"3\" marker-end=\"url(#l2-clip-zeroshot-arrow)\" class=\"d1-s-mut\" />\n<text x=\"647.7115266204187\" y=\"368.8272827175874\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-mut\">\n<tspan x=\"647.7115266204187\" dy=\"0\">鸟 y₃</tspan>\n</text>\n<path d=\"M607,350 L627,350\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-zeroshot-arrow)\" class=\"d1-s-grn\" />\n<path d=\"M275,350 L313,350 L313,426 L765,426 L765,418\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l2-clip-zeroshot-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"336\" y=\"456\" width=\"573\" height=\"77\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"622.5\" y=\"488\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"622.5\" dy=\"0\">相似度最高 → 预测“狗”</tspan>\n</text>\n<text x=\"44\" y=\"477\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"44\" dy=\"0\">不更新模型参数；</tspan>\n<tspan x=\"44\" dy=\"30.45\">换的是候选文字。</tspan>\n</text>\n</g></svg><figcaption>将类别名称写成提示句，经文本编码器得到单位向量；图像向量和候选文本比较余弦相似度，选择最高者。图中的角度和分数是教学构造，不是实测。 小角度 → 大余弦；提示模板、候选集合和模型偏差会影响结果。</figcaption></figure>\n  <p>给一张从未在指定下游训练集微调过的图片，以及候选类别“狗、猫、汽车”。把每个类别放进文本模板，如“a photo of a dog”；文本编码器给出三个向量。图像编码器给出v，比较与三者的相似度，最大值对应预测类别。</p>\n  <p>为什么比直接输入“dog”常更好？因为预训练文本多是描述性句子，模板更接近训练分布。可以给每类多种模板，先归一化、平均、再归一化，形成更稳定的类别表示。不同语言、模板和候选类别集合都会改变结果，因此读zero-shot数字要问设置。</p>\n  <p>zero-shot不是“模型没见过任何狗”，而是没有在这个特定下游分类任务上进行相应训练。网络预训练可能已经见过大量狗以及类别名称。它也不说明没有数据污染；训练图文与评测图像重合仍须检查。</p>\n  <h3>7. SigLIP改变了哪一步</h3>\n  <p>CLIP的softmax把一行N个候选放在同一个分母里，相互竞争。SigLIP把每个图文配对看作一个二分类：匹配为正，不匹配为负。令标签y取+1/−1，z为缩放相似度加可学习偏置，则单对损失可写成：</p>\n  <p><code>L_pair = −log sigmoid(yz)</code>。</p>\n  <p>正例希望z大，负例希望z小；不需要每个样本都在softmax里与所有候选共享归一化分母。这改变了损失组织及分布式实现的约束，但仍需要设计正负比例、负例采样、batch和偏置。不能从“用了sigmoid”直接推出所有设置更省、更稳或更准确。</p>\n  <h3>8. CLIP能做什么，不能保证什么</h3>\n  <p>它擅长建立可复用的图文语义相似度，支持检索、开放词表分类和视觉编码器初始化。它没有在这里使用自回归文字解码器，因此不会仅凭对比损失生成一段解释。</p>\n  <p>全图匹配目标也可能忽略数量、否定、关系和小字。“两只狗”与“三只狗”共享主要语义，“狗追人”与“人追狗”都包含相同实体；如果训练监督不足，向量可很相近。背景与主体共现会形成捷径，错误alt文本也可能让模型学错关联。</p>\n  <p>还有一个常见误区：CLIP视觉空间对齐的是它自己的文本编码器输出，并不等于已对齐Vicuna/Qwen的词向量。维度一致也不代表语义接口一致。下一讲的连接器与后续训练就是为了处理这个新接口。</p>\n  <h3>练习</h3>\n  <details class=\"quiz\"><summary>🧠 N=32、d=768时，X、S形状分别是什么？——</summary><div class=\"qa\"><b>答:</b><code>[32,768]</code>和<code>[32,32]</code>；S不是视觉patch网格。</div></details>\n  <details class=\"quiz\"><summary>🧠 一批中两段描述都正确描述同一类狗，能把其中一段当绝对负例吗？——</summary><div class=\"qa\"><b>答:</b>未必，它可能是假负例；训练需要关注配对噪声和重复语义。</div></details>\n  <details class=\"quiz\"><summary>🧠 把候选类别加一项，会改变softmax概率吗？——</summary><div class=\"qa\"><b>答:</b>会改变分母；原有相似度本身可以不变。</div></details>\n  <details class=\"quiz\"><summary>🧠 图文相似度高，能证明图片里不存在违规元素吗？——</summary><div class=\"qa\"><b>答:</b>不能，匹配分数不是该风险标签的完整证据，局部细节还可能被全局表示忽略。</div></details>\n  <details class=\"quiz\"><summary>🧠 CLIP对齐后为什么还要训练VLM连接器？——</summary><div class=\"qa\"><b>答:</b>LLM的维度、语义分布和生成目标不同，新的跨模态接口需要适配。</div></details>\n  "},
{id:"l3", grp:"前世 · 视觉语言地基与桥接", kick:"Lecture 3", title:"桥接时代:BLIP-2 与 Flamingo", lead:"如何把「冻结的视觉」接到「冻结的语言」——连接器思想的诞生。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议时长40–45分钟。前置：L1的加权读取、L2的图文特征。学完应能区分“视觉信息从输入前缀进入”与“在语言层中被读取”，解释Q-Former和Perceiver Resampler如何压缩视觉序列。</div>\n  <h3>1. 两个强模型为什么不能直接插线</h3>\n  <p>假设视觉编码器输出<code>A:[L,Dv]</code>，语言模型处理向量<code>[序列长度,Dl]</code>。Dv与Dl可能不同，这是尺寸问题；即使相同，视觉特征的数值分布与语言词嵌入也不同，这是学习接口问题。还要决定视觉信息从哪里进入LLM：当成前缀token，还是让语言层通过交叉注意力读取它。</p>\n  <p>为什么不直接把两侧全部重训？视觉编码器和LLM已用大量数据训练；全量训练成本高，新图文数据可能又不足以保留原有能力。冻结原模型、只训练桥接部分，是一种借用已有能力的工程选择。冻结表示不更新参数，并不表示不能做前向计算，也不表示它没有任何输入梯度路径。</p>\n  <h3>2. 先统一理解query、key、value</h3>\n  <p>query即一次读取需求，key用于判断哪个位置匹配需求，value是最后被读取的内容。它们不是三份独立标注，而是输入向量经过不同投影得到的表示。</p>\n  <p>一次点积交叉注意力可写成：</p>\n  <p><code>Attention(Q,K,V)=softmax(QKᵀ/√d)V</code>。</p>\n  <p>若Q有M行、K和V有L行，则相似度矩阵为<code>[M,L]</code>，softmax对L个可读位置归一化，输出仍有M行。这里d是每个query/key的向量宽度。也就是M个需求分别从L个视觉位置读取一次，得到M个结果。√d用于抑制维度增大时点积分布尺度增长；它不保证不同模型都拥有相同的温度或校准。</p>\n  <p>多头注意力先把向量映到不同子空间，每个头单独读，再拼接与投影。不能简单把每个头解释成“一个识别颜色，一个识别动物”：这种分工不是人工规定，也未必如此稳定。</p>\n  <h3>3. BLIP-2的Q-Former：让少量query替LLM提取视觉信息</h3>\n  <p>Q-Former是一组可学习query加一个Transformer。以经典配置为例，使用32个query，每个query最初是一条可学习的向量，不对应“狗/天空/人物”这样的固定类别。训练后它们可形成互补的读取行为。</p>\n  <p>query之间可以通过自注意力交流，又通过交叉注意力读取冻结视觉编码器的A。最后得到32个视觉相关输出，再投影到LLM输入维度，作为视觉前缀交给冻结LLM。</p>\n  <div class=\"flow\">图像 → 冻结视觉编码器 → L个视觉特征 A\n                            ↑ K,V\n32个可学习query → 自注意力 + 交叉注意力 → 32个浓缩输出\n                                                  ↓ 线性投影\n                                              32个LLM前缀\n文本词嵌入 ────────────────────────────────────┬─────┘\n                                               ↓\n                                         冻结LLM生成文字</div>\n  <p>query没有“先知道该抽取什么”的魔法；训练目标告诉整个Q-Former，提取哪些信息能更好完成图文匹配或生成。32是一个模型设计选择，不是所有任务的最佳压缩率。</p>\n  <h3>4. 先手算一个query，再看维度与压缩量</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 580\" role=\"img\" aria-labelledby=\"l3-query-read-title l3-query-read-desc\" class=\"d1-figure\">\n<title id=\"l3-query-read-title\">Query 是读取需求：同一组 K/V，读出不同混合</title><desc id=\"l3-query-read-desc\">令K=V为三个二维区域向量，q1=(1,0)、q2=(0,1)。省略投影与根号d缩放，两组softmax得到不同的加权输出。query数量决定输出行数。</desc>\n<defs><marker id=\"l3-query-read-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"578\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">Query 是读取需求：同一组 K/V，读出不同混合</tspan>\n</text>\n<rect x=\"36\" y=\"104\" width=\"252\" height=\"129\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"162.0\" y=\"136\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"162.0\" dy=\"0\">共同 K = V</tspan>\n</text>\n<text x=\"162.0\" y=\"167\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"162.0\" dy=\"0\">a₁=(1,0)  a₂=(0,1)</tspan>\n<tspan x=\"162.0\" dy=\"27.55\">a₃=(1,1)</tspan>\n</text>\n<rect x=\"36\" y=\"298\" width=\"252\" height=\"129\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"162.0\" y=\"330\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"162.0\" dy=\"0\">两个 query</tspan>\n</text>\n<text x=\"162.0\" y=\"361\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"162.0\" dy=\"0\">q₁=(1,0)</tspan>\n<tspan x=\"162.0\" dy=\"27.55\">q₂=(0,1)</tspan>\n</text>\n<text x=\"348\" y=\"91\" font-size=\"22\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"348\" dy=\"0\">每个 query 都对 3 个区域归一化</tspan>\n</text>\n<text x=\"345\" y=\"171\" font-size=\"25\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"345\" dy=\"0\">q₁</tspan>\n</text>\n<rect x=\"391\" y=\"131\" width=\"145\" height=\"80\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"463\" y=\"162\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"463\" dy=\"0\">a1</tspan>\n</text>\n<text x=\"463\" y=\"193\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"463\" dy=\"0\">0.4223</tspan>\n</text>\n<rect x=\"552\" y=\"131\" width=\"145\" height=\"80\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"624\" y=\"162\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"624\" dy=\"0\">a2</tspan>\n</text>\n<text x=\"624\" y=\"193\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"624\" dy=\"0\">0.1554</tspan>\n</text>\n<rect x=\"713\" y=\"131\" width=\"145\" height=\"80\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"785\" y=\"162\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"785\" dy=\"0\">a3</tspan>\n</text>\n<text x=\"785\" y=\"193\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"785\" dy=\"0\">0.4223</tspan>\n</text>\n<text x=\"490\" y=\"255\" font-size=\"23\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"490\" dy=\"0\">Σ αᵢVᵢ  →  (0.8446, 0.5777)</tspan>\n</text>\n<text x=\"345\" y=\"354\" font-size=\"25\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"345\" dy=\"0\">q₂</tspan>\n</text>\n<rect x=\"391\" y=\"314\" width=\"145\" height=\"80\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"463\" y=\"345\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"463\" dy=\"0\">a1</tspan>\n</text>\n<text x=\"463\" y=\"376\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"463\" dy=\"0\">0.1554</tspan>\n</text>\n<rect x=\"552\" y=\"314\" width=\"145\" height=\"80\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"624\" y=\"345\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"624\" dy=\"0\">a2</tspan>\n</text>\n<text x=\"624\" y=\"376\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"624\" dy=\"0\">0.4223</tspan>\n</text>\n<rect x=\"713\" y=\"314\" width=\"145\" height=\"80\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"785\" y=\"345\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"785\" dy=\"0\">a3</tspan>\n</text>\n<text x=\"785\" y=\"376\" font-size=\"23\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"785\" dy=\"0\">0.4223</tspan>\n</text>\n<text x=\"490\" y=\"438\" font-size=\"23\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"490\" dy=\"0\">Σ αᵢVᵢ  →  (0.5777, 0.8446)</tspan>\n</text>\n<path d=\"M298,180 L329,180\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-query-read-arrow)\" class=\"d1-s-acc\" />\n<path d=\"M298,362 L329,362\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-query-read-arrow)\" class=\"d1-s-grn\" />\n<path d=\"M298,205 L319,205 L319,339 L329,339\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-query-read-arrow)\" class=\"d1-s-acc\" />\n<path d=\"M298,331 L308,331 L308,154 L329,154\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-query-read-arrow)\" class=\"d1-s-grn\" />\n<rect x=\"36\" y=\"486\" width=\"879\" height=\"54\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-gold d1-s-amber\" />\n<text x=\"475.5\" y=\"518\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-amber\">\n<tspan x=\"475.5\" dy=\"0\">压缩的是输出行数，视觉编码器仍需处理原图</tspan>\n</text>\n</g></svg><figcaption>令K=V为三个二维区域向量，q1=(1,0)、q2=(0,1)。省略投影与根号d缩放，两组softmax得到不同的加权输出。query数量决定输出行数。 教学算例省略可学习投影和 √d 缩放；query 不是固定的人工对象类别。</figcaption></figure>\n  <p>为了手算，省略√d缩放和可学习投影，设Q只有一行q=(1,0)，K=V包含三行(1,0)、(0,1)、(1,1)。分数为(1,0,1)，softmax约为(0.4223,0.1554,0.4223)，输出是(0.8446,0.5777)。</p>\n  <p>再取query q₂=(0,1)，分数为(0,1,1)，权重约(0.1554,0.4223,0.4223)，输出为(0.5777,0.8446)。两个query读出不同混合；输出行数由query数量决定，而不是由图像patch数量决定。</p>\n  <p>真实场景若A有576行，Q-Former输出32行，则LLM侧视觉长度降到约1/18。<b>这不代表整个系统成本按同一比例下降</b>：视觉编码器仍要计算原图，Q-Former交叉注意力仍需处理32×576个query—位置关系，LLM还要处理文本。更强压缩也可能损失小字、对象数量与精确位置。</p>\n  <h3>5. BLIP-2为什么分训练阶段</h3>\n  <p>第一阶段让Q-Former学会有效连接图像与文字。经典方案包含三类任务：图文对比要求整体表示匹配；图文匹配判断图文是否为一对；以图像为条件生成文本要求query抽出的信息足以支持描述。不同任务会使用不同注意力掩码，控制query与文本的交流，不能把三种任务当同一个loss的别名。</p>\n  <p>第二阶段连接冻结LLM。Q-Former输出经投影变成LLM输入，文本生成损失继续调整Q-Former与投影。LLM参数可以不更新，但它对前缀如何影响下一词概率的计算，仍会提供梯度给桥接部分。</p>\n  <p>这里“冻结双塔”不表示整个过程只有一个线性层在训练。Q-Former本身是有参数、有多层注意力的模块；冻结节省的是两大已有模型的更新，而不是免除新桥的训练。</p>\n  <h3>6. Flamingo：视觉信息不只是在最前面塞一段前缀</h3>\n  <p>Flamingo保留视觉编码器与语言模型，引入Perceiver Resampler，把变长的图片/视频特征重采样成固定数量视觉latent。它同样使用可学习latent向视觉特征做交叉注意力，但不能仅凭“都有query”说它就是Q-Former的同名变体。</p>\n  <p>随后在语言模型的若干层之间插入可训练的gated cross-attention模块。语言层的hidden states作为Q，视觉latent作为K/V，语言表示可在中途再次访问视觉信息。输出用门控残差合回语言流，例如示意为：</p>\n  <p><code>h_new = h + tanh(g) × CrossAttention(h, visual_latents)</code>。</p>\n  <p>g是可学习门控参数，可初始化为0，让开始训练时视觉新分支贡献接近0，保留已有语言行为；之后逐渐学会使用视觉证据。实际块还包含其他层，公式只展示门控残差的核心，不代表整套Flamingo实现。</p>\n  <h3>7. 多图交错与few-shot具体怎么工作</h3>\n  <p>提示可以组织为“图1→问题1→答案1→图2→问题2→答案2→新图→新问题”。语言模型沿交错序列处理示例；视觉访问掩码决定某段文本可以读取哪些图像，避免把未来图像或无关图片当条件。图像位置标记只是结构边界，图片本身仍通过视觉分支提供特征。</p>\n  <p>few-shot的含义是推理时在上下文里给几个例子，让模型模仿任务规则，例如先给两张图的“只回答颜色”示例，再问新图。没有因此更新参数；更新的是上下文。它可能帮助模型理解格式，却不能保证新增的视觉概念被少量示例彻底学会，也会受示例顺序、格式和上下文长度影响。</p>\n  <h3>8. 放在同一张表里，差异才看得清</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 650\" role=\"img\" aria-labelledby=\"l3-bridge-comparison-title l3-bridge-comparison-desc\" class=\"d1-figure\">\n<title id=\"l3-bridge-comparison-title\">BLIP-2 与 Flamingo：视觉信息从哪里进入 LLM？</title><desc id=\"l3-bridge-comparison-desc\">BLIP-2将Q-Former的输出投影为LLM输入前缀；Flamingo经Perceiver压缩后，在语言层之间用带门控的交叉注意力重新读取。灰色模块为冻结，青色模块为训练。</desc>\n<defs><marker id=\"l3-bridge-comparison-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"648\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">BLIP-2 与 Flamingo：视觉信息从哪里进入 LLM？</tspan>\n</text>\n<text x=\"32\" y=\"87\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"32\" dy=\"0\">BLIP-2：先提炼，作为输入前缀</tspan>\n</text>\n<rect x=\"35\" y=\"122\" width=\"220\" height=\"110\" rx=\"12\" stroke-width=\"1.5\" stroke-dasharray=\"7 5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"145.0\" y=\"154\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"145.0\" dy=\"0\">视觉编码器 · 冻结</tspan>\n</text>\n<text x=\"145.0\" y=\"185\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"145.0\" dy=\"0\">L 个视觉特征</tspan>\n</text>\n<rect x=\"302\" y=\"122\" width=\"268\" height=\"110\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"436.0\" y=\"154\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"436.0\" dy=\"0\">Q-Former · 训练</tspan>\n</text>\n<text x=\"436.0\" y=\"185\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"436.0\" dy=\"0\">32 个 query → 32 输出</tspan>\n</text>\n<path d=\"M265,177 L288,177\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-bridge-comparison-arrow)\" class=\"d1-s-acc\" />\n<path d=\"M581,177 L617,177\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-bridge-comparison-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"630\" y=\"122\" width=\"108\" height=\"110\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"684.0\" y=\"154\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"684.0\" dy=\"0\">投影</tspan>\n</text>\n<text x=\"684.0\" y=\"185\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"684.0\" dy=\"0\">可训练</tspan>\n</text>\n<path d=\"M746,177 L758,177\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-bridge-comparison-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"772\" y=\"122\" width=\"144\" height=\"110\" rx=\"12\" stroke-width=\"1.5\" stroke-dasharray=\"7 5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"844.0\" y=\"154\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"844.0\" dy=\"0\">LLM · 冻结</tspan>\n</text>\n<text x=\"844.0\" y=\"185\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"844.0\" dy=\"0\">32 前缀</tspan>\n<tspan x=\"844.0\" dy=\"27.55\">+ 文本</tspan>\n</text>\n<text x=\"32\" y=\"290\" font-size=\"23\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"32\" dy=\"0\">Flamingo：压缩后，在语言层内部读取</tspan>\n</text>\n<rect x=\"35\" y=\"333\" width=\"220\" height=\"108\" rx=\"12\" stroke-width=\"1.5\" stroke-dasharray=\"7 5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"145.0\" y=\"365\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"145.0\" dy=\"0\">视觉编码器 · 冻结</tspan>\n</text>\n<text x=\"145.0\" y=\"396\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"145.0\" dy=\"0\">图片 / 视频特征</tspan>\n</text>\n<rect x=\"304\" y=\"333\" width=\"270\" height=\"108\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"439.0\" y=\"365\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"439.0\" dy=\"0\">Perceiver · 训练</tspan>\n</text>\n<text x=\"439.0\" y=\"396\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"439.0\" dy=\"0\">固定数量视觉 latent</tspan>\n</text>\n<path d=\"M265,387 L290,387\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-bridge-comparison-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"635\" y=\"314\" width=\"280\" height=\"78\" rx=\"12\" stroke-width=\"1.5\" stroke-dasharray=\"7 5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"775.0\" y=\"346\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"775.0\" dy=\"0\">语言层 · 冻结</tspan>\n</text>\n<rect x=\"635\" y=\"431\" width=\"280\" height=\"90\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"775.0\" y=\"463\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"775.0\" dy=\"0\">gated cross-attn</tspan>\n</text>\n<text x=\"775.0\" y=\"494\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"775.0\" dy=\"0\">Q=语言；K/V=视觉</tspan>\n</text>\n<path d=\"M584,387 L615,463\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-bridge-comparison-arrow)\" class=\"d1-s-grn\" />\n<path d=\"M775,401 L775,421\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-bridge-comparison-arrow)\" class=\"d1-s-acc\" />\n<rect x=\"635\" y=\"551\" width=\"280\" height=\"58\" rx=\"12\" stroke-width=\"1.5\" stroke-dasharray=\"7 5\" class=\"d1-f-gray d1-s-mut\" />\n<text x=\"775.0\" y=\"583\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-mut\">\n<tspan x=\"775.0\" dy=\"0\">下一语言层 · 冻结</tspan>\n</text>\n<path d=\"M775,531 L775,541\" fill=\"none\" stroke-width=\"2.5\" marker-end=\"url(#l3-bridge-comparison-arrow)\" class=\"d1-s-acc\" />\n<text x=\"40\" y=\"514\" font-size=\"21\" text-anchor=\"start\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"40\" dy=\"0\">灰色虚线框：参数冻结</tspan>\n<tspan x=\"40\" dy=\"30.45\">青色实线框：新接口可训练</tspan>\n<tspan x=\"40\" dy=\"30.45\">冻结 LLM 仍能向接口传梯度。</tspan>\n</text>\n</g></svg><figcaption>BLIP-2将Q-Former的输出投影为LLM输入前缀；Flamingo经Perceiver压缩后，在语言层之间用带门控的交叉注意力重新读取。灰色模块为冻结，青色模块为训练。 框图展示核心接口；没有画出所有 Transformer 子层与训练目标。</figcaption></figure>\n  <table><tr><th>设计</th><th>BLIP-2典型路径</th><th>Flamingo典型路径</th></tr><tr><td>压缩模块</td><td>Q-Former query读取视觉特征</td><td>Perceiver Resampler重采样</td></tr><tr><td>视觉信息进入语言侧</td><td>浓缩query投影为输入前缀</td><td>语言层内新增gated cross-attention</td></tr><tr><td>谁提供读取需求</td><td>Q-Former的query及其任务训练</td><td>压缩latent与语言hidden state分两层读取</td></tr><tr><td>典型教学重点</td><td>冻结LLM也能学习输入接口</td><td>多图交错、视觉重读与in-context学习</td></tr></table>\n  <p>连接器选择没有脱离任务的“最先进”。如果目标是OCR，压成32行可能过度；如果要处理很多图，固定latent能控制语言侧长度；如果要尽量复用现成LLM代码，输入前缀通常比改每层结构更简单。</p>\n  <h3>9. 可运行的交叉读取最小代码</h3>\n  <div class=\"flow\">import torch\nq = torch.tensor([[1., 0.], [0., 1.]])\nvisual = torch.tensor([[1., 0.], [0., 1.], [1., 1.]])\nweights = (q @ visual.T).softmax(-1)  # 手算示例省略缩放\nlatent = weights @ visual\nprint(weights.shape, latent.shape)  # [2,3]、[2,2]\nprint(latent)                       # 约[[.8446,.5777],[.5777,.8446]]</div>\n  <p>它只模拟query读取，不是完整Q-Former。真正实现还需投影、残差、归一化、多头、多层、训练任务与掩码；漏掉这些，不能把三行代码称成可用BLIP-2。</p>\n  <h3>练习</h3>\n  <details class=\"quiz\"><summary>🧠 输入576个视觉位置、32个query，cross-attention权重是什么形状？——</summary><div class=\"qa\"><b>答:</b>每个头通常为<code>[32,576]</code>，输出32个向量。</div></details>\n  <details class=\"quiz\"><summary>🧠 冻结LLM后，答案loss能训练前缀投影吗？——</summary><div class=\"qa\"><b>答:</b>能，只要输入前缀参与计算图且未切断梯度。</div></details>\n  <details class=\"quiz\"><summary>🧠 图像被压为32个token是否等于读图成本降低18倍？——</summary><div class=\"qa\"><b>答:</b>只描述进入LLM的视觉序列压缩，不包含视觉编码器和桥接模块成本。</div></details>\n  <details class=\"quiz\"><summary>🧠 few-shot示例是在微调参数吗？——</summary><div class=\"qa\"><b>答:</b>不是，它们是推理上下文。</div></details>\n  <details class=\"quiz\"><summary>🧠 为什么固定latent对多图友好，却可能不利于小字？——</summary><div class=\"qa\"><b>答:</b>控制序列预算，但有限瓶颈可能难以保留高密度细节。</div></details>\n  <p>下一讲将看到另一种取舍：不先用复杂query压缩，而是把patch直接投影成LLM可读向量，再用指令数据训练接口。</p>\n  "},
{id:"l4", grp:"今生 · 视觉指令与通用VLM", kick:"Lecture 4", title:"范式确立:LLaVA 与视觉指令微调", lead:"一个简单到能逐行读完的配方,定义了现代 VLM。", html:"\n  <div class=\"note\"><b>本讲导航</b>:建议时长40–45分钟。前置：知道视觉特征、向量投影和逐词生成；本讲从输入到输出逐步解释。学完应能算出576的来源，画出拼接后的序列，说明两个训练阶段各更新什么，以及为何极简结构仍需要高质量指令数据。</div>\n  <h3>1. 极简方案解决的是接口，不是取消视觉学习</h3>\n  <p>Q-Former先压缩，Flamingo在语言层内插入视觉读取。LLaVA选择更直接的路线：把视觉patch特征投影成与LLM词嵌入同维度的连续向量，作为序列的一部分输入LLM；再用图文描述和视觉指令训练这条接口。</p>\n  <p>“简单”指新增结构少，不是模型尺寸小，也不是只训练几条数据就能可靠。一个巨大且已训练好的视觉编码器与语言模型仍然是底座。没有训练接口，随机投影后的视觉向量即使尺寸正确，也不是语言模型能稳定解释的条件。</p>\n  <h3>2. 先分清版本，才能讨论具体数字</h3>\n  <figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 570\" role=\"img\" aria-labelledby=\"l4-llava-versions-title l4-llava-versions-desc\" class=\"d1-figure\">\n<title id=\"l4-llava-versions-title\">别混版本：初版 LLaVA 与 LLaVA-1.5</title><desc id=\"l4-llava-versions-desc\">初版经典配置为224分辨率、256patch与线性投影；1.5常用336分辨率、576patch与两层MLP。增加分辨率改变位置数，改变连接器深度不必改变位置数。</desc>\n<defs><marker id=\"l4-llava-versions-arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto-start-reverse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"context-stroke\" /></marker></defs>\n<g>\n<rect x=\"1\" y=\"1\" width=\"958\" height=\"568\" rx=\"18\" stroke-width=\"1.5\" class=\"d1-f-panel d1-s-line\" />\n<text x=\"32\" y=\"43\" font-size=\"28\" text-anchor=\"start\" font-weight=\"700\" class=\"d1-f-ink\">\n<tspan x=\"32\" dy=\"0\">别混版本：初版 LLaVA 与 LLaVA-1.5</tspan>\n</text>\n<rect x=\"35\" y=\"93\" width=\"420\" height=\"386\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"245\" y=\"130\" font-size=\"26\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"245\" dy=\"0\">初版 LLaVA</tspan>\n</text>\n<rect x=\"73\" y=\"163\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"96\" y=\"163\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"119\" y=\"163\" width=\"20\" heig ">\n<tspan x=\"302\" dy=\"0\">256 个视觉位置</tspan>\n</text>\n<rect x=\"73\" y=\"324\" width=\"344\" height=\"99\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-acc\" />\n<text x=\"245.0\" y=\"356\" font-size=\"22\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-acc\">\n<tspan x=\"245.0\" dy=\"0\">线性投影</tspan>\n</text>\n<text x=\"245.0\" y=\"387\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"400\" class=\"d1-f-ink\">\n<tspan x=\"245.0\" dy=\"0\">映射到 LLM 隐藏维度</tspan>\n</text>\n<rect x=\"504\" y=\"93\" width=\"420\" height=\"386\" rx=\"12\" stroke-width=\"1.5\" class=\"d1-f-green d1-s-grn\" />\n<text x=\"714\" y=\"130\" font-size=\"26\" text-anchor=\"middle\" font-weight=\"700\" class=\"d1-f-grn\">\n<tspan x=\"714\" dy=\"0\">LLaVA-1.5</tspan>\n</text>\n<rect x=\"542\" y=\"163\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"565\" y=\"163\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"588\" y=\"163\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"611\" y=\"163\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"634\" y=\"163\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"657\" y=\"163\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"542\" y=\"186\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"565\" y=\"186\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"588\" y=\"186\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"611\" y=\"186\" width=\"20\" height=\"20\" rx=\"3\" stroke-width=\"1.5\" class=\"d1-f-sky d1-s-edge\" />\n<rect x=\"634\" y=\"186\" width=\"20\" height=\"20\" rx=\"
