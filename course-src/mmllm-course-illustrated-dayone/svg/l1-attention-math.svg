<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="l1-attention-math-title l1-attention-math-desc" class="d1-figure">
<title id="l1-attention-math-title">把注意力算完：3 个区域 → 1 个上下文</title><desc id="l1-attention-math-desc">区域向量分别为(1,0)、(0,1)、(1,1)，人为给定分数ln4、0、ln5，softmax得到0.4、0.1、0.5；加权结果为(0.9,0.6)。</desc>
<defs><marker id="l1-attention-math-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke" /></marker></defs>
<g>
<rect x="1" y="1" width="958" height="578" rx="18" stroke-width="1.5" class="d1-f-panel d1-s-line" />
<text x="32" y="43" font-size="28" text-anchor="start" font-weight="700" class="d1-f-ink">
<tspan x="32" dy="0">把注意力算完：3 个区域 → 1 个上下文</tspan>
</text>
<text x="32" y="84" font-size="23" text-anchor="start" font-weight="700" class="d1-f-acc">
<tspan x="32" dy="0">① 区域向量 aᵢ</tspan>
</text>
<text x="288" y="84" font-size="23" text-anchor="start" font-weight="700" class="d1-f-acc">
<tspan x="288" dy="0">② 分数 eᵢ</tspan>
</text>
<text x="520" y="84" font-size="23" text-anchor="start" font-weight="700" class="d1-f-grn">
<tspan x="520" dy="0">③ softmax 权重 αᵢ</tspan>
</text>
<rect x="36" y="113" width="192" height="72" rx="12" stroke-width="1.5" class="d1-f-sky d1-s-acc" />
<text x="132.0" y="145" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-acc">
<tspan x="132.0" dy="0">a1 = (1, 0)</tspan>
</text>
<path d="M238,149 L281,149" fill="none" stroke-width="2.5" marker-end="url(#l1-attention-math-arrow)" class="d1-s-acc" />
<text x="364" y="156" font-size="24" text-anchor="middle" font-weight="400" class="d1-f-ink">
<tspan x="364" dy="0">ln 4</tspan>
</text>
<path d="M447,149 L490,149" fill="none" stroke-width="2.5" marker-end="url(#l1-attention-math-arrow)" class="d1-s-acc" />
<rect x="512" y="131" width="300" height="40" rx="5" stroke-width="1.5" class="d1-f-gray d1-s-line" />
<rect x="512" y="131" width="120.0" height="40" rx="5" stroke-width="1.5" class="d1-f-green d1-s-grn" />
<text x="841" y="157" font-size="25" text-anchor="start" font-weight="700" class="d1-f-grn">
<tspan x="841" dy="0">0.4</tspan>
</text>
<rect x="36" y="205" width="192" height="72" rx="12" stroke-width="1.5" class="d1-f-sky d1-s-acc" />
<text x="132.0" y="237" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-acc">
<tspan x="132.0" dy="0">a2 = (0, 1)</tspan>
</text>
<path d="M238,241 L281,241" fill="none" stroke-width="2.5" marker-end="url(#l1-attention-math-arrow)" class="d1-s-acc" />
<text x="364" y="248" font-size="24" text-anchor="middle" font-weight="400" class="d1-f-ink">
<tspan x="364" dy="0">ln 1 = 0</tspan>
</text>
<path d="M447,241 L490,241" fill="none" stroke-width="2.5" marker-end="url(#l1-attention-math-arrow)" class="d1-s-acc" />
<rect x="512" y="223" width="300" height="40" rx="5" stroke-width="1.5" class="d1-f-gray d1-s-line" />
<rect x="512" y="223" width="30.0" height="40" rx="5" stroke-width="1.5" class="d1-f-green d1-s-grn" />
<text x="841" y="249" font-size="25" text-anchor="start" font-weight="700" class="d1-f-grn">
<tspan x="841" dy="0">0.1</tspan>
</text>
<rect x="36" y="297" width="192" height="72" rx="12" stroke-width="1.5" class="d1-f-sky d1-s-acc" />
<text x="132.0" y="329" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-acc">
<tspan x="132.0" dy="0">a3 = (1, 1)</tspan>
</text>
<path d="M238,333 L281,333" fill="none" stroke-width="2.5" marker-end="url(#l1-attention-math-arrow)" class="d1-s-acc" />
<text x="364" y="340" font-size="24" text-anchor="middle" font-weight="400" class="d1-f-ink">
<tspan x="364" dy="0">ln 5</tspan>
</text>
<path d="M447,333 L490,333" fill="none" stroke-width="2.5" marker-end="url(#l1-attention-math-arrow)" class="d1-s-acc" />
<rect x="512" y="315" width="300" height="40" rx="5" stroke-width="1.5" class="d1-f-gray d1-s-line" />
<rect x="512" y="315" width="150.0" height="40" rx="5" stroke-width="1.5" class="d1-f-green d1-s-grn" />
<text x="841" y="341" font-size="25" text-anchor="start" font-weight="700" class="d1-f-grn">
<tspan x="841" dy="0">0.5</tspan>
</text>
<rect x="38" y="411" width="878" height="111" rx="12" stroke-width="1.5" class="d1-f-green d1-s-grn" />
<text x="477.0" y="443" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-grn">
<tspan x="477.0" dy="0">④ 加权求和 z = Σ αᵢaᵢ</tspan>
</text>
<text x="477.0" y="474" font-size="19" text-anchor="middle" font-weight="400" class="d1-f-ink">
<tspan x="477.0" dy="0">0.4×(1,0) + 0.1×(0,1) + 0.5×(1,1) = (0.9, 0.6)</tspan>
</text>
</g></svg>