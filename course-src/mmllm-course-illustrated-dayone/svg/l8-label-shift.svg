</text>
<text x="742.0" y="525" font-size="19" text-anchor="middle" font-weight="400" class="d1-f-ink">
<tspan x="742.0" dy="0">求和 / 平均后反向传播</tspan>
</text>
<path d="M557,514 L24,514 L24,212 L91,194" fill="none" stroke-width="3" marker-end="url(#l8-label-shift-arrow)" stroke-dasharray="7 5" class="d1-s-red" />
<text x="33" y="603" font-size="20" text-anchor="start" font-weight="400" class="d1-f-red">
<tspan x="33" dy="0">红色虚线：loss 可经注意力回到视觉输入；是否更新参数取决于冻结设置。</tspan>
