<tspan x="199" dy="0">−100</tspan>
</text>
<rect x="262" y="274" width="101" height="65" rx="7" stroke-width="1.5" class="d1-f-gray d1-s-mut" />
<text x="312" y="313" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-mut">
<tspan x="312" dy="0">−100</tspan>
