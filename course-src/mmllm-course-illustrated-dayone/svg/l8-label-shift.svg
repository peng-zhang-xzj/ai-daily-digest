</text>
<path d="M563,196 L631,261" fill="none" stroke-width="2.5" marker-end="url(#l8-label-shift-arrow)" class="d1-s-grn" />
<path d="M676,196 L744,261" fill="none" stroke-width="2.5" marker-end="url(#l8-label-shift-arrow)" class="d1-s-grn" />
<path d="M789,196 L857,261" fill="none" stroke-width="2.5" marker-end="url(#l8-label-shift-arrow)" class="d1-s-grn" />
<text x="386" y="391" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-grn">
<tspan x="386" dy="0">logits[4]→狗   logits[5]→坐着   logits[6]→EOS</tspan>
</text>
<rect x="568" y="462" width="348" height="100" rx="12" stroke-width="1.5" class="d1-f-green d1-s-grn" />
<text x="742.0" y="494" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-grn">
