<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="l8-label-shift-title l8-label-shift-desc" class="d1-figure">
<title id="l8-label-shift-title">监督 mask 与 shift：只计答案，也能训练视觉路径</title><desc id="l8-label-shift-desc">八个输入位置中，前五个label忽略，回答狗、坐着、EOS为三个目标。位置4、5、6的logits分别预测位置5、6、7；答案loss仍可沿注意力向视觉路径传梯度。</desc>
<defs><marker id="l8-label-shift-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke" /></marker></defs>
<g>
<rect x="1" y="1" width="958" height="648" rx="18" stroke-width="1.5" class="d1-f-panel d1-s-line" />
<text x="32" y="43" font-size="28" text-anchor="start" font-weight="700" class="d1-f-ink">
<tspan x="32" dy="0">监督 mask 与 shift：只计答案，也能训练视觉路径</tspan>
</text>
<text x="32" y="89" font-size="23" text-anchor="start" font-weight="700" class="d1-f-acc">
