</text>
<rect x="601" y="274" width="101" height="65" rx="7" stroke-width="1.5" class="d1-f-green d1-s-grn" />
<text x="651" y="313" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-grn">
<tspan x="651" dy="0">狗</tspan>
</text>
<rect x="714" y="274" width="101" height="65" rx="7" stroke-width="1.5" class="d1-f-green d1-s-grn" />
<text x="764" y="313" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-grn">
