<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="l3-query-read-title l3-query-read-desc" class="d1-figure">
<title id="l3-query-read-title">Query 是读取需求：同一组 K/V，读出不同混合</title><desc id="l3-query-read-desc">令K=V为三个二维区域向量，q1=(1,0)、q2=(0,1)。省略投影与根号d缩放，两组softmax得到不同的加权输出。query数量决定输出行数。</desc>
<defs><marker id="l3-query-read-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke" /></marker></defs>
<g>
<rect x="1" y="1" width="958" height="578" rx="18" stroke-width="1.5" class="d1-f-panel d1-s-line" />
<text x="32" y="43" font-size="28" text-anchor="start" font-weight="700" class="d1-f-ink">
<tspan x="32" dy="0">Query 是读取需求：同一组 K/V，读出不同混合</tspan>
</text>
<rect x="36" y="104" width="252" height="129" rx="12" stroke-width="1.5" class="d1-f-gray d1-s-mut" />
<text x="162.0" y="136" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-mut">
<tspan x="162.0" dy="0">共同 K = V</tspan>
</text>
<text x="162.0" y="167" font-size="19" text-anchor="middle" font-weight="400" class="d1-f-ink">
<tspan x="162.0" dy="0">a₁=(1,0)  a₂=(0,1)</tspan>
<tspan x="162.0" dy="27.55">a₃=(1,1)</tspan>
</text>
<rect x="36" y="298" width="252" height="129" rx="12" stroke-width="1.5" class="d1-f-green d1-s-grn" />
<text x="162.0" y="330" font-size="22" text-anchor="middle" font-weight="700" class="d1-f-grn">
<tspan x="162.0" dy="0">两个 query</tspan>
</text>
<text x="162.0" y="361" font-size="19" text-anchor="middle" font-weight="400" class="d1-f-ink">
<tspan x="162.0" dy="0">q₁=(1,0)</tspan>
<tspan x="162.0" dy="27.55">q₂=(0,1)</tspan>
</text>
<text x="348" y="91" font-size="22" text-anchor="start" font-weight="700" class="d1-f-acc">
<tspan x="348" dy="0">每个 query 都对 3 个区域归一化</tspan>
</text>
<text x="345" y="171" font-size="25" text-anchor="start" font-weight="700" class="d1-f-grn">
