<rect x="159.25" y="200.2" width="8" height="22.400000000000002" rx="2" stroke-width="1.5" class="d1-f-brown d1-s-brown" />
<path d="M107.5,187.60000000000002 L91.75,166.6" fill="none" stroke-width="6" class="d1-s-brown" />
<circle cx="184.0" cy="170.8" r="2" stroke-width="2" class="d1-f-ink d1-s-ink" />
