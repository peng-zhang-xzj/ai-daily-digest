<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="l8-training-recipes-title l8-training-recipes-desc" class="d1-figure">
<title id="l8-training-recipes-title">教学三段式 ≠ 每个 VLM 的真实训练配方</title><desc id="l8-training-recipes-desc">上行是连接器对齐、SFT、偏好对齐的简化教学框架；下行按Qwen2.5-VL报告区分三阶段预训练与SFT+DPO，后两步冻结ViT。不能把LLaVA冻结策略推广到全部模型。</desc>
<defs><marker id="l8-training-recipes-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke" /></marker></defs>
<g>
<rect x="1" y="1" width="958" height="648" rx="18" stroke-width="1.5" class="d1-f-panel d1-s-line" />
<text x="32" y="43" font-size="28" text-anchor="start" font-weight="700" class="d1-f-ink">
